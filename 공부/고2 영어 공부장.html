tle'를 고르세요. (오답 'apparent'는 반대 또는 다른 뜻)"}]},{"ko":"그것은 1980년대 초반에 도입되었고 음식 준비 과정에 혁명을 일으켰다.","en":"It was {0} in the early 1980s and {1} food preparation.","c":[{"o":["introducing","introduced"],"a":1,"tag":"시제·태","why":"주어가 그 동작을 '받는/당하는' 쪽이라 be + p.p. 수동태 'introduced'."},{"o":["revolutionizing","revolutionized"],"a":1,"tag":"병렬·도치·어순","why":"and/or/but으로 연결된 말은 짝이 되는 앞의 동사와 같은 형태로 맞춰요(병렬 구조)."}]},{"ko":"전통적으로, 한 사람이 가족을 위한 저녁 식사를 준비하느라 오후의 대부분을 보냈다.","en":"Traditionally, one person spent the better part of an afternoon {0} an evening meal for a family.","c":[{"o":["fixing","to fix"],"a":0,"tag":"to부정사·동명사","why":"동명사(-ing) 자리예요. 정답 'fixing'."}]},{"ko":"이제 음식을 매우 빠르게 준비하는 것이 가능해졌고, 이러한 준비 시간의 단축은 대부분 여성인 경향이 있었던 가족 내 요리사들을 해방시켰다.","en":"Now, it was possible to prepare foods very quickly, and this shortening of preparation time was {0} for the cooks in the family, most of {1} tended {2} women.","c":[{"o":["liberating","liberated"],"a":0,"tag":"시제·태","why":"be + -ing는 진행형(직접 하고 있음), be + p.p.는 수동(당함). 주어가 직접 하는 동작이라 'liberating'."},{"o":["them","whom"],"a":1,"tag":"관계사·명사절","why":"콤마 뒤에서 두 문장을 하나로 이어 주려면 접속사 역할을 하는 관계대명사(whom/which)가 필요해요. them/it 같은 대명사는 문장을 연결하지 못해요."},{"o":["being","to be"],"a":1,"tag":"to부정사·동명사","why":"'~할, ~하기 위해, ~하는 것' 의미의 to부정사 자리예요. 명사 뒤에서 꾸미거나 목적을 나타낼 때 to + 동사원형."}]},{"ko":"하지만 더 큰 편리함이라는 단기적이고 분명한 영향은 더 이상 한 사람이 가족이 저녁 식사에서 함께 먹기 위해 음식을 준비하지 않게 되는 것의 장기적인 영향을 간과하기 쉽게 만들었다.","en":"But the short-term, obvious implications of greater convenience made it {0} to {1} the long-term implications of no longer {2} one person {3} food for the family {4} together at an evening meal.","c":[{"o":["easy","easily"],"a":0,"tag":"형용사·부사","why":"be·seem·feel·become 같은 동사의 보어, 또는 5형식(make/find/keep + 목적어 + 보어) 자리에는 형용사가 와요(부사 ×)."},{"o":["overlook","recognize"],"a":0,"tag":"어휘","why":"문맥 어휘 문제예요. 해석을 보면서 글의 흐름에 맞는 'overlook'를 고르세요. (오답 'recognize'는 반대 또는 다른 뜻)"},{"o":["having","being had"],"a":0,"tag":"시제·태","why":"주어가 그 동작을 직접 '하는' 쪽이라 능동태 'having'."},{"o":["fix","to fix"],"a":0,"tag":"문형","why":"사역동사(make/let/have)·지각동사(see/hear/feel 등) + 목적어 + 동사원형. help는 원형/to 둘 다 가능."},{"o":["eat","to eat"],"a":1,"tag":"to부정사·동명사","why":"'for + 의미상 주어 + to부정사' (…가 ~하기 위해/~할) 구조예요."}]},{"ko":"시간이 흐르면서, 점점 더 적은 수의 가족들이 저녁을 먹기 위해 함께 둘러앉았다.","en":"As time went on, fewer and fewer families sat down together {0} dinner.","c":[{"o":["eat","to eat"],"a":1,"tag":"to부정사·동명사","why":"'~할, ~하기 위해, ~하는 것' 의미의 to부정사 자리예요."}]},{"ko":"아마도 특별한 경우를 제외하고는, 준비하는 데 오랜 시간이 걸리는 식사는 과거의 사치품이 되었다.","en":"Meals {0} took a long time {1} became a {2} of the past, except perhaps for special occasions.","c":[{"o":["what","that"],"a":1,"tag":"관계사·명사절","why":"what은 '~하는 것'이라는 뜻으로 선행사(앞의 명사)를 이미 품고 있어서, 앞에 꾸며 줄 명사가 있거나 뒤 문장이 완전하면 쓸 수 없어요. → that"},{"o":["preparing","to prepare"],"a":1,"tag":"to부정사·동명사","why":"'time' 뒤에는 to부정사(to + 동사원형)가 와요."},{"o":["routine","luxury"],"a":1,"tag":"어휘","why":"문맥 어휘 문제예요. 해석을 보면서 글의 흐름에 맞는 'luxury'를 고르세요. (오답 'routine'는 반대 또는 다른 뜻)"}]},{"ko":"전자레인지가 가정생활에 미친 영향은 예상되지 못했으며, 예견하기도 어려웠을 것이다.","en":"The effects of the microwave oven on family life {0} not anticipated and would have been difficult {1}.","c":[{"o":["was","were"],"a":1,"tag":"수일치","why":"동사의 수는 진짜 주어에 맞춰요. 주어가 복수라서 복수동사 'were'. 주어 뒤에 붙은 수식어는 빼고 생각하세요."},{"o":["foreseeing","to foresee"],"a":1,"tag":"to부정사·동명사","why":"'~할, ~하기 위해, ~하는 것' 의미의 to부정사 자리예요. 명사 뒤에서 꾸미거나 목적을 나타낼 때 to + 동사원형."}]}],"sheet":{"given":"","pre":"","s":[{"k":"❶","t":"When we focus on the obvious aspects of media, we miss the changes that accumulate over time but are not apparent day to day."},{"k":"❷","t":"Most of us notice the obvious aspects of a new medium or technology while miss the more subtle aspects."},{"k":"❸","t":"Take, ______ , the microwave oven."},{"k":"❹","t":"It was introduced in the early 1980s and was revolutionized food preparation."},{"k":"❺","t":"Traditionally, one person spent the better part of an afternoon fix an evening meal for a family."},{"k":"❻","t":"[서술] 이제 음식을 매우 빠르게 준비하는 것이 가능해졌고, 이러한 준비 시간의 단축은 대부분 여성인 경 향이 있었던 가족 내 요리사들을 해방시켰다."},{"k":"❼","t":"______ , [서술] 더 큰 편리함이라는 단기적이고 분명한 영향은 더 이상 한 사람이 가족이 저녁 식사에서 함께 먹기 위해 음식을 준비하지 않게 되는 것의 장기적인 영향을 간과하기 쉽게 만들었다."},{"k":"❽","t":"As time went on, fewer and fewer families sat down together to eat dinner."},{"k":"❾","t":"Meals that took a long time prepare became a luxury of the past, except perhaps for special occasions."},{"k":"❿","t":"The effects of the microwave oven on family life was not anticipated and would be difficult to foresee."}],"q":[{"n":1,"ref":"All","type":"주제","cells":["L____-____ C____ Social Changes Hidden by T____ C____"],"a":"Long-Term Cumulative Social Changes Hidden by Technological Convenience"},{"n":2,"ref":"❷","type":"어법","cells":["miss","[알맞은 형태는?]"],"a":"missing"},{"n":3,"ref":"❸","type":"연결","cells":[],"a":"for example"},{"n":4,"ref":"❹","type":"어법","cells":["어법상 틀린 부분을 1군데 찾아 고치시오."],"a":"was revolutionized → revolutionized"},{"n":5,"ref":"❺","type":"어법","cells":["fix","[알맞은 형태는?]"],"a":"fixing"},{"n":6,"ref":"❻","type":"서술","cells":["밑줄 친 우리말과 같도록 <필수 어휘>를 이용하여 <어법 조건>에 맞게 영작하시오.","* 필수 어휘 : quickly / foods / possible / prepare / most / women / tend to * 어법 조건 : 가주어·진주어 구문 / 부정대명사+of+관계대명사 / 단어수: 8+7개","____, __________ , and this shortening of preparation time was liberating for the cooks in the family, __________ ."],"a":"Now, it was possible to prepare foods very quickly / most of whom tended to be women"},{"n":7,"ref":"❼","type":"연결","cells":[],"a":"But"},{"n":8,"ref":"❼","type":"서술","cells":["밑줄 친 우리말과 같도록 <필수 어휘>를 이용하여 <어법 조건>에 맞게 영작하시오.","* 필수 어휘 : an evening meal / make / together / easy / the family / fix / overlook / implications / have * 어법 조건 : make+가목적어+OC+진목적어 구문 / have+O+OC(동사원형) / 의미상주어+to부정사 / 단어수: 26개","But the short-term, obvious implications of greater convenience __________ ____-__________ ____ ____ ."],"a":"made it easy to overlook the long-term implications of no longer having one person fix food for the family to eat together at an evening meal"},{"n":9,"ref":"❾","type":"어법","cells":["prepare","[알맞은 형태는?]"],"a":"to prepare"},{"n":10,"ref":"❿","type":"어법","cells":["어법상 틀린 부분을 2군데 찾아 고치시오. [교재대로]","① → ② →"],"a":"① was → were ② would be → would have been"}]},"write":[{"ko":"이제 음식을 매우 빠르게 준비하는 것이 가능해졌고, 이러한 준비 시간의 단축은 대부분 여성인 경향이 있었던 가족 내 요 리사들을 해방시켰다.","en":"Now, it was possible to prepare foods very quickly, and this shortening of preparation time was liberating for the cooks in the family, most of whom tended to be women.","cond":"","kw":""},{"ko":"하지만 더 큰 편리함이라는 단기적이고 분명한 영향은 더 이상 한 사람이 가족이 저녁 식사에서 함께 먹기 위해 음식을 준비하지 않게 되는 것의 장기적인 영향을 간과하기 쉽게 만들었다.","en":"But the short-term, obvious implications of greater convenience made it easy to overlook the long-term implications of no longer having one person fix food for the family to eat together at an evening meal.","cond":"","kw":""}]},{"id":"35","title":"35번","topic":"The Advancement of Digital Twins Driven by Real-Time Data","topicKo":"실시간 데이터가 이끄는 디지털 트윈의 발전","lines":[{"ko":"디지털 트윈은 디지털 표현을 만들기 위해 모델링과 센서를 사용하는 자산이나 활동의 디지털 복제본이다.","en":"Digital twins are digital replicas of assets or activities {0} modeling and sensors {1} digital representations.","c":[{"o":["using","used"],"a":0,"tag":"분사","why":"꾸밈을 받는 명사(또는 분사구문의 주어)가 그 동작을 직접 '하는' 능동 관계라 현재분사 'using'."},{"o":["create","to create"],"a":1,"tag":"to부정사·동명사","why":"'~할, ~하기 위해, ~하는 것' 의미의 to부정사 자리예요."}]},{"ko":"디지털 트윈은 새로운 것이 아니다. 가령 다양한 산업의 엔지니어링 팀은 수년 동안 컴퓨터 지원 설계(CAD) 모델의 3D 렌더링, 자산 모델 및 공정 시뮬레이션을 사용해 왔다.","en":"Digital twins are not new; engineering teams in various industries {0} used 3D renderings of computer-aided design models, asset models, and process simulations for years.","c":[{"o":["have","has"],"a":0,"tag":"수일치","why":"동사의 수는 진짜 주어에 맞춰요. 주어가 복수라서 복수동사 'have'. 주어 뒤에 붙은 수식어는 빼고 생각하세요."}]},{"ko":"그러나 더 빠른 무선 네트워크와 그로 인한 실시간 데이터의 가용성은 훨씬 더 상세하고 역동적인 디지털 표현을 가능하게 한다.","en":"However, faster wireless networks and the resulting availability of real-time data {0} {1} more detailed and dynamic digital representations.","c":[{"o":["enable","prevent"],"a":0,"tag":"어휘","why":"문맥 어휘 문제예요. 해석을 보면서 글의 흐름에 맞는 'enable'를 고르세요. (오답 'prevent'는 반대 또는 다른 뜻)"},{"o":["very","much"],"a":1,"tag":"형용사·부사","why":"비교급(-er, more ~)을 강조할 때는 much/even/far/still/a lot. very는 비교급을 꾸밀 수 없어요."}]},{"ko":"연결된 기기로부터 센서가 데이터를 수집할 때, 그 센서 데이터는 디지털 트윈을 지속적으로 업데이트하는 데 사용될 수 있다. 디지털 트윈은 물리적 객체의 속성과 상태에 대한 정확한 실시간 복사본이 된다.","en":"When sensors collect data from a connected device, the sensor data can {0} {1} the digital twin. The digital twin becomes a real-time {2} copy of a physical object’s properties and states.","c":[{"o":["use","be used"],"a":1,"tag":"시제·태","why":"주어가 그 동작을 '당하는/받는' 쪽이라 수동태(be + p.p.) 'be used'."},{"o":["continuously updating","to continuously update"],"a":1,"tag":"to부정사·동명사","why":"'used' 뒤에는 to부정사(to + 동사원형)가 와요."},{"o":["accurate","distorted"],"a":0,"tag":"어휘","why":"문맥 어휘 문제예요. 해석을 보면서 글의 흐름에 맞는 'accurate'를 고르세요. (오답 'distorted'는 반대 또는 다른 뜻)"}]},{"ko":"예를 들어, 발전 터빈, 제트 엔진, 기차 엔진과 같은 물리적 자산의 디지털 트윈은 자산이 매우 가치 있고 가동 중단 비용이 매우 클 때 일반화되고 있다.","en":"For instance, digital twins of physical assets such as power-generation turbines, jet engines, and train engines {0} becoming {1} when the assets are very valuable and when downtime would be very costly.","c":[{"o":["is","are"],"a":1,"tag":"수일치","why":"동사의 수는 진짜 주어에 맞춰요. 주어가 복수라서 복수동사 'are'. 주어 뒤에 붙은 수식어는 빼고 생각하세요."},{"o":["rare","common"],"a":1,"tag":"어휘","why":"문맥 어휘 문제예요. 해석을 보면서 글의 흐름에 맞는 'common'를 고르세요. (오답 'rare'는 반대 또는 다른 뜻)"}]}],"sheet":{"given":"","pre":"","s":[{"k":"❶","t":"Digital twins are digital replicas of assets or activities used modeling and sensors to create digital representations."},{"k":"❷","t":"Digital twins are not new; engineering teams in various industries have used 3D renderings of computer-aided design models, asset models, and process simulations for years."},{"k":"❸","t":"______, faster wireless networks and the resulting availability of real-time data enable [much/very] more detailed and dynami arities'는 반대 또는 다른 뜻)"},{"o":["depend","depends"],"a":1,"tag":"수일치","why":"동사의 수는 진짜 주어에 맞춰요. 주어가 단수(하나)라서 단수동사 'depends'. 주어 뒤에 붙은 전치사구·관계사절은 빼고 생각하세요."}]},{"ko":"위도가 높아 계절을 쉽게 관찰할 수 있었던 전근대 유럽의 농경 사회에서는 태양의 주기를 관찰하는 것은 자연스러운 일이었다.","en":"In the agricultural society of pre-modern Europe, {0} higher latitudes make the seasons easily observable, {1} was natural to monitor the solar cycle.","c":[{"o":["what","where"],"a":1,"tag":"관계사·명사절","why":"뒤 문장이 완전한지(빠진 성분이 없는지), 앞에 선행사가 있는지를 보고 고르세요. 정답은 'where'."},{"o":["it","that"],"a":0,"tag":"대명사","why":"뒤에 오는 that절·to부정사를 대신 받는 가주어/가목적어는 it만 쓸 수 있어요."}]},{"ko":"반대로, 계절 변화가 덜 중요한 아라비아의 대체로 유목 생활을 하는 민족들에게는 음력이 더 합리적인 선택이었다.","en":"{0}, among the largely nomadic peoples of Arabia, {1} seasonal changes were less significant, the lunar calendar was a more sensible choice.","c":[{"o":["Thus","Conversely"],"a":1,"tag":"연결어","why":"앞뒤 문장의 관계를 보세요. 예시면 For example, 반대·대조면 However/By contrast, 덧붙이면 In addition, 결과면 Therefore/Thus, 요약이면 In short. 여기서는 'Conversely'."},{"o":["whom","for whom"],"a":1,"tag":"관계사·명사절","why":"뒤 문장이 주어·목적어를 다 갖춘 완전한 문장이라 '전치사 + 관계대명사'(for whom)를 써요. 관계대명사만 쓰면 뒤가 불완전해야 해요."}]},{"ko":"그렇다고 해서 이슬람교가 음력을, 로마 기독교가 양력을 사용하는 것이 필연적인 것은 아니었지만, 지리와 생활 방식에 의해 제한된 선택지 중에서 전통을 통해 걸러져 정치적, 종교적 결정이 이루어졌다.","en":"That did not make it {0} {1} Islam would use a lunar calendar and Roman Christianity a solar one, but political and religious decisions were {2} from options {3} by geography and lifestyle, {4} through tradition.","c":[{"o":["inevitable","inevitably"],"a":0,"tag":"형용사·부사","why":"be·seem·feel·become 같은 동사의 보어, 또는 5형식(make/find/keep + 목적어 + 보어) 자리에는 형용사가 와요(부사 ×)."},{"o":["what","that"],"a":1,"tag":"관계사·명사절","why":"what은 '~하는 것'이라는 뜻으로 선행사(앞의 명사)를 이미 품고 있어서, 앞에 꾸며 줄 명사가 있거나 뒤 문장이 완전하면 쓸 수 없어요. → that"},{"o":["making","made"],"a":1,"tag":"시제·태","why":"주어가 그 동작을 '받는/당하는' 쪽이라 be + p.p. 수동태 'made'."},{"o":["limiting","limited"],"a":1,"tag":"분사","why":"꾸밈을 받는 명사(또는 분사구문의 주어)가 '~되는/~당한' 수동 관계라 과거분사 'limited'."},{"o":["filtering","filtered"],"a":1,"tag":"분사","why":"꾸밈을 받는 명사(또는 분사구문의 주어)가 '~되는/~당한' 수동 관계라 과거분사 'filtered'."}]}],"sheet":{"given":"","pre":"","s":[{"k":"❶","t":"All human cultures mark the passing of time by the differences they observe in the world around them."},{"k":"❷","t":"Our choice of which differences to mark depends firstly on what can we observe and secondly on what is unimportant in our lives."},{"k":"❸","t":"What we mark the differences ― the shapes of our calendars and our rituals ― depending on the connections we make between those two things."},{"k":"❹","t":"In the agricultural society of pre-modern Europe, which lower latitudes make the seasons easily observably, it was unnatural to monitor the solar cycle."},{"k":"❺","t":"______, among the largely nomadic peoples of Arabia, whom seasonal changes were less insignificant, the lunar calendar was a more sensitive choice."},{"k":"❻","t":"[서술] 그렇다고 해서 이슬람교가 음력을, 로마 기독교가 양력을 사용하는 것이 필연적인 것은 아니었지만, 지리와 생활 방식에 의해 제한된 선택지 중에서 전통을 통해 걸러져 정치적, 종교적 결정이 이루어졌다. *latitude 위도 **nomadic 유목(생활)의"}],"q":[{"n":1,"ref":"All","type":"주제","cells":["The calendar, as a product of g____, c____, and s____ influences"],"a":"The calendar, as a product of geographical, cultural, and social influences"},{"n":2,"ref":"❷","type":"혼합","cells":["어법상 혹은 문맥상 틀린 혹은 어색한 부분을 2군데 찾아 고치시오.","① → ② →"],"a":"① what can we observe → what we can observe ② unimportant → important"},{"n":3,"ref":"❸","type":"어법","cells":["어법상 틀린 부분을 2군데 찾아 고치시오. [교재대로]","① → ② →"],"a":"① What → How ② depending → depends"},{"n":4,"ref":"❹","type":"혼합","cells":["어법상 혹은 문맥상 틀린 혹은 어색한 부분을 4군데 찾아 고치시오.","① → ② → ③ → ④ →"],"a":"① which → where ② lower → higher ③ observably → observable ④ unnatural → natural"},{"n":5,"ref":"❺","type":"연결","cells":[],"a":"Conversely"},{"n":6,"ref":"❺","type":"혼합","cells":["어법상 혹은 문맥상 틀린 혹은 어색한 부분을 3군데 찾아 고치시오.","① → ② → ③ →"],"a":"① whom → for whom ② insignificant → significant ③ sensitive → sensible"},{"n":7,"ref":"❻","type":"서술","cells":["밑줄 es."},{"k":"❹","t":"If prices are not sticky ― as many models assume ― individuals adapt their behavior gradually, whenever their preferences or the circumstances change."},{"k":"❺","t":"They stop to buy items that do not satisfy their needs and stop to sell items that do not provide themselves with optimal gains, maybe switched to the production of other items."},{"k":"❻","t":"If they have motivational problems, ______ , falling into acceptance about the fact which there is no demand for their products, markets reveal to themselves, sometimes in quite brutal ways, that they better deny this fact."}],"q":[{"n":1,"ref":"All","type":"주제","cells":["How the M____ Mechanism Makes Individuals D____ Their Knowledge Through Their B____"],"a":"How the Market Mechanism Makes Individuals Disclose Their Knowledge Through Their Behavior"},{"n":2,"ref":"❶","type":"어법","cells":["어법상 틀린 부분을 1군데 찾아 고치시오."],"a":"revealing → to reveal"},{"n":3,"ref":"❷","type":"연결","cells":[],"a":"for example"},{"n":4,"ref":"❷","type":"어법","cells":["어법상 틀린 부분을 3군데 찾아 고치시오.","① → ② → ③ →"],"a":"① which → in which ② knowing → know ③ what are one’s true preferences or production capacities → what one’s true preferences or production capacities are"},{"n":5,"ref":"❸","type":"어휘","cells":["문맥상 어색한 부분을 1군데 찾아 고치시오."],"a":"imperfectly → perfectly"},{"n":6,"ref":"❹","type":"어휘","cells":["문맥상 어색한 부분을 1군데 찾아 고치시오."],"a":"gradually → instantaneously"},{"n":7,"ref":"❺","type":"어법","cells":["어법상 틀린 부분을 4군데 찾아 고치시오.","① → ② → ③ → ④ →"],"a":"① to buy → buying ② to sell → selling ③ themselves → them ④ switched → switching"},{"n":8,"ref":"❻","type":"연결","cells":[],"a":"for example"},{"n":9,"ref":"❻","type":"혼합","cells":["어법상 혹은 문맥상 틀린 혹은 어색한 부분을 4군데 찾아 고치시오.","① → ② → ③ → ④ →"],"a":"① acceptance → denial ② which → that ③ themselves → them ④ deny → accept"}]},"write":[{"ko":"이는 자신의 진정한 선호나 생산 능력이 무엇인지 상대측이 알게 하지 ‘않는’ 것이 현명한 여러 ‘전략적’ 상황과 대조적인데, 정치적 협상을 예로 들 수 있다.","en":"This stands in contrast to many strategic situations ― for example, in political negotiations ― in which it is wise not to let the other side know what one’s true preferences or production capacities are.","cond":"「전치사+관계사」, 「가주어·진주어구문」, 「let+O+OC(동사원형)」, 「간접의문문절」을 사용할 것","kw":"stand, in contrast to, ―, for example, in, ―, in which, be, let, know, what, or, be"},{"ko":"예를 들어, 그들이 그들의 제품에 대한 수요가 없다는 사실을 부정하는 것에 빠지는 동기적 문제가 있다면, 시장은 그들이 이 사실을 받아들이는 편이 좋다는 것을 때로는 꽤 잔혹한 방법으로 그들에게 드러낸다.","en":"If they have motivational problems, for example, falling into denial about the fact that there is no demand for their products, markets reveal to them, sometimes in quite brutal ways, that they better accept this fact.","cond":"「동격절」, 「V+전치사구+O(목적어후치)」를 사용할 것","kw":"if, have, for example, fall into, about, that, be, for, reveal, to, in, that, better, accept"}]},{"id":"33","title":"33번","topic":"Language reflecting human invention constantly","topicKo":"","lines":[{"ko":"사전적 정의는 우리의 변화하는 용례와 지식에 뒤처지지 않기 위해 끊임없이 수정된다.","en":"Dictionary definitions are constantly {0} to {1} up with our changing uses and knowledge.","c":[{"o":["revising","revised"],"a":1,"tag":"시제·태","why":"주어가 그 동작을 '받는/당하는' 쪽이라 be + p.p. 수동태 'revised'."},{"o":["keep","keeping"],"a":0,"tag":"문형","why":"조동사·do·to 뒤에는 동사원형이 와요. → 'keep'"}]},{"ko":"로마 시대에 ‘addicts’는 빚을 갚을 수 없어서 스스로 채권자의 노예가 된 사람들이었다.","en":"In Roman times, “addicts” were people {0} {1} unable to pay their debts and gave themselves as slaves to their creditors.","c":[{"o":["who","what"],"a":0,"tag":"관계사·명사절","why":"선행사가 사람이면 who(m)를 써요. what은 선행사를 품고 있어서 앞에 명사가 있으면 못 쓰고, which는 사물에 써요."},{"o":["was","were"],"a":1,"tag":"수일치","why":"동사의 수는 진짜 주어에 맞춰요. 주어가 복수라서 복수동사 'were'. 주어 뒤에 붙은 수식어는 빼고 생각하세요."}]},{"ko":"그 단어는 결국 약물 의존과 연관되었는데, 사람은 자신이 중독된 것에 노예가 된다는 것이다.","en":"The word eventually came to be {0} with drug {1}: one becomes a slave to one's addiction.","c":[{"o":["associating","associated"],"a":1,"tag":"시제·태","why":"주어가 그 동작을 '받는/당하는' 쪽이라 be + p.p. 수동태 'associated'."},{"o":["dependency","independency"],
