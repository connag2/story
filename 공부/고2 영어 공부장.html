stages":{"write":"영작"},"units":[{"id":"L1-1","title":"1과 본문 ❶","lines":[{"en":"Nowadays, everybody {0} a hobby {1} in their free time.","ko":"요즘은 누구나 여가 시간에 하고 싶은 취미가 있다.","c":[{"o":["have","has"],"a":1,"why":"everybody는 부정대명사로 단수 취급해요. → has","tag":"수일치"},{"o":["they like to do it","they like to do"],"a":1,"why":"선행사 a hobby 뒤에 목적격 관계대명사 that/which가 생략됐어요. 관계사절은 목적어가 없는 불완전한 절이라 do 뒤에 it을 다시 쓰지 않아요.","tag":"관계사·명사절"}],"notes":[{"t":"동사의 수일치","p":"단수주어(부정대명사 everybody)+단수동사(has)","b":"주어로 부정대명사 everybody(모든 사람)가 쓰였고, 단수로 취급하므로 단수동사 has가 쓰였다. (×)everybody have"},{"t":"목적격 관계대명사의 생략","p":"명사구(선행사)(+that/which)+목적어 없는 불완전한 절","b":"명사구 a hobby(취미)를 선행사로 하는 목적격 관계대명사 that 또는 which가 생략된 채로 to부정사 to do의 목적어가 없는 불완전한 절이 이어졌다.","x":["전환 ~ a hobby that/which they like to do [목적어×] in their free time."]},{"t":"like+동명사/to부정사","p":"like+목적어(to부정사구)","b":"’~하는 것을 좋아하다‘의 뜻으로 동사 like는 동명사와 to부정사를 모두 목적어로 취하므로, 본문에서는 to부정사 to do가 쓰였고 동명사 doing도 가능하다."}]},{"en":"In the past, though, this probably wasn’t true {0} most people had to work long hours in agriculture or manufacturing, so free time {1} hard to {2}.","ko":"하지만 과거에는 아마 그렇지 않았을 것인데, 그 이유는 대부분의 사람이 농업이나 제조업에서 장시간 노동을 해야 했기 때문이었고, 따라서 여가 시간은 분명 생기기 어려웠을 것이다.","c":[{"o":["because of","because"],"a":1,"why":"뒤에 완전한 절(most people had to ~)이 오므로 접속사 because. because of는 명사(구) 앞에 써요.","tag":"접속사·전치사"},{"o":["must have been","must be"],"a":0,"why":"과거(In the past)에 대한 확신은 must have p.p. '~였음이 틀림없다'를 써요.","tag":"시제·태"},{"o":["come by","come by it"],"a":0,"why":"주어 free time이 to come by의 의미상 목적어(목적어 상승 구조)라서 뒤에 it을 다시 쓰지 않아요.","tag":"문형"}],"notes":[{"t":"접속사 because","p":"부사절 접속사(because)+완전한 절","b":"‘~하기 때문에’의 뜻으로 이유 부사절을 이끌며, 뒤에 완전한 절 most people ~ manufacturing이 이어졌다.","x":["참고 = since/as+완전한 절","cf) 구전치사 because of/due to/owing to/thanks to+명사(구)"]},{"t":"타동사 work+시간","p":"타동사(work)+목적어(long hours)","b":"‘(시간)을 일하다'를 뜻하는 타동사로 work가 쓰여, 동사원형 work에 목적어로 long hours가 이어져 '장시간을 일하다'를 뜻한다.","x":["참고 work weekends/nights/days '주말[야간, 주간]에 일하다' work the day/night/graveyard shift '주간[야간, 심야] 근무를 하다'"]},{"t":"병렬연결","p":"전치사+명사1+or+명사2","b":"전치사 in의 목적어 자리에서 두 개의 명사 agriculture와 manufacturing이 등위접속사 and를 사이에 두고 병렬연결을 이루고 있다."},{"t":"조동사+have+p.p.","p":"must have+p.p.","b":"‘~이었음이 틀림없다’로 과거 사실에 대한 확신을 나타낸다.","x":["참고 would+havep.p. '~했을 것이다' wouldn't+havep.p. '~하지 않았을 것이다' may/might+havep.p. '~이었을지도 모른다' must+havep.p. '~이었음이 틀림없다' cannot+havep.p. '~이었을 리 없다' could+havep.p. '~할 수 있었는데 (못 했다)' should+havep.p. '~했어야 했는데 (못 했다)' shouldn't+havep.p. '~하지 않았어야 했는데 (했다)' need not+havep.p. '~할 필요가 없었다'"]},{"t":"부사적 용법의 to부정사 & 목적어 상승 구조","p":"주어(free time)+~+형용사(hard)+to부정사구(to come by)","b":"‘~을 얻기가 (어려운)’의 뜻으로 형용사 hard를 부사적 용법 중 '형용사 수식'의 to부정사구 to come by가 뒤에서 꾸민다. 주어 free time이 to부정사구 to come by의 의미상 목적어이므로 뒤에 대명사 it으로 다시 쓰지 않는다. (×)free time ~ hard to come by it","x":["참고 목적어 상승 구조: 주어 free time 자리에 가주어 it이 쓰였을 때 주어는 to부정사 to come by의 목적어 자리에 위치한다. 가주어 it 대신 to부정사의 목적어 free time이 주어로 상승한 구조이다.","전환 ~, so it must have been hard to come by free time. [가주어(it)-진주어(to부정사구)]"]},{"t":"구동사 come by ~","p":"자동사(come)+전치사(by)+(목적어×)","b":"‘~을 얻다’를 뜻하는 ‘자동사+전치사’ 구조의 구동사가 쓰였고, 주어 free time이 의미상 목적어이므로 목적어를 대명사 it으로 다시 쓰지 않는다.","x":["참고 come by ~ '1. (지나는 길에) ~에 들르다 2. (얻기 힘든 것)을 손에 넣다, 얻다'","cf) [자동사+부사] come by '(지나는 길에) 들르다'"]}]},{"en":"However, the Industrial Revolution and the labor movement {0} followed it led to a gradual decrease in working hours to {1} work days and five-day work weeks.","ko":"하지만 산업 혁명과 그에 따른 노동 운동은 하루 8시간 근무 및 주 5일 근무로의 점진적인 노동 시간 감소로 이어졌다.","c":[{"o":["what","that"],"a":1,"why":"선행사 the labor movement가 있고 주어 없는 불완전한 절이 이어져요. → 주격 관계대명사 that (what은 선행사를 포함해서 쓸 수 없음)","tag":"관계사·명사절"},{"o":["eight-hours","eight-hour"],"a":1,"why":"'숫자-단위명사'가 하이픈으로 연결돼 명사를 꾸미는 복합형용사에서 단위명사는 단수형이에요.","tag":"형용사·부사"}],"notes":[{"t":"병렬연결","p":"명사구1+and+명사구2 ~","b":"명사구 the Industrial Revolution과 관계사절의 수식을 받는 또 다른 명사구 the labor movement가 등위접속사 and로 병렬연결을 이룬다."},{"t":"주격 관계대명사 that","p":"명사구(선행사)+that+주어 없는 불완전한 절","b":"주어가 없는 불완전한 절(followed it)을 이끌어 명사구 the labor movement를 선행사로 수식하는 관계사절을 이루며, which로 바꿔 쓸 수 있다."},{"t":"구동사 lead to ~","p":"자동사(led)+전치사(to)+명사구","b":"‘~로 이어지다, ~을 초래하다’를 뜻하는 ‘자동사+전치사’ 구조의 구동사로, ‘원인+lead to+결과’의 구조로 원인인 주어와 결과인 명사(구)를 연결한다.","x":["참고 =cause, result in ~, bring ~ about, give rise to ~"]},{"t":"명사+전치사 decrease in ~ to …","p":"an gradual+명사(decrease)+전치사구+전치사(to)+명사구","b":"‘~에서 …으로의 감소’를 뜻하는 표현으로, 앞에 부정관사 a와 형용사 gradual이 오고 뒤에 전치사 in으로 대상 분야인 명사구 working hours가 이어진 후 전치사 to로 감소된 결과인 명사구 eight-hour work days and five-day work weeks가 이어져 '노동 시간에서 하루 8시간 근무 및 주 5일 근무로의 점진적인 감소'를 뜻한다."},{"t":"숫자-단수단위명사","p":"복합형용사(숫자 eight-단수단위명사 hour)+명사구(work days)+and+복합형용사(숫자 five-단수단위명사 day)+명사구(work weeks)","b":"붙임표(hyphen)로 연결된 복합형용사가 ‘숫자-단수단위명사(-형용사)’ 형태로 명사(구)를 앞에서 꾸미면 단위명사는 단수형을 쓴다. 숫자 eight와 five에 단수단위명사 hour와 day가 각각 붙임표로 연결되어 ‘8시간의’와 '5일의'를 뜻하여 명사구 work days와 work weeks를 꾸민다. (×)eight-hours work days and five-days work weeks e.g. a four-mile round trip ‘4마일 왕복 여행’ / a four-foot-high tree ‘4피트 높이의 나무’"}]},{"en":"For the first time in history, a majority of people had free time {0} activities that they found {1} outside of work: hobbies.","ko":"역사상 처음으로, 대다수의 사람이 일 외에 의미 있다고 생각하는 활동, 즉 취미를 즐길 수 있는 여가 시간을 갖게 되었다.","c":[{"o":["to enjoy","enjoyed"],"a":0,"why":"명사 free time을 뒤에서 꾸미는 형용사적 용법의 to부정사 ‘즐길 (여가 시간)’이에요.","tag":"to부정사·동명사"},{"o":["meaningful","meaningfully"],"a":0,"why":"5형식 find+O+O·C에서 목적격보어는 형용사예요. (activities를 ‘의미 있다고’ 여기다)","tag":"문형"}],"notes":[{"t":"형용사적 용법의 to부정사","p":"명사구(free time)+to부정사(구)","b":"‘즐길 수 있는 (여가 시간)’의 뜻으로 명사구 free time을 형용사적 용법의 to부정사 to enjoy가 이끄는 to부정사구가 뒤에서 꾸민다."},{"t":"목적격 관계대명사 that & 5형식 동사 find","p":"명사+that+불완전한 절(~+found+목적격보어(형용사meaningful))","b":"명사 activities를 선행사로 꾸미는 관계사절을 목적격 관계대명사 that이 이끌며, 뒤에 5형식 'find+O+O·C(형용사)’(~을 …하다고 생각하다[여기다])의 동사 found의 목적어가 없이 목적격보어인 형용사 meaningful이 이어진 불완전한 절이 쓰였다. that 대신에 which도 가능하며, 목적격 관계대명사이므로 생략될 수도 있다. (×)activities they found meaningfully","x":["전환 ~ activities (which) they found [목적어×] meaningful outside of work: hobbies."]},{"t":"구전치사 outside of ~","p":"동사구+구전치사(outside of)+명사","b":"‘~ 이외에, ~을 제외하고’를 뜻하는 구전치사로 명사 work가 이어져 ‘일 이외에, 일을 제외하고’를 뜻하고, except for로 바꿀 수 있다.","x":["참고 outside of ~ ’1. ~의 밖에, ~의 바깥에 2. [미국 영어] ~ 이외에, ~을 제외하고(=except for ~)’ outside prep. ~의 밖에, ~의 바깥에 = outside of ~ / adv. 밖에서, 밖으로 / a. 외부의, 본업 외의, 얼마 안 되는 / n. (the) 외부, 겉면"]}]}],"write":[{"ko":"요즘은 누구나 여가 시간에 하고 싶은 취미가 있다.","en":"Nowadays, everybody has a hobby they like to do in their free time."},{"ko":"하지만 과거에는 아마 그렇지 않았을 것인데, 그 이유는 대부분의 사람이 농업이나 제조업에서 장시간 노동을 해야 했기 때문이었고, 따라서 여가 시간은 분명 생기기 어려웠을 것이다.","en":"In the past, though, this probably wasn’t true because most people had to work long hours in agriculture or manufacturing, so free time must have been hard to come by."},{"ko":"하지만 산업 혁명과 그에 따른 노동 운동은 하루 8시간 근무 및 주 5일 근무로의 점진적인 노동 시간 감소로 이어졌다.","en":"However, the Industrial Revolution and the labor movement that followed it led to a gradual decrease in working hours to eight-hour work days and five-day work weeks."},{"ko":"역사상 처음으로, 대다수의 사람이 일 외에 의미 있다고 생각하는 활동, 즉 취미를 즐길 수 있는 여가 시간을 갖게 되었다.","en":"For the first time in history, a majority of people had free time to enjoy activities that they found meaningful outside of work: hobbies."}]},{"id":"L1-2","title":"1과 본문 ❷","lines":[{"en":"For many people, hobbies are serious.","ko":"많은 사람에게 취미는 진지한 것이다.","notes":[{"t":"sound like+명사(구)","p":"동사(sound)+전치사(like)+명사구","b":"동사 sound는 ‘~처럼 들리다’의 뜻으로 전치사 like가 명사(구)를 연결하므로, 현재동사 sound에 like가 명사구 a contradiction을 연결하여 ‘모순처럼 들린다’를 뜻한다. 이때 영국영어에서는 전치사 like가 생략되고 바로 명사(구)가 오기도 한다.","x":["참고 sound+형용사 ‘~하게 들리다’ / sound like+명사(구) ‘~처럼 들리다’ (영국식 sound+명사(구) / sound as if[as though]+완전한 절 ‘~하는 것처럼 들리다’ (미국 영어에서는 like를 접속사로도 씀)"]},{"t":"선행사를 포함한 관계대명사 what","p":"that's+what+목적어가 없는 불완전한 절","b":"‘~한 것’이라는 뜻으로 동사 takes의 목적어가 없는 불완전한 절이 이어져 that's의 보어절을 이끈다. the thing(s) (that/which)로 바꿔 설명할 수 있다","x":["전환 ~, but that’s the thing(s) (that/which) it takes [목적어×] for an activity to qualify as a hobby."]},{"t":"it takes+O+for+의미상 주어+to부정사(구)","p":"목·관(what)+가주어(it)+takes+진주어(for+의미상 주어+to부정사구)","b":"‘~가 …하는 데 -이 필요하다’를 뜻하는 표현이며, 가주어 it과 현재동사 takes에 이어 앞의 목적격 관계대명사 what에 의해 목적어는 없고, 진주어로는 전치사 for와 함께 의미상 주어 an activity가 앞에 온 명사적 용법의 to부정사구인 for an activity to qualify as a hobby가 쓰여 '활동이 취미로 인정되는 데 필요한 것(들)'을 뜻한다."}]},{"en":"Serious leisure may sound {0} a contradiction, but that’s {1} it takes for an activity to qualify as a hobby.","ko":"진지한 여가는 모순처럼 들릴 수 있지만, 그것은 바로 어떤 활동이 취미의 자격을 갖추는 데 필요한 것이다.","c":[{"o":["as","like"],"a":1,"why":"sound like+명사(구) ‘~처럼 들리다’. sound+형용사와 구별해 두세요.","tag":"접속사·전치사"},{"o":["what","that"],"a":0,"why":"it takes의 목적어가 빠진 불완전한 절이고 선행사가 없어요. → 선행사를 포함한 관계대명사 what","tag":"관계사·명사절"}]},{"en":"To take a hobby seriously, you have to make a meaningful effort to improve your skills, take risks, overcome hardships, or {0} a better version of yourself.","ko":"취미를 진지하게 받아들이기 위해서는, 기술을 향상하고, 위험을 감수하고, 고난을 극복하거나 더 나은 자신이 되기 위해 의미 있는 노력을 기울여야 한다.","c":[{"o":["become","becoming"],"a":0,"why":"to improve ~, take ~, overcome ~, or become ~ : to에 이어지는 동사원형 4개가 병렬이에요.","tag":"병렬·도치·어순"}],"notes":[{"t":"부사적 용법의 to부정사","p":"to부정사구,+완전한 절","b":"to부정사 Take가 ’받아들이기 위해서’를 뜻하여 ‘목적’을 나타내는 부사적 용법으로 to부정사구를 이끈다."},{"t":"부사적 용법의 to부정사 & 병렬연결","p":"to+동사원형1 ~+동사원형2 ~+동사원형3 ~+or+동사원형4 ~","b":"‘~하기 위해’를 뜻하는 부사적 용법의 to부정사구를 이루는 to에 이어지는 동사원형 자리에서 네 개의 동사원형 improve, take, overcome, become이 각각 이끄는 네 개의 동사구들이 ‘A, B, C, or D’의 형태로 병렬연결을 이룬다. 다른 분석 ‘기술을 향상하고, ~ 자신이 되기 위한 (의미 있는 노력)’이라는 뜻으로 명사구 a meaningful effort를 수식하는 형용사적 용법의 to부정사로 볼 수도 있다."},{"t":"전치사 뒤 재귀대명사","p":"전치사(of)+재귀대명사(yourself)","b":"전치사 of의 목적어로 ‘(다름 아닌) 여러분 자신’을 뜻하는 재귀대명사 yourself가 쓰였다. 전치사의 목적어인 재귀대명사는 본문처럼 관용적인 표현이 아니면 목적격 대명사 you도 가능하다. 전환 ~ become a better version of you.","x":["참고 보통 전치사가 쓰인 구동사나 ‘동작 명사(구)+전치사’, ‘형용사+전치사’, ‘동사+명사(구)+전치사’ 구조가 쓰인 관용 표현에서는 전치사의 목적어가 해당 표현의 의미상 주어와 일치하면 반드시 재귀대명사를 사용하지만, 언급된 표현에 포함되지 않은 전치사, 특히 ‘공간/위치’ near, behind, next to ~ 등, ‘비교’ as, than, like(~처럼) ‘제외’ but (for ~), except (for ~) ‘관련’ as for ~ 뒤에 오는 대명사가 해당 절의 주어와 동일할 때 목적격 대명사와 재귀대명사가 둘 다 사용될 수 있다. 동격 명사(구)나 병렬연결에서도 둘 다 사용될 수 있다. 특히 대조를 나타낼 때는 차이를 강조해 재귀대명사가 종종 쓰인다. e.g. Rhiana saw a spider near her/herself. 리아나는 그녀 뒤에서 거미 한 마리를 보았다. (herself는 다름 아닌 그녀 자신을 뜻해 타인들과 대조를 강조함) Everybody was early except me/myself. 나만 빼고 모두가 일찍 왔다. (myself는 대조를 강조함)"]}]},{"en":"If you meet someone {0} has woken up at the crack of dawn to take a picture at the “magic hour,” you can assume that they think of {1} as a “photographer.”","ko":"만약 여러분이 ‘매직 아워(마법 같은 시간)’에 사진을 찍기 위해 동틀 무렵에 일어나는 사람을 만난다면, 여러분은 그 사람이 스스로를 ‘사진사’라고 생각한다고 추정할 수 있다.","c":[{"o":["whom","who"],"a":1,"why":"주어가 없는 불완전한 절(has woken up ~)을 이끌어요. → 주격 관계대명사 who","tag":"관계사·명사절"},{"o":["themselves","them"],"a":0,"why":"think of ~ as …의 목적어가 주어 they와 같은 대상이라 재귀대명사 themselves를 써요.","tag":"문형"}],"notes":[{"t":"주격 관계대명사 who","p":"부정대명사(선행사)+who+주어 없는 불완전한 절","b":"주어가 없는 불완전한 절(has ~ “magic hour,”)을 이끌어 부정대명사 someone을 선행사로 수식하는 관계사절을 이루며, that으로 바꿔 쓸 수 있다."},{"t":"현재완료 & 구동사 wake up","p":"has+과거분사(woken)+부사(up)","b":"현재완료조동사 has와 과거분사 woken이 결합해 현재완료를 이루고, ‘깨어나다’를 뜻하는 ‘자동사+부사’ 구조의 구동사 wake up이 쓰여 '(현재) 깨어난 상태다'를 뜻한다."},{"t":"부사적 용법의 to부정사","p":"완전한 절+to부정사구","b":"to부정사 Take가 ’(사진을) 찍기 위해’를 뜻하여 ‘목적’을 나타내는 부사적 용법으로 to부정사구를 이끈다."},{"t":"명사절 접속사 that","p":"동사(assume)+that+완전한 절","b":"동사 assume(~을 추정한다)의 목적어 자리에서 명사절 접속사 that이 완전한 절(“We ~ alone“)을 이끌고 있다. that은 생략이 가능하다."},{"t":"think of ~ as … & 재귀 용법의 재귀대명사","p":"자동사(think)+전치사(of)+목적어(재귀대명사 themselves)+전치사(as)+명사구","b":"’~을 …으로 여기다’를 뜻하는 구동사 ‘think of ~ as …’가 사용되었고, think of의 목적어가 주어인 they와 동일한 대상임을 나타내기 위해 재귀 용법의 재귀대명사인 themselves가 쓰였다. 전치사가 쓰인 구동사는 주어와 일치하는 목적어 자리에 재귀대명사가 강제된다."}]},{"en":"A runner, a gamer, or a photographer are titles that people are proud to call themselves.","ko":"달리기를 하는 사람, 게이머, 사진사 등은 사람들이 스스로를 자랑스럽게 부르는 직함이다.","notes":[{"t":"병렬연결 & 예외적인 동사의 수일치","p":"주어1(A runner),+주어2(a gamer),+or+주어3(a photographer)+복수동사(are)+보어(복수명사 titles)","b":"주어로 단수명사구 세 개 A runner, a gamer, a photographer가 ’A, B, or C’의 구조로 병렬연결을 이룬다. 수험 영어, 즉 규범 어법에서는 주어부에서 등위접속사 or로 병렬연결을 이룬 경우 가장 가까운 명사(구)에 수를 일치하므로, 가장 가까운 명사구 a photographer가 단수이므로 단수동사와 단수명사구를 사용한 is a title이 적절하다. 하지만, 본문에서 글쓴이는 등위접속사 or를 '셋 중 단 하나만 선택하라'라는 배타적(exclusive) 의미가 아니며, '러너, 게이머, 사진가'는 화자가 예시로 든 여러 정체성 항목들의 포괄적(inclusive) 나열(X or Y or Z or all of them)로 사용하여 'A runner, a gamer, and a photographer'와 같은 의미이므로 복수동사 are가 쓰였고, 이는 are 뒤에서 보어로 사용한 복수명사 titles가 잘 보여 주고 있다. 이는 비격식체, 즉 구어체에서 가끔 등장한다. e.g. Jogging or swimming is/are supposed to be good for the heart. (규범 어법에서는 is가 적절하지만, 글쓴이는 복수동사 are를 사용해 or가 and를 나타내게 함)"},{"t":"보격 관계대명사 & 5형식 동사 call","p":"명사(선행사)+that+to call의 목적격보어가 없는 불완전한 절","b":"명사 titles를 선행사로 꾸미는 관계사절을 보격 관계대명사 that이 이끌며, 뒤에 to부정사 to call의 목적격보어가 없는 불완전한 절 people are proud to call themselves가 이어졌다. 관계대명사 which도 가능하며, 보격 관계대명사는 뒤에 주어로 시작하는 절이 이어져 절 구분이 분명하므로 생략할 수 있다. 5형식 'call+O+O·C(이름)'(~을 …으로 부르다)에서, call의 목적어가 의미상 주어 people과 일치함을 나타내는 재귀 용법의 재귀대명사 themselves가 사용되었고, 목적격보어는 앞의 보격 관계대명사 that에 의해 없다.","x":["전환 ~ titles (which) people are proud to call themselves [목적격보어×]."]}]},{"en":"On the other hand, you wouldn’t call {0} a “TV watcher” or “online surfer.”","ko":"반면에, 여러분은 자신을 ‘TV 시청자’ 또는 ‘온라인 서핑하는 사람’이라고 부르지 않을 것이다.","c":[{"o":["you","yourself"],"a":1,"why":"call+O+O·C에서 목적어가 주어 you와 같은 대상이라 재귀대명사 yourself를 써요.","tag":"문형"}],"notes":[{"t":"조동사 would","p":"조동사(wouldn't)+동사원형","b":"과거조동사 would, could, might가 현재나 미래시제로 쓰이면 의견이나 주장의 완곡한 느낌을 나타낸다. 본문의 현재시제에 상응하여, 조동사 would는 현재 의지로 부정의 부사 not과 함께 '~하려 하지 않는다'를, 또는 현재 추측으로 '~하지 않을 것이다'를 뜻한다.","x":["참고 would ‘1. (과거 반복) ~하곤 했다 2. (과거 추측) ~했을 것이다 3. (과거 의지) ~하려 했다 4. (현재 의지) ~하려 한다 5. (현재 추측) ~할 것이다’"]},{"t":"5형식 동사 call & 재귀 용법의 재귀대명사","p":"call+목적어(재귀대명사)+목적격보어(명사구(1)+or+명사구(2))","b":"5형식 'call+O+O·C(이름)'(~을 …으로 부르다)에서, 동사원형 call의 목적어가 주어 you와 일치함을 나타내는 재귀 용법의 재귀대명사 yourself가 사용되었고, 목적격보어로 명사구 a “TV watcher” or “online surfer”가 쓰였다."}]},{"en":"Watching TV and surfing online {0} considered serious hobbies because {1} no challenge or way to improve yourself.","ko":"TV 시청과 온라인 서핑은 진지한 취미로 여겨지지 않는데, 왜냐하면 도전 거리나 자기를 발전시킬 방법이 결여되어 있기 때문이다.","c":[{"o":["aren’t","isn’t"],"a":0,"why":"동명사구 두 개가 and로 연결된 복수 주어라 복수동사를 써요.","tag":"수일치"},{"o":["there’s","there are"],"a":0,"why":"there 구문의 동사는 뒤의 주어에 일치해요. no challenge or way는 가까운 단수에 맞춰 there’s","tag":"수일치"}],"notes":[{"t":"동명사구 주어 & 수일치","p":"동명사구 주어(1)+and+동명사구 주어(2)+복수동사(are’t)","b":"두 개의 동명사구 주어 Watching TV와 surfing online이 등위접속사 and를 사이에 두고 병렬로 연결되었으며, 주어가 두 개로 복수이므로 복수동사 aren’t로 수일치 되었다."},{"t":"5형식 동사의 수동태","p":"be동사(aren’t)+과거분사(considered)+명사구(serious hobbies)","b":"5형식 ‘consider ~ (to be, [영국식] as (being)) …'(~을 …이라고 여기다)’의 수동태 ‘~ be considered (to be, [영국식] as (being)) …'(~가 …이라고 여겨지다)’가 쓰여, 본문은 수동태 aren’t considered 뒤에 보어로 serious hobbies가 이어졌다. 또한, 수동태와 보어 사이에 to be가 쓰이거나, 영국 영어에서는 전치사 as 또는 동명사가 쓰인 as being도 쓰인다.","x":["참고 consider ~ (to be, [영국식] as (being)) … = deem ~ (to be) … = regard, see, view, think of+ ~ as (being) …","전환 ~ aren't considered to be serious hobbies ~ = [영국식] ~ aren't considered as (being) serious hobbies ~ = ~ aren't deemed (to be) serious hobbies ~ = ~ aren't regarded[seen, viewed, thought of] as (being) serious hobbies ~"]},{"t":"접속사 because","p":"부사절 접속사(because)+완전한 절","b":"‘~하기 때문에’의 뜻으로 이유 부사절을 이끌며, 뒤에 완전한 절 there's ~ yourself가 이어졌다. (×)because of there's"},{"t":"유도부사 도치 & 동사의 수일치","p":"축약 there's(유도부사 there+단수동사 is)+단수주어(no+명사1+or+명사구2)","b":"접속사 because의 부사절 앞쪽에 유도부사 there가 위치해 ‘동사’ 도치가 적용되어, 단수동사 is가 단수주어 no challenge or way to improve yourself의 앞에 쓰였다. 주어가 'A or B'의 구조일 때 가까운 명사(구)에 수를 일치시키므로, 주어가 형용사 no를 공유하는 단수명사 challenge와 단수명사구 way to improve yourself가 등위접속사 or로 병렬연결이므로 동사에 가까운 단수명사 challenge에 수일치해 단수동사 is가 쓰였다."},{"t":"형용사적 용법의 to부정사","p":"명사(way)+to부정사(구)","b":"‘발전시킬 (방법)’의 뜻으로 명사 way를 형용사적 용법의 to부정사 to improve가 이끄는 to부정사구가 뒤에서 꾸민다."},{"t":"재귀 용법의 재귀대명사","p":"타동사(improve)+재귀대명사(yourself)","b":"타동사로 쓰인 improve의 목적어가 의미상의 주어와 동일한 대상임을 나타내도록 목적어 자리에 재귀대명사 yourself가 쓰였다. 문장의 필수 성분인 목적어의 역할이므로 생략할 수 없다."}]}],"write":[{"ko":"많은 사람에게 취미는 진지한 것이다.","en":"For many people, hobbies are serious."},{"ko":"진지한 여가는 모순처럼 들릴 수 있지만, 그것은 바로 어떤 활동이 취미의 자격을 갖추는 데 필요한 것이다.","en":"Serious leisure may sound like a contradiction, but that’s what it takes for an activity to qualify as a hobby."},{"ko":"취미를 진지하게 받아들이기 위해서는, 기술을 향상하고, 위험을 감수하고, 고난을 극복하거나 더 나은 자신이 되기 위해 의미 있는 노력을 기울여야 한다.","en":"To take a hobby seriously, you have to make a meaningful effort to improve your skills, take risks, overcome hardships, or become a better version of yourself."},{"ko":"만약 여러분이 ‘매직 아워(마법 같은 시간)’에 사진을 찍기 위해 동틀 무렵에 일어나는 사람을 만난다면, 여러분은 그 사람이 스스로를 ‘사진사’라고 생각한다고 추정할 수 있다.","en":"If you meet someone who has woken up at the crack of dawn to take a picture at the “magic hour,” you can assume that they think of themselves as a “photographer.”"},{"ko":"달리기를 하는 사람, 게이머, 사진사 등은 사람들이 스스로를 자랑스럽게 부르는 직함이다.","en":"A runner, a gamer, or a photographer are titles that people are proud to call themselves."},{"ko":"반면에, 여러분은 자신을 ‘TV 시청자’ 또는 ‘온라인 서핑하는 사람’이라고 부르지 않을 것이다.","en":"On the other hand, you wouldn’t call yourself a “TV watcher” or “online surfer.”"},{"ko":"TV 시청과 온라인 서핑은 진지한 취미로 여겨지지 않는데, 왜냐하면 도전 거리나 자기를 발전시킬 방법이 결여되어 있기 때문이다.","en":"Watching TV and surfing online aren’t considered serious hobbies because there’s no challenge or way to improve yourself."}]},{"id":"L1-3","title":"1과 본문 ❸","lines":[{"en":"J. R. R. Tolkien, the author of The Hobbit and The Lord of the Rings, {0} passionate about language.","ko":"『호빗』과 『반지의 제왕』의 작가인 J. R. R. 톨킨(J. R. R. Tolkien)은 언어에 열정적이었다.","c":[{"o":["was","were"],"a":0,"why":"주어는 단수인 Tolkien이에요. 동격 the author of ~ 안의 and에 속지 마세요.","tag":"수일치"}],"notes":[{"t":"동격","p":"고유명사구,+명사구","b":"고유명사 J. R. R. Tolkien을 부연 설명하는 동격 명사구 ‘the author ~ Rings’가 콤마(,)로 이어졌다."}]},{"en":"He invented languages with grammar rules and histories: Sindarin and Quenya, the former {0} by Welsh, and the latter inspired by Finnish and Latin.","ko":"그는 문법 규칙과 역사를 가진 언어를 발명했는데, 그것은 신다린(Sindarin)과 꿰냐(Quenya)로, 전자는 웨일스어에서, 후자는 핀란드어와 라틴어에서 영감을 얻었다.","c":[{"o":["inspired","inspiring"],"a":0,"why":"‘which was’가 생략된 과거분사구예요. 언어가 ‘영감을 받은’ 수동 관계","tag":"분사"}],"notes":[{"t":"명사구를 후치 수식하는 과거분사","p":"명사구(1)+과거분사구(inspired ~),+and+명사구(2)+과거분사구(inspired ~).","b":"명사구 the former와 the latter가 수식하는 과거분사구가 각각 뒤에 이어져 있으며, 수식 대상인 명사구가 각각 타동사로 쓰인 ‘inspire(~에게 영감을 주다)’의 대상이므로 수동을 나타내는 과거분사 inspired가 분사구를 이끈다.","x":["참고 ‘전자 - 후자‘ the former - the latter, the first - the second, the one - the other, that - this","참고 명사(구)를 뒤에서 수식하는 과거분사(구)는 앞에 ‘주격 관계대명사+be동사’의 생략으로 볼 수 있다.","전환 ~ the former which[that] was inspired by Welsh, and the latter which[that] was inspired by Finnish and Latin."]}]},{"en":"But inventing languages {0} a {1} hobby because he had to isolate {2} while creating them.","ko":"하지만 언어를 발명하는 것은 좌절감이 느껴지는 취미였는데 왜냐하면 그는 그것을 만들어 내는 동안 스스로를 고립시켜야 했기 때문이다.","c":[{"o":["was","were"],"a":0,"why":"동명사구 주어는 단수 취급해요.","tag":"수일치"},{"o":["frustrating","frustrated"],"a":0,"why":"취미가 ‘좌절감을 주는’ 주체라서 현재분사형 형용사 frustrating","tag":"분사"},{"o":["him","himself"],"a":1,"why":"isolate의 목적어가 주어 he와 같은 대상이라 재귀대명사 himself","tag":"문형"}],"notes":[{"t":"동명사구 주어 & 수일치","p":"동명사(inventing)+복수명사(languages)+단수동사(was)","b":"동명사구 주어 inventing languages는 단수 취급하므로 단수동사 was로 수일치 되었다."},{"t":"분사형 형용사","p":"부정관사(a)+형용사(frustrating)+명사","b":"수식을 받는 명사 hobby(취미)가 ‘좌절감을 주는’ 주체이므로 능동 관계를 나타내는 현재분사형 형용사 frustrating이 앞에 쓰였다."},{"t":"접속사 because","p":"부사절 접속사(because)+완전한 절","b":"‘~하기 때문에’의 뜻으로 이유 부사절을 이끌며, 뒤에 완전한 절 he ~ them이 이어졌다."},{"t":"재귀 용법의 재귀대명사","p":"주어(he)+동사구(had to isolate)+목적어(재귀대명사 himself)","b":"과거동사구 had to isolate의 목적어가 주어인 he와 동일한 대상이므로 목적어 자리에 재귀대명사 himself가 쓰였다. 문장의 필수 성분인 목적어의 역할이므로 생략할 수 없다."},{"t":"분사구문","p":"완전한 절+접속사(while)+현재분사(creating)~","b":"접속사 while(~하는 동안) 다음의 creating이 이끄는 분사구의 의미상 주어는 he이며, he가 ‘만드는’ 주체이므로 능동 관계를 나타내는 현재분사 creating이 쓰였다. 분사구문은 보통 접속사를 생략하지만, 본문은 시간 관계를 분명히 하기 위해 쓰인 접속사를 생략하지 않았다. 전환 ~ he had to isolate himself while he created[was creating] them.","x":["참고 ‘접속사+현재분사’ 구조에 쓰이는 접속사는 ‘although, as if, as though, even if, if, once, though, until, unless, when(ever), whether … or, while’이다."]}]},{"en":"He wrote of the isolation {0} he and other people who loved languages experienced: “But they become {1}, ashamed of spending the valuable commodity of time for their private pleasure, and higher developments {2} in secret places.”","ko":"그는 언어를 사랑하는 자신 및 다른 사람들이 경험한 고립감에 대해 이렇게 썼다. “하지만 그들은 시간이라는 귀중한 재화를 사적인 즐거움을 위해 소비하는 것이 부끄러워 수줍어하며, 더 높은 수준의 발전은 비밀스러운 곳에 갇히게 된다.”","c":[{"o":["that","what"],"a":0,"why":"선행사 the isolation이 있고 experienced의 목적어가 빠진 절이에요. → 목적격 관계대명사 that","tag":"관계사·명사절"},{"o":["shyly","shy"],"a":1,"why":"become 뒤 보어 자리에는 형용사를 써요.","tag":"문형"},{"o":["are locked","lock"],"a":0,"why":"발전이 ‘갇히는’ 대상이라 수동태예요.","tag":"시제·태"}],"notes":[{"t":"목적격 관계대명사","p":"명사구(선행사)+that+목적어 없는 불완전한 절","b":"타동사 experienced의 목적어가 없는 불완전한 절 ‘he and ~ experienced’가 관계사절을 이루어 선행사인 명사구 ‘the isolation’을 수식하고 있으며, 이때 which로 대신할 수 있고 목적격 관계대명사 that은 생략할 수 있다.","x":["전환 ~ the isolation (that) he and other people who loved languages experienced [목적어×]"]},{"t":"주격 관계대명사 who","p":"명사구(선행사)+who+주어 없는 불완전한 절","b":"주어가 없는 불완전한 절(loved languages)을 이끌어 병렬연결의 명사구 he or other people을 선행사로 수식하는 관계사절을 이루며, that으로 바꿀 수 있다."},{"t":"become+형용사","p":"become+주격보어(shy)","b":"‘~하게 되다’를 뜻하는 2형식의 동사 become의 현재형에 형용사 shy가 이어져 ‘수줍어하게 된다’를 뜻한다."},{"t":"분사구문 & 과거분사 형태의 형용사 ashamed of ~ & 동명사","p":"완전한 절,+형용사(ashamed)+전치사(of)+동명사구","b":"완전한 절에 접속사 없이 쉼표로 연결되어 이유나 동시동작을 나타내는 분사구로, 의미상 주어인 주절 주어 they가 ‘창피하게 된, 수치스럽게 된’ 대상이므로, 타동사 shame(~을 창피하게 하다)에서 유래해 수동 관계를 나타내는 과거분사 형태의 형용사 ashamed가 쓰였고, 전치사 of로 수치심의 원인인 동명사구 spending ~ pleasure를 연결해 '~을 쓰는 것에 대해 부끄러운'을 뜻한다. 앞에 현재분사 being이 생략되거나, 부사절을 이끄는 '접속사+주어+be동사'의 생략으로 설명할 수 있다.","x":["전환 ~: “But they become shy, being ashamed of spending the valuable commodity ~ =~: “But they become shy, as they are ashamed of spending the valuable commodity ~"]},{"t":"수동태","p":"be동사(are)+과거분사(locked)+전치사(in)+명사구","b":"주어인 higher developments가 ‘갇힌’ 대상이므로, 'lock ~ in …'(…에 ~을 가두다)의 수동태 '~ be locked in …'이 현재시제 are locked in으로 쓰였다."}]}],"write":[{"ko":"『호빗』과 『반지의 제왕』의 작가인 J. R. R. 톨킨(J. R. R. Tolkien)은 언어에 열정적이었다.","en":"J. R. R. Tolkien, the author of The Hobbit and The Lord of the Rings, was passionate about language."},{"ko":"그는 문법 규칙과 역사를 가진 언어를 발명했는데, 그것은 신다린(Sindarin)과 꿰냐(Quenya)로, 전자는 웨일스어에서, 후자는 핀란드어와 라틴어에서 영감을 얻었다.","en":"He invented languages with grammar rules and histories: Sindarin and Quenya, the former inspired by Welsh, and the latter inspired by Finnish and Latin."},{"ko":"하지만 언어를 발명하는 것은 좌절감이 느껴지는 취미였는데 왜냐하면 그는 그것을 만들어 내는 동안 스스로를 고립시켜야 했기 때문이다.","en":"But inventing languages was a frustrating hobby because he had to isolate himself while creating them."},{"ko":"그는 언어를 사랑하는 자신 및 다른 사람들이 경험한 고립감에 대해 이렇게 썼다. “하지만 그들은 시간이라는 귀중한 재화를 사적인 즐거움을 위해 소비하는 것이 부끄러워 수줍어하며, 더 높은 수준의 발전은 비밀스러운 곳에 갇히게 된다.”","en":"He wrote of the isolation that he and other people who loved languages experienced: “But they become shy, ashamed of spending the valuable commodity of time for their private pleasure, and higher developments are locked in secret places.”"}]},{"id":"L1-4","title":"1과 본문 ❹","lines":[{"en":"Things are very different now.","ko":"지금은 상황이 아주 다르다.","notes":[{"t":"5형식 동사 allow & 병렬연결","p":"allows+목적어(people)+목적격보어(to+동사원형(1)(learn)~+and+동사원형(2)(meet)~","b":"동사 allow가 ‘~가 …하는 것을 가능하게 하다’라는 뜻의 5형식 구문인 ‘allow+목적어+목적격보어(to부정사)’로 쓰여, 현재동사 allows 뒤에 목적어로 명사 people이, 목적격보어로 to부정사구가 쓰여, to에 이어 동사원형 learn과 meat이 각각 이끄는 두 동사구가 등위접속사 and로 병렬연결을 이루어 '사람들이 ~ 배우고 ~을 만나는 것을 가능하게 하다'를 뜻한다."},{"t":"other ~","p":"other+복수명사구","b":"‘다른 ~들’의 뜻으로, 형용사 other가 복수명사구 language enthusiasts를 꾸며 '다른 언어 애호가들'을 뜻한다. (×)other language enthusiast","x":["참고 other+복수가산명사(구)[불가산명사(구)] ‘다른 ~(들)’ another+단수가산명사(구)[숫자+복수명사(구)] ‘또 다른 ~(들)’ the other+단수가산명사(구) ‘(앞에 언급된 둘 또는 여러 개 중) 나머지 다른 한 ~’ the other+복수가산명사(구) ‘(앞에 언급된 여러 개 중) 나머지 다른 ~들’"]},{"t":"이중전치사","p":"전치사(from)+부사(all)+전치사구(over the world)","b":"전치사 from(~으로부터)에 다시 부사 all이 꾸미는 전치사구 over the world가 이어져 ‘세계 전역으로부터의’를 뜻한다.","x":["참고 전치사 from, to, under, in, at, until/till, like, for 등에 장소나 시간의 전치사구가 쓰일 수 있다. e.g. from under ~ ‘~의 아래로부터‘ / till after ~ ‘~ 이후까지‘ / in between ~ ‘~ 사이에 있는‘"]}]},{"en":"The Internet allows people {0} about languages and meet {1} language enthusiasts from all over the world.","ko":"인터넷은 사람들이 언어에 대해 배우고 전 세계의 다른 언어 애호가들을 만날 수 있게 해 준다.","c":[{"o":["learn","to learn"],"a":1,"why":"allow+O+to부정사 (5형식). 뒤의 meet은 to learn과 병렬이에요.","tag":"문형"},{"o":["other","others"],"a":0,"why":"other+복수명사. others는 대명사라 뒤에 명사가 올 수 없어요.","tag":"형용사·부사"}]},{"en":"{0} working on their projects in private, they can easily find other like-minded people to share their passion, celebrate their achievements, and {1} each other along the way.","ko":"개인적으로 자신의 프로젝트를 진행하는 대신, 그들은 비슷한 생각을 가진 다른 사람들을 쉽게 찾아 열정을 공유하고, 성취를 축하하며, 그 과정에서 서로를 격려할 수 있다.","c":[{"o":["Instead of","Instead"],"a":0,"why":"구전치사 instead of 뒤에는 동명사(구)가 와요.","tag":"접속사·전치사"},{"o":["encouraging","encourage"],"a":1,"why":"to share, celebrate, and encourage — to부정사의 동사원형 병렬이에요.","tag":"병렬·도치·어순"}],"notes":[{"t":"구전치사 instead of ~ & 동명사","p":"구전치사(Instead of)+동명사(working) ~","b":"‘~하는 것 대신에’의 뜻으로, 구전치사 Instead of의 목적어로 동명사 working이 이끄는 동명사구가 쓰였다. 전치사 of가 이어지지 않은 instead는 ‘대신에’를 뜻하는 부사이다.","x":["참고 = rather than ~, in place of ~, in substitution for ~, in lieu of ~, as a substitute for ~"]},{"t":"구동사 work on ~","p":"자동사(working)+부사+전치사(on)+명사구","b":"'~에 애써 공을 들이다'를 뜻하는 '자동사+전치사' 구조의 구동사가 쓰였다."},{"t":"other ~","p":"other+복수명사구","b":"‘다른 ~들’의 뜻으로, 형용사 other가 복수명사구 like-minded people을 꾸며 '다른 비슷한 생각을 가진 사람들'을 뜻한다. (×)other like-minded person"},{"t":"복합형용사 & 유사분사","p":"복합형용사(형용사 like-유사분사 minded)+명사(people)","b":"명사(mind)에 ‘~의, ~을 가진’ 뜻의 어미 -ed가 결합한 과거분사 형태의 유사분사 minded(마음의)가 앞의 형용사 like(유사한)와 붙임표(hyphen)로 연결된 복합형용사 like-minded(유사한 마음의)가 명사 people을 앞에서 꾸민다. e.g. '명사+-ed' 구조의 유사분사가 쓰인 예들: mirrored ‘거울로 된’; skilled ‘숙련된’; red-haired ‘빨강머리의’; single-hearted ‘한[같은] 마음의’"},{"t":"부사적 용법의 to부정사 & 병렬연결","p":"완전한 절+to부정사구(to+동사원형(1)(share) ~,+동사원형(2)(celebrate) ~,+and+동사원형(3)(encourage) ~","b":"완전한 절(they ~ people)에 이어진 to share 이하는 부사적 용법 중 목적(~하기 위해)이나 결과(~하여 …하다)의 to부정사구이며, to에 이어 동사원형 share, celebrate, encourage가 각각 이끄는 세 동사구가 ‘A, B, and C’의 형태로 병렬 연결되었다."},{"t":"each other","p":"동사(encourage)+목적어(each other)","b":"‘서로’를 뜻하는 대명사 표현인 each other가 동사 encourage의 목적어로 쓰여 '서로를 격려하다'를 뜻한다. 같은 의미로 one another도 가능하다.","x":["참고 ‘서로’ 뜻으로, 둘은 each other, 셋 이상은 one another이었지만, 현대 영어에서는 동일한 의미로 쓰이며 each other가 비격식체에서 one another보다 널리 쓰인다. 대체로 주어로는 쓰이지 않으며 소유격은 각각 each other’s와 one another’s로 쓴다. meet이나 marry처럼 동사 자체가 ‘서로 함께 ~하다’라는 의미이면 대체로 목적어에 사용되지 않는다."]}]},{"en":"They could even work together on language projects that Tolkien may have never been able to imagine.","ko":"그들은 심지어 톨킨도 상상하지 못했을 언어 프로젝트를 함께 진행할 수도 있을 것이다.","notes":[{"t":"과거조동사 could","p":"과거조동사(could)+부사(even)+동사원형(work)","b":"과거조동사 would, could, might가 현재나 미래시제로 쓰이면 의견이나 주장의 완곡한 느낌을 나타낸다. 본문은 '~할 수도 있다'의 뜻으로 과거조동사 could가 쓰여 글쓴이의 의견을 완곡하게 전달한다.","x":["참고 could 1. (능력/허가) ~할 수 있었다 2. (추측/가능성) ~할 수도 있다 could have p.p. '~했을지도 모른다' 3. (가정) ~할 수도 있다 could have p.p. '~할 수도 있었다' 4. (정중한 요구) ~해 주시겠습니까 5. (제안) ~할 수 있을 것이다 6. (확신) could not+동사원형 '~할 리가 없다' could not have p.p. '~했을 리가 없다'"]},{"t":"목적격 관계대명사","p":"명사구(선행사)+that+목적어 없는 불완전한 절","b":"to imagine의 목적어가 없는 불완전한 절 ‘Tolkien ~ imagine’이 이어져 관계사절을 이루어 선행사인 명사구 ’language projects’를 수식하고 있으며, 이때 목적격 관계대명사 that은 생략할 수 있고, which도 가능하다.","x":["전환 ~ language projects (which) Tolkien may have never been able to imagine [목적어×]."]},{"t":"may/might+have p.p.","p":"조동사(may)+have+부정의 부사(never)+과거분사(been)","b":"‘may/might+have p.p.’는 ‘~했을지도 모른다‘의 뜻으로 동작이 이전에 이미 이루어진 것에 대한 약한 추측을 나타내며, 과거시제, 현재시제, 미래시제에 모두 사용된다. 본문에서 부정의 부사 never가 쓰인 may have never been은 ’(과거에) 결코 ~이지 않았을지 모른다‘의 뜻으로 글의 현재시제 흐름 속에 사용되었다. e.g. Polly’s very late. She may have missed her train. 폴리가 꽤 늦네. 기차를 놓쳤을지도 몰라. (과거) / I'll try phoning him, but he may have gone out by now. 그에게 전화를 걸어보겠지만 지금쯤 나갔을지도 모른다. (현재) / By the end of this year I might have saved some money. 연말이면 돈이 좀 모였을 수도 있다. (미래)"}]}],"write":[{"ko":"지금은 상황이 아주 다르다.","en":"Things are very different now."},{"ko":"인터넷은 사람들이 언어에 대해 배우고 전 세계의 다른 언어 애호가들을 만날 수 있게 해 준다.","en":"The Internet allows people to learn about languages and meet other language enthusiasts from all over the world."},{"ko":"개인적으로 자신의 프로젝트를 진행하는 대신, 그들은 비슷한 생각을 가진 다른 사람들을 쉽게 찾아 열정을 공유하고, 성취를 축하하며, 그 과정에서 서로를 격려할 수 있다.","en":"Instead of working on their projects in private, they can easily find other like-minded people to share their passion, celebrate their achievements, and encourage each other along the way."},{"ko":"그들은 심지어 톨킨도 상상하지 못했을 언어 프로젝트를 함께 진행할 수도 있을 것이다.","en":"They could even work together on language projects that Tolkien may have never been able to imagine."}]},{"id":"L1-5","title":"1과 본문 ❺","lines":[{"en":"While some people pursue a hobby to improve their skills, some {0} for the sheer pleasure of doing it.","ko":"어떤 사람들은 자신의 기술을 향상하기 위해 취미를 추구하지만, 어떤 사람들은 그것을 행하는 순수한 즐거움을 위해 그렇게 한다.","c":[{"o":["does","do"],"a":1,"why":"pursue a hobby를 대신하는 대동사예요. 주어 some(=some people)이 복수라 do","tag":"수일치"}],"notes":[{"t":"접속사 while","p":"대조 부사절 접속사(While)+완전한 절","b":"‘1. ~ 동안에 2. ~한 반면에[한편] 3. ~하지만[함에도]’의 뜻 중에서, 주절의 대조적인 내용에 상응하여 2번 뜻으로 대조 부사절을 이끌어, 뒤에 완전한 절 some ~ skills가 이어졌다."},{"t":"부사적 용법의 to부정사","p":"완전한 절+to부정사구","b":"완전한 절(While ~ a hobby)에 이어진 ‘to improve their skills’는 목적(~하기 위해서)을 나타내는 부사적 용법의 to부정사구이다."},{"t":"동사의 수일치 & 대동사","p":"복수주어(some)+복수대동사(do)","b":"앞 절의 주어 some people에 상응하여 복수로 쓰인 대명사 some에 맞춰 복수동사 do가 쓰였고, 일반동사구 pursue a hobby에 상응하여 대동사 do가 쓰였다. (×)some does (×)some are"}]},{"en":"Albert Einstein started learning to sail when he was 18 years old, venturing out on the lakes in Switzerland and simply {0} the time on his boat.","ko":"알베르트 아인슈타인(Albert Einstein)은 18세 때 항해를 배우기 시작했고, 스위스의 호수로 모험해 나가며 그저 배 위에서 시간을 즐겼다.","c":[{"o":["enjoy","enjoying"],"a":1,"why":"분사구문 venturing과 and로 병렬이므로 enjoying","tag":"병렬·도치·어순"}],"notes":[{"t":"동명사 목적어","p":"started+목적어(learning)","b":"‘~하는 것을 시작하다’의 뜻으로 타동사 start는 동명사와 to부정사 모두 목적어로 올 수 있어, started의 목적어로 동명사 learning이 쓰였고 to learn도 가능하다."},{"t":"to부정사 목적어","p":"learning+목적어(to sail)","b":"'~하는 것을 배우다'의 뜻으로 타동사 learn은 to부정사를 목적어로 취하므로 learning의 목적어로 to부정사 to sail이 쓰였다."},{"t":"숫자+복수단위명사+형용사","p":"숫자(18)+복수단위명사(years)+old","b":"’18세의‘의 뜻으로, 숫자 18에 이어 복수의 단위명사 years가 쓰이고 형용사 old가 이어져 be동사의 보어인 형용사구로 쓰였다.","x":["참고 붙임표(hyphen)를 사용하여 연결된 복합형용사 ‘숫자-단수단위명사-형용사’가 명사를 앞에서 꾸미면 단위명사는 단수형을 쓴다. 또한 복합명사로 쓰이면 맨 뒤에 -s/es의 복수형도 가능하다. e.g. (×)a 42-years-old Canadian '42세의 캐나다인' cf) ≠ 42-year-olds ‘42세들’ a 4-foot-high tree '4피트 높이의 나무' a 5-story building '5층의 건물'"]},{"t":"분사구문 & 병렬연결","p":"완전한 절+현재분사1(venturing) ~+and simply+현재분사2(enjoying) ~","b":"의미상 주어인 Albert Einstein이 ‘모험하고 즐기는’ 주체이므로 능동의 의미인 현재분사 venturing과 enjoying이 두 분사구를 이끌며 등위접속사 and를 사이에 두고 병렬로 연결되었다."}]},{"en":"He continued to enjoy sailing as a life-long sailor.","ko":"그는 평생 배 타는 사람으로서 항해를 계속 즐겼다.","notes":[{"t":"to부정사 목적어","p":"continued+to enjoy(목적어)","b":"동사 continued의 목적어로 to부정사 to enjoy가 쓰였다. 동사 continue는 동명사와 to부정사 모두 목적어로 취할 수 있으며 ‘~하는 것을 시작하다’를 뜻하며, 동명사 enjoying도 가능하다.","x":["참고 continue vt. 1. ~을 계속하다(=go on ~) continue+동명사/to부정사 '~하는 것을 계속하다' 2. ~을 재개하다(=resume) continue+동명사 '(중단된 후) ~하는 것을 계속하다' 3. (중단된 후에) ~을 계속해 말하다 vi. 4. 계속하다 continue with ~ '~을 계속하다’ 5. 계속되다 continue for+시간 명사(구) '~ 동안 계속되다' continue+보어(unabated/apace) '~한 상태로(약해지지 않고/빠른 속도로) 계속되다’ 6. (같은 방향으로) 계속 가다, 계속 있다 continue as ~ ’(역할 등)으로 계속 있다’"]},{"t":"동명사 목적어","p":"to enjoy+sailing(목적어)","b":"동사 enjoy는 동명사를 목적어로 취하므로 enjoy의 목적어로 동명사 sailing이 쓰였다. 또는 '항해'를 뜻하는 동사파생명사 sailing으로도 설명할 수 있다."},{"t":"복합형용사","p":"복합형용사(명사-형용사)+명사(구)","b":"명사 life가 형용사 long 앞에 붙임표(hyphen)로 결합되어 ‘평생의’을 뜻하는 복합형용사 life-long이 명사 individuals를 앞에서 꾸민다."}]},{"en":"Although he is {0} a genius in physics, he wasn’t a good sailor, nor {1} about his sailing technique.","ko":"그는 물리학의 천재로 여겨짐에도 불구하고, 뛰어난 선원이 아니었으며, 자신의 항해술에도 신경 쓰지 않았다.","c":[{"o":["considered","considering"],"a":0,"why":"5형식 consider+O+O·C의 수동태 ‘be considered a genius’","tag":"시제·태"},{"o":["did he care","he cared"],"a":0,"why":"부정어 nor가 문두에 오면 도치(조동사+주어+동사원형)돼요.","tag":"병렬·도치·어순"}],"notes":[{"t":"5형식의 수동태","p":"be동사(is)+과거분사(considered)+명사구(a genious)","b":"주어 he가 ‘여겨지는’ 대상이므로, ‘~을 …으로 여기다’를 뜻하는 5형식 구문 ‘consider ~ (to be, [영국식] as+(being)) …’의 수동태가 현재시제 is considered와 보어로 명사구 a genius가 쓰였고, 명사구 앞에 to be가 쓰일 수 있다. to be 대신 전치사 as (being)도 쓰이지만, 미국 영어에서는 부적절하게 여긴다.","x":["참고 = consider ~ (to be, [영국식] as (being)) … = deem ~ (to be) … = regard, see, view, think of+ ~ as (being) … (전환) ~ is considered (to be[영국식 as (being)]) a genius ~ =~ is deemed (to be) a genius ~ =~ is regarded[seen, viewed, thought of] as (being) a genius ~"]},{"t":"부정어 도치","p":"부정의 절(~ wasn’t ~),+부정어(nor)+조동사(did)+주어(he)+동사원형(care)","b":"앞의 부정의 절 he wasn’t a good sailor에 상응해 쉼표로 연결되어, 부정어 nor(또한 ~도 아니다)가 절 앞에 와서 ‘be/조동사’ 도치가 적용되어, 일반동사의 과거형 cared의 도치를 위해 앞에 온 조동사 did에 이어 주어 he가 오고 동사원형 care가 쓰였다. 부정의 부사로 쓰이면 nor 앞에 접속사 and가 쓰이기도 하고, nor 대신 부정의 접속사/부사 neither도 가능하며, not ~(,) either로 바꿔 설명할 수도 있다.","x":["전환 ~ he wasn’t a good sailor, and nor did he care about his sailing technique. ~ he wasn’t a good sailor, (and) neither did he care about his sailing technique. =~ he wasn’t a good sailor, and he didn't care about his sailing technique(,) either."]}]},{"en":"His technique remained at a basic level, {0} was simply to “Set sail, make it fast, no thoughts of energy or speed, lean back, let the boat {1}.”","ko":"그의 기술은 기본적인 수준에 머물렀는데, 그것은 그저 ‘돛을 올리고, 배를 고정하고, 에너지나 속도에 대한 생각 없이, 몸을 뒤로 젖히고, 배가 표류하도록 내버려두는 것’이었다.","c":[{"o":["that","which"],"a":1,"why":"앞 절을 부연하는 계속적 용법은 which만 가능해요. (that은 계속적 용법 불가)","tag":"관계사·명사절"},{"o":["drift","drifted"],"a":0,"why":"사역동사 let+O+동사원형","tag":"문형"}],"notes":[{"t":"계속적 용법의 주격 관계대명사","p":"선행사(명사구 a basic level),+which+주어가 없는 불완전한 절","b":"완전한 절에 콤마(,)로 이어진 which 이하는 앞의 명사구 a basic level을 부연 설명하는 관계사절이다. 계속적 용법의 주격 관계대명사 which가 주어가 없는 불완전한 절(was ~ drift.“)을 이끌고 있으며, 절 끝에 쓰여 ‘접속사+대명사’로 바꿔 설명할 수 있다.","x":["전환 ~ a basic level, and it was simply to ~"]},{"t":"명사적 용법의 to부정사 & 쉼표 연결","p":"be동사(was)+부사+보어(to+동사원형(1)~,+동사원형(2)~,+부연 설명,+동사원형(3)~,+동사원형(4))","b":"be동사 was의 주격보어로 부사 simply(단지, 그저)의 꾸밈을 받는 명사적 용법의 to부정사구가 쓰였고, to에 동사원형 Set, make, lean, let이 각각 이끄는 네 동사구가 쉼표에 의해 'A, B, C, D'로 연결되어, 'A, B, C, and D'보다 긴밀한 연속을 나타낸다."},{"t":"부연 설명","p":"동사원형(1)~,+동사원형(2)~,+명사구,+동사원형(3)~,+동사원형(4)","b":"동사원형의 네 동사구가 나열된 사이에 명사구 no thoughts of energy or speed가 삽입되어 있어 동사원형의 의미상 주어인 he의 상태를 부연 설명하여 '에너지나 속도에 대한 생각 없이'를 뜻하는 이해할 수 있다. 이 경우 앞에 전치사 with가 생략된 것으로 볼 수 있다. 전환 ~, with no thoughts of energy or speed, ~다른 분석 병렬연결의 동사원형 have가 생략되었다. 전환 ~, have no thoughts of energy or speed, ~"},{"t":"사역동사 let","p":"사역동사(let)+목적어+목적격보어(동사원형)","b":"‘~가 …하도록 두다’의 뜻으로, 5형식의 사역동사 let의 동사원형에 이어, 목적어 the boat의 목적격보어로 동사원형 drift가 쓰여 ‘배가 표류하도록 내버려두다’를 뜻한다."}]}],"write":[{"ko":"어떤 사람들은 자신의 기술을 향상하기 위해 취미를 추구하지만, 어떤 사람들은 그것을 행하는 순수한 즐거움을 위해 그렇게 한다.","en":"While some people pursue a hobby to improve their skills, some do for the sheer pleasure of doing it."},{"ko":"알베르트 아인슈타인(Albert Einstein)은 18세 때 항해를 배우기 시작했고, 스위스의 호수로 모험해 나가며 그저 배 위에서 시간을 즐겼다.","en":"Albert Einstein started learning to sail when he was 18 years old, venturing out on the lakes in Switzerland and simply enjoying the time on his boat."},{"ko":"그는 평생 배 타는 사람으로서 항해를 계속 즐겼다.","en":"He continued to enjoy sailing as a life-long sailor."},{"ko":"그는 물리학의 천재로 여겨짐에도 불구하고, 뛰어난 선원이 아니었으며, 자신의 항해술에도 신경 쓰지 않았다.","en":"Although he is considered a genius in physics, he wasn’t a good sailor, nor did he care about his sailing technique."},{"ko":"그의 기술은 기본적인 수준에 머물렀는데, 그것은 그저 ‘돛을 올리고, 배를 고정하고, 에너지나 속도에 대한 생각 없이, 몸을 뒤로 젖히고, 배가 표류하도록 내버려두는 것’이었다.","en":"His technique remained at a basic level, which was simply to “Set sail, make it fast, no thoughts of energy or speed, lean back, let the boat drift.”"}]},{"id":"L1-6","title":"1과 본문 ❻","lines":[{"en":"On a boat, he forgot everything {0} in the world, {1} may explain {2} sailing so much.","ko":"배 위에서, 그는 세상의 다른 모든 것을 잊었는데, 이는 그가 항해를 그토록 즐겼던 이유를 설명해 주는 것인지도 모른다.","c":[{"o":["else","other"],"a":0,"why":"-thing을 꾸미는 else는 뒤에 와요. (everything else)","tag":"형용사·부사"},{"o":["which","that"],"a":0,"why":"앞 절 전체를 받는 계속적 용법이라 which","tag":"관계사·명사절"},{"o":["why he enjoyed","why did he enjoy"],"a":0,"why":"간접의문문은 의문사+주어+동사 어순이에요.","tag":"병렬·도치·어순"}],"notes":[{"t":"else의 후치 수식","p":"부정대명사(everything)+else","b":"else는 ‘그 밖의, 다른’ 의미의 형용사 또는 부사로 쓰여, 부정대명사나 부정부사, 의문대명사, 의문부사를 뒤에서 수식한다. 여기서는 부정대명사 everything을 형용사로 쓰인 else가 뒤에서 꾸며 ‘그 밖의 다른 모든 것’를 뜻한다."},{"t":"계속적 용법의 주격 관계대명사","p":"선행사(앞 절),+which+주어가 없는 불완전한 절","b":"콤마(,) 뒤에 이어진 which 이하는 앞 절 전체 ‘He ~ world’를 부연 설명하는 관계사절이다. 계속적 용법의 주격 관계대명사 which가 주어가 없는 불완전한 절(may explain ~ much)을 이끌고 있다. 계속적 용법이므로 that은 쓸 수 없고, 절 끝에 쓰여 ‘접속사+대명사’로 바꿔 설명할 수 있다.","x":["전환 On ~ the world, and it[this/that] may explain why ~"]},{"t":"간접의문문","p":"동사(explain)+의문부사(why)+주어+동사","b":"동사 explain의 목적어로 '의문사(구)+평서문' 어순의 간접의문문이 사용되었다. 본문에서 의문부사 why 뒤에 평서문 어순으로 주어 he와 동사 enjoyed 이하의 완전한 절이 이어진다. (×) ~ explain why did he enjoy sailing ~"},{"t":"동명사 목적어","p":"enjoyed+sailing(목적어)","b":"동사 enjoy는 동명사를 목적어로 취하므로 enjoyed의 목적어로 동명사 sailing이 쓰였다. 또는 '항해'를 뜻하는 동사파생명사 sailing으로도 설명할 수 있다."},{"t":"so much","p":"동사구(enjoyed sailing)+부사(so)+부사(much)","b":"부사 so가 부사 much를 꾸민 so much는 '그토록, 매우 많이'를 뜻하여 앞의 동사구 enjoyed sailing을 꾸며 '그토록 항해를 즐겼다'를 뜻한다.","x":["참고 so much 1. [비교급·최상급을 강조하는 부사구] '한층, 훨씬' 2. [동사를 강조하는 부사구] '그토록, 매우 많이' 3. [불가산명사(구)를 꾸미는 형용사구] '매우 많은' '그 정도로 많은' 4. [대명사구] '아주 많은 양'"]}]},{"en":"For him, it was being out on the water {0} {1} the most.","ko":"그에게 있어서 가장 중요했던 것은 바로 물 위에 나가 있는 것이었다.","c":[{"o":["what","that"],"a":1,"why":"it was ~ that 강조 구문이에요. 강조하는 어구 뒤에 that","tag":"관계사·명사절"},{"o":["was mattered","mattered"],"a":1,"why":"matter(중요하다)는 자동사라 수동태가 불가능해요.","tag":"시제·태"}],"notes":[{"t":"it-that 강조 용법 & 동명사","p":"It is+강조 대상(동명사구 being out on the water)+that+주어 없는 불완전한 절","b":"it-that 강조 구문으로, It was에 이어 주어인 동명사구 being out on the water가 위치해 강조되고, 이어 that 뒤에 동사 mattered 앞의 주어가 없는 불완전한 절이 쓰여 ‘가장 중요했던 것은 바로 물 위에 나가 있는 것이었다’를 뜻한다.","x":["참고 [강조 이전 문장] ~, being out on the water mattered the most."]},{"t":"자동사 matter","p":"주격 관계대명사(what)+동사(mattered)","b":"’중요하다’를 뜻하는 자동사 matter가 과거형 mattered로 쓰였다. 자동사이므로 수동태가 불가하다. (×)that was mattered","x":["참고 matter n. 문제, 물질, [복수형] 상황 vi. 중요하다"]},{"t":"최상급","p":"동사(mattered)+the+최상급(most)","b":"the에 이어 부사 much의 최상급 most가 동사 mattered를 꾸며 '가장 중요했다'를 뜻한다. 부사의 최상급에서 the는 생략될 수 있다. 전환 ~ mattered most."}]},{"en":"Einstein used the hobby of sailing to go to a place {0} he could be completely {1}.","ko":"아인슈타인은 자신이 완전히 휴식을 취할 수 있는 장소로 가기 위해 항해라는 취미를 이용했다.","c":[{"o":["where","which"],"a":0,"why":"뒤에 완전한 절이 이어지므로 관계부사 where","tag":"관계사·명사절"},{"o":["relaxing","relaxed"],"a":1,"why":"he가 ‘편안함을 느끼는’ 쪽이라 과거분사형 형용사 relaxed","tag":"분사"}],"notes":[{"t":"동격의 of","p":"명사구+of+동명사/동사파생명사","b":"명사구 the hobby와 동격을 이루는 동명사(항해하기) 또는 동사파생명사(항해) sailing을 연결하는 동격의 of가 쓰였다."},{"t":"부사적 용법의 to부정사","p":"완전한 절+to부정사구","b":"to부정사 to go가 ‘가기 위해 (~을 사용했다)’를 뜻하여 ‘목적’을 나타내는 부사적 용법으로 to부정사구를 이끈다."},{"t":"관계부사 where","p":"장소 명사구+where+완전한 절","b":"완전한 절(he could be completely relaxed)을 이끌어 장소를 나타내는 a place를 선행사로 수식하는 관계사절을 이루는 관계부사 where가 쓰였다. 선행사가 일반 장소를 나타내는 a place일 때 관계부사를 생략하거나, 관계부사 대용의 that을 쓸 수 있고, 선행사에 어울리는 전치사가 쓰인 in/at which도 가능하다.","x":["전환 ~ to go to a place (that, in/at which) he could be completely relaxed."]},{"t":"과거분사 형태의 형용사","p":"be+부사+형용사(relaxed)","b":"주어 he가 ‘편하게 된’ 대상이므로 타동사 relax(~을 편하게 하다)에서 유래한 수동 관계를 나타내는 과거분사 형태의 형용사 relaxed가 쓰였다."}]},{"en":"Maybe that’s {0} he named his boat Tinef, {1} “worthless” in Yiddish, after the apparent meaninglessness of his sailing adventures.","ko":"아마 그래서 그는 무의미한 것처럼 보이는 자신의 항해 모험을 따서 자신의 배 이름을 이디시어로 ‘가치 없는’이라는 뜻의 ‘티네프(Tinef)’로 지었는지도 모른다.","c":[{"o":["because","why"],"a":1,"why":"that’s why ~ ‘그것이 ~한 이유다(그래서 ~했다)’. because로 바꾸면 인과가 뒤집혀요.","tag":"관계사·명사절"},{"o":["meant","meaning"],"a":1,"why":"Tinef가 ‘의미하는’ 능동 관계라 현재분사구예요.","tag":"분사"}],"notes":[{"t":"명사절을 이끄는 관계부사 why","p":"That's(주어 That+be동사 is)+why+완전한 절","b":"’~한 이유(이다)‘의 뜻으로, be동사 is의 보어인 명사절을 이끄는 선행사 포함 관계부사 why가 쓰였고, 완전한 절이 이어졌다. 생략된 선행사인 the reason이 오면 관계부사 why, 관계부사 대용의 that, 선행사에 어울리는 전치사가 쓰인 for which가 대신할 수 있고, 생략될 수 있다. cf) ‘원인+be why+결과‘ ≠ ’결과+be because+원인‘","x":["전환 ~ that's the reason (why, that, for which) he named his boat Tinef, ~"]},{"t":"5형식 동사 name & 전치사 after","p":"named+목적어(명사구)+목적격보어(고유명사),+~,+전치사(after)+명사구","b":"동사 name이 ‘~을 …라고 이름 짓다’라는 뜻의 5형식 동사로 쓰여, 목적어로 명사구 his boat, 목적격보어로 고유명사 Tinef가 쓰였다. Tinef에 대한 부연 설명이 두 쉼표로 삽입된 후, '~을 본떠서'를 뜻하는 전치사 after로 이름의 원천인 명사구 the apparent ~ adventures'를 연결했다."},{"t":"현재분사(구)","p":"고유명사(Tinef),+현재분사(meaning)~,+~","b":"부연 설명 대상인 고유명사 Tinef 뒤에 두 쉼표로 삽입되어, 명사구가 ‘~을 의미하는’ 주체이므로, 타동사 mean(~을 의미하다)의 준동사로 능동 관계를 나타내는 현재분사 meaning이 분사구를 이끈다. ‘계속적 용법의 주격 관계대명사+동사(단순시제/진행시제)’로 바꿔 설명할 수 있다.","x":["전환 ~ Tinef, which meaned “worthless” in Yiddish, ~ (mean은 상태동사라 진행형 불가)"]}]},{"en":"Watching the waves while on his boat, Einstein forgot {0}.","ko":"자신의 배 위에서 파도를 보면서, 아인슈타인은 모든 걱정을 잊었다.","c":[{"o":["all his worries","his all worries"],"a":0,"why":"all+소유격+명사 어순이에요.","tag":"병렬·도치·어순"}],"notes":[{"t":"분사구문","p":"현재분사(Watching) ~,+완전한 절","b":"현재분사 Watching이 이끄는 분사구는 접속사와 주절의 주어와 동일한 주어를 생략한 분사구문으로, 뒤에 접속사 없이 콤마(,)로만 연결된 완전한 절이 이어졌다. 주절의 주어 Einstein이 ‘보는’ 주체이므로 타동사 watch(~을 보다)의 준동사로 능동 관계를 나타내는 현재분사 Watching이 쓰였다. '접속사+주어+동사(단순/진행시제)'의 부사절로 바꿀 수 있다.","x":["전환 As he watched[was watching] the waves while on his boat, ~"]},{"t":"접속사+전치사구","p":"접속사(while)+전치사구(on his boat)","b":"시간 관계를 분명히 하기 위해 쓰인 접속사 while에 전치사구 on his boat가 이어져 ‘자신의 배 위에 있는 동안’을 뜻한다. 주절 주어 Einstein을 가리키는 대명사 he와 be동사 was를 복원한 시간 부사절로 바꿔 설명할 수 있다.","x":["전환 Watching the waves while he was on his boat, ~"]},{"t":"어순","p":"all+소유격(his)~","b":"’모든 그의 ~‘의 뜻으로 한정사 all에 소유격 his로 시작하는 명사구가 연결될 수 있으며, 사이에 전치사 of가 생략되었다. 전환 ~ all of his worries (×)his all worries"}]},{"en":"Like Einstein, for many people, hobbies just provide the conditions for a sense of pure satisfaction.","ko":"아인슈타인처럼, 많은 사람에게 취미는 단지 순수한 만족감을 느낄 수 있는 환경을 제공한다."}],"write":[{"ko":"배 위에서, 그는 세상의 다른 모든 것을 잊었는데, 이는 그가 항해를 그토록 즐겼던 이유를 설명해 주는 것인지도 모른다.","en":"On a boat, he forgot everything else in the world, which may explain why he enjoyed sailing so much."},{"ko":"그에게 있어서 가장 중요했던 것은 바로 물 위에 나가 있는 것이었다.","en":"For him, it was being out on the water that mattered the most."},{"ko":"아인슈타인은 자신이 완전히 휴식을 취할 수 있는 장소로 가기 위해 항해라는 취미를 이용했다.","en":"Einstein used the hobby of sailing to go to a place where he could be completely relaxed."},{"ko":"아마 그래서 그는 무의미한 것처럼 보이는 자신의 항해 모험을 따서 자신의 배 이름을 이디시어로 ‘가치 없는’이라는 뜻의 ‘티네프(Tinef)’로 지었는지도 모른다.","en":"Maybe that’s why he named his boat Tinef, meaning “worthless” in Yiddish, after the apparent meaninglessness of his sailing adventures."},{"ko":"자신의 배 위에서 파도를 보면서, 아인슈타인은 모든 걱정을 잊었다.","en":"Watching the waves while on his boat, Einstein forgot all his worries."},{"ko":"아인슈타인처럼, 많은 사람에게 취미는 단지 순수한 만족감을 느낄 수 있는 환경을 제공한다.","en":"Like Einstein, for many people, hobbies just provide the conditions for a sense of pure satisfaction."}]},{"id":"L1-7","title":"1과 본문 ❼","lines":[{"en":"You may be {0} to find {1} pursuing a hobby can accomplish more than self-satisfaction.","ko":"여러분은 취미를 추구하는 것이 자기만족 이상의 것을 성취할 수 있다는 사실을 알고 놀랄 수도 있다.","c":[{"o":["surprised","surprising"],"a":0,"why":"주어 You가 ‘놀라는’ 쪽이라 과거분사 surprised","tag":"분사"},{"o":["that","what"],"a":0,"why":"뒤에 완전한 절이 오므로 명사절 접속사 that","tag":"접속사·전치사"}],"notes":[{"t":"과거분사 형태의 형용사 & 부사적 용법의 to부정사","p":"과거분사(surprised)+to부정사(to find)~","b":"주어 You가 '놀라게 된' 대상이므로 타동사 surprise(~을 놀라게 하다)에서 유래해 수동 관계를 나타내는 과거분사 형태의 형용사 surprised(놀란)가 be동사의 보어로 쓰였고, '감정의 원인'을 나타내는 부사적 용법의 to부정사구 to find가 뒤에서 꾸며 ‘~을 알게 되어 놀란’을 뜻한다."},{"t":"명사절 접속사 that","p":"to부정사(to find)+that+완전한 절","b":"to find의 목적어 자리에서 명사절 접속사 that이 완전한 절(a hobby ~ self-satisfaction)을 이끌고 있다. that은 생략이 가능하다."},{"t":"동명사구 주어","p":"주어(동명사(pursuing)+명사구(a hobby))+조동사(can) ~","b":"to find의 목적어인 that절에서 동명사구 pursuing a hobby가 주어로 쓰였으며 뒤에 동사 can accomplish가 이어졌다."},{"t":"대명사로 쓰인 more","p":"타동사(accomplish)+목적어(more)+전치사(than)+명사(self-satisfaction)","b":"much의 비교급 more가 대명사로 쓰여 '더 많은 것'의 뜻으로 동사 accomplish의 목적어 역할을 한다."}]},{"en":"That is, it sometimes leads {0} an unexpected contribution to society.","ko":"다시 말해, 그것은 때로 사회에 대한 예상치 못한 공헌으로 이어지기도 한다.","c":[{"o":["for","to"],"a":1,"why":"lead to ~ ‘~로 이어지다’","tag":"접속사·전치사"}],"notes":[{"t":"구동사 lead to ~","p":"자동사(leads)+전치사(to)+명사구","b":"‘~로 이어지다, ~을 초래하다’를 뜻하는 ‘자동사+전치사’ 구조의 구동사로, ‘원인+lead to+결과’의 구조로 원인인 주어와 결과인 명사(구)를 연결한다."},{"t":"과거분사 형태의 형용사","p":"an+형용사(unexpected)+명사","b":"수식 대상인 명사 contribution이 ‘예상되지 않은’ 대상이므로, 타동사 expect(~을 예상하다)의 준동사로 수동 관계를 나타내는 과거분사 expected와 부정의 접두사 un-이 결합된 과거분사 형태의 형용사 unexpected가 부정관사와 명사 사이에 쓰였다."}]},{"en":"For example, Thomas Bopp, a manager at a construction materials factory and an amateur astronomer, discovered the comet Hale-Bopp {0} the sky with his friends in the Arizona desert.","ko":"예를 들어, 건축 자재 공장의 관리자이자 아마추어 천문학자인 토마스 봅(Thomas Bopp)은 애리조나 사막에서 친구들과 함께 하늘을 관측하던 중 헤일-봅 혜성을 발견했다.","c":[{"o":["while observed","while observing"],"a":1,"why":"Bopp이 ‘관찰하는’ 쪽이라 접속사 while+현재분사","tag":"분사"}],"notes":[{"t":"동격 명사(구)","p":"고유명사(주어),+동격 명사구,+동사(discovered)","b":"주어 Thomas Bopp과 동사 discovered 사이에 Thomas Bopp을 부연 설명하는 명사구 a manager ~ astronomer가 이중 콤마로 삽입되었다."},{"t":"분사구문","p":"완전한 절+접속사(while)+현재분사(observing)~","b":"접속사 while(~하는 동안) 다음의 observing이 이끄는 분사구의 의미상 주어는 he이며, he가 ‘관찰하는’ 주체이므로, 타동사 observe(~을 관찰하다)의 준동사로 능동 관계를 나타내는 현재분사 observing이 쓰였다. 분사구문은 보통 접속사를 생략하지만, 본문은 시간 관계를 분명히 하기 위해 쓰인 접속사를 생략하지 않았다.","x":["전환 ~ a manager while he created[was creating] the sky ~"]}]},{"en":"To make the story even more shocking, he was using a borrowed telescope {0} his friend had assembled himself.","ko":"이 이야기를 더욱 충격적으로 만들자면, 그는 친구가 직접 조립한 망원경을 빌려서 사용하고 있었다.","c":[{"o":["that","what"],"a":0,"why":"선행사 telescope가 있고 assembled의 목적어가 빠진 절이에요. → 목적격 관계대명사 that","tag":"관계사·명사절"}],"notes":[{"t":"독립부정사","p":"독립부정사(To make the story even more shocking),+완전한 절","b":"‘이야기를 더욱 충격적으로 만들자면’의 뜻으로, 문장 앞에 쉼표로 연결된 부사(구)처럼 문장 전체를 수식하는 독립부정사 To make the story even more shocking이 관용 표현으로 쓰였다."},{"t":"5형식 동사 make & 비교급 강조 부사 & 현재분사 형태의 형용사","p":"To make+목적어(the story)+목적격보어(even more shocking)","b":"동사 make가 ‘~을 …하게 만들다’라는 뜻의 5형식 'make+O+O·C(형용사)'의 동사로 쓰였으며, 목적어 the story가 ‘충격을 주는’ 주체이므로 타동사 shock(~에 충격을 주다)에서 유래해 능동의 의미를 갖는 현재분사형 형용사 shocking의 비교급 more shocking이 ‘훨씬’의 뜻으로 비교급을 강조하는 부사 even의 꾸밈을 받으며 목적격보어에 쓰였다.","x":["참고 부사(구) much, very much, even, still, far, by far, a lot, lots, yet, infinitely, significantly와 함께, any, no, rather, a little, [격식체] a bit 등으로도 비교급을 꾸밀 수 있다. very는 비교급 앞에 안 쓴다."]},{"t":"과거진행","p":"be동사(was)+현재분사(using)","b":"be동사 was에 현재분사 using이 이어져 ’~을 사용하고 있었다'를 뜻하는 과거진행을 이룬다."},{"t":"과거분사","p":"부정관사(a)+과거분사(borrowed)+명사","b":"수식 대상인 명사 telescope가 ‘빌려진’ 대상이므로, 타동사 borrow(~을 빌리다)의 준동사로 수동 관계를 나타내는 과거분사 borrowed가 명사를 꾸민다."},{"t":"목적격 관계대명사","p":"명사구(선행사)+that+목적어 없는 불완전한 절","b":"타동사 had assembled의 목적어가 없는 불완전한 절 ‘his friend had assembled himself’가 선행사인 명사구 ‘a borrowed telescope’를 수식하고 있으며, 이때 which도 가능하며, 목적격 관계대명사 that은 생략할 수 있다.","x":["전환 ~ a borrowed telescope (which) his friend had assembled [목적어×] himself."]},{"t":"과거완료","p":"had+과거분사(assembled)","b":"과거완료조동사 had에 과거분사 assembled가 이어진 과거완료로, 주절의 과거진행시제(was using)보다 이전인 대과거로 사용하고 있었던 시점보다 이전에 조립되어 '(과거 당시에) ~을 조립한 상태였다'를 뜻한다."},{"t":"강조 용법의 재귀대명사","p":"강조 대상(his friend)+~+재귀대명사(herself)","b":"주어 his friend를 ‘그가 직접’이라는 의미로 강조하는 강조 용법의 재귀대명사 himself가 절 끝에 쓰였다. 강조 용법의 재귀대명사는 강조 어구 바로 뒤 또는 문장 끝에 위치할 수 있으며, 생략해도 문장의 기본 의미가 유지된다."}]},{"en":"And Bopp is not alone.","ko":"그리고 봅 혼자만 그런 것은 아니다."},{"en":"Numerous amateur astronomers have discovered comets, stars, and supernovas, which {0} us to better understand the solar system and the universe.","ko":"수많은 아마추어 천문학자가 혜성, 항성, 초신성을 발견했고, 이는 우리가 태양계와 우주를 더 잘 이해하는 데 도움을 주고 있다.","c":[{"o":["help","helps"],"a":1,"why":"which의 선행사가 앞 절 전체(단수 취급)라 helps","tag":"수일치"}],"notes":[{"t":"현재완료","p":"have+과거분사(discovered)","b":"현재완료조동사 have와 과거분사 discovered가 결합해 현재완료를 이루어 ‘(현재까지) ~을 발견해 왔다, (현재) ~을 발견한 상태다’를 의미한다."},{"t":"계속적 용법의 주격 관계대명사 & 수일치","p":"선행사(앞 절),+which+주어가 없는 불완전한 절","b":"콤마(,) 뒤에 이어진 which 이하는 앞 절 전체 ‘Numerous amateur ~ supernovas’를 부연 설명하는 관계사절이다. 계속적 용법의 주격 관계대명사 which가 주어가 없는 불완전한 절(helps us ~ universe)을 이끌고 있으며, 절은 단수 취급하므로 관계사절에 단수동사 helps를 써서 수일치 시켰다. 절 끝에 쓰여 ‘접속사+대명사’로 바꿔 설명할 수 있다. 전환 Numerous ~ supernovas, and it[this/that] helps us ~"},{"t":"준사역동사 help & 분리부정사","p":"helps+목적어(us)+목적격보어(분리부정사: to+부사(better)+동사원형(understand)~)","b":"동사 help가 ‘~가 …하는 것 데 도움을 주다’라는 뜻의 5형식 동사로 쓰였으며, 목적어 us에 이어지는 목적격보어 자리에 부사 better의 수식을 받는 to부정사구 to better understand가 쓰였다. 참고로, 목적격보어 자리에 to부정사 대신 동사원형을 쓸 수 있다."}]},{"en":"Amateurs in many {0} {1} important contributions through their hobbies, such as amateur programmers developing new technologies, amateur writers publishing their work in local magazines, amateur history researchers preserving historical sites...","ko":"다른 여러 분야의 아마추어들도 취미를 통해 중요한 공헌을 했는데, 바로 새로운 기술을 개발하는 아마추어 프로그래머, 지역 잡지에 작품을 발표하는 아마추어 작가, 역사적 유적지를 보존하는 아마추어 역사 연구자 등과 같은 이들이다.","c":[{"o":["others field","other fields"],"a":1,"why":"many other+복수명사","tag":"형용사·부사"},{"o":["has made","have made"],"a":1,"why":"주어 Amateurs가 복수라 have made","tag":"수일치"}],"notes":[{"t":"many other ~","p":"many other+복수명사","b":"‘많은 다른’의 뜻으로, 수량 한정사 many가 한정사 other의 앞에 와서 복수명사 fields를 꾸민다. many other 뒤에는 복수명사(구)가 온다."},{"t":"현재완료 & make a contribution","p":"have+과거분사(made)+목적어(important contributions)","b":"현재완료조동사 have와 과거분사 made가 결합해 현재완료를 이루고, make a contribution(기여를 하다)가 쓰여 복수명사구 important contributions가 이어져 ‘(현재까지) 중요한 기여를 해왔다'를 의미한다."},{"t":"명사를 수식하는 분사(구) & 병렬","p":"명사구1+현재분사(구),+명사구2+현재분사(구),+명사구3+현재분사(구)","b":"구전치사 such as의 목적어로 쓰인 3개의 명사구 ‘amateur programmers’, ‘amateur writers’, ‘amateur history researchers’가 각각 순서대로 '~을 개발하는, ~을 발표하는, ~을 보존하는' 주체이므로, 현재분사구 ‘developing new technologies’, ‘publishing their work in local magazines’, ‘preserving historical sites’에 의해 수식받고 있다. 명사(구)를 뒤에서 수식하는 분사구를 이루는 분사는 ‘주격 관계대명사+동사(단순/진행시제)’로 바꿔 설명할 수 있다.","x":["전환 ~ amateur programmers who/that develop[are developing] new technologies, amateur writers who/that publish[are publishing] their work in local magazines, amateur history researchers who/that preserve[are preserving] historical sites..."]}]},{"en":"The list goes on and on!","ko":"그 목록은 끝이 없다!"}],"write":[{"ko":"여러분은 취미를 추구하는 것이 자기만족 이상의 것을 성취할 수 있다는 사실을 알고 놀랄 수도 있다.","en":"You may be surprised to find that pursuing a hobby can accomplish more than self-satisfaction."},{"ko":"다시 말해, 그것은 때로 사회에 대한 예상치 못한 공헌으로 이어지기도 한다.","en":"That is, it sometimes leads to an unexpected contribution to society."},{"ko":"예를 들어, 건축 자재 공장의 관리자이자 아마추어 천문학자인 토마스 봅(Thomas Bopp)은 애리조나 사막에서 친구들과 함께 하늘을 관측하던 중 헤일-봅 혜성을 발견했다.","en":"For example, Thomas Bopp, a manager at a construction materials factory and an amateur astronomer, discovered the comet Hale-Bopp while observing the sky with his friends in the Arizona desert."},{"ko":"이 이야기를 더욱 충격적으로 만들자면, 그는 친구가 직접 조립한 망원경을 빌려서 사용하고 있었다.","en":"To make the story even more shocking, he was using a borrowed telescope that his friend had assembled himself."},{"ko":"그리고 봅 혼자만 그런 것은 아니다.","en":"And Bopp is not alone."},{"ko":"수많은 아마추어 천문학자가 혜성, 항성, 초신성을 발견했고, 이는 우리가 태양계와 우주를 더 잘 이해하는 데 도움을 주고 있다.","en":"Numerous amateur astronomers have discovered comets, stars, and supernovas, which helps us to better understand the solar system and the universe."},{"ko":"다른 여러 분야의 아마추어들도 취미를 통해 중요한 공헌을 했는데, 바로 새로운 기술을 개발하는 아마추어 프로그래머, 지역 잡지에 작품을 발표하는 아마추어 작가, 역사적 유적지를 보존하는 아마추어 역사 연구자 등과 같은 이들이다.","en":"Amateurs in many other fields have made important contributions through their hobbies, such as amateur programmers developing new technologies, amateur writers publishing their work in local magazines, amateur history researchers preserving historical sites..."},{"ko":"그 목록은 끝이 없다!","en":"The list goes on and on!"}]},{"id":"L1-8","title":"1과 본문 ❽","lines":[{"en":"There {0} many reasons {1} people pursue hobbies.","ko":"사람들이 취미를 추구하는 데는 여러 가지 이유가 있다.","c":[{"o":["is","are"],"a":1,"why":"there 구문은 뒤의 주어(many reasons, 복수)에 일치해요.","tag":"수일치"},{"o":["how","why"],"a":1,"why":"reasons를 선행사로 하는 관계부사 why","tag":"관계사·명사절"}],"notes":[{"t":"유도부사 구문","p":"유도부사(There)+복수동사(are)+복수명사구(many reasons)~","b":"유도부사 There가 절의 맨 앞에 오면서 복수명사에 many reasons에 수일치된 복수동사 are가 주어 앞에 쓰였다."},{"t":"관계부사 why","p":"명사구(many reasons)+관계부사(why)+완전한 절","b":"완전한 절(people pursue hobbies)을 이끌어 이유를 나타내는 선행사 many reasons를 수식하는 관계사절을 이루고 있다. 관계부사 why는 생략될 수 있고, 관계부사 대용의 that이나 for a ~ reason(~한 이유로)에서처럼 선행사에 어울리는 전치사가 쓰인 for which가 대신할 수도 있다.","x":["전환 ~ many reasons (that, for which) people pursue hobbies."]}]},{"en":"For many people, the challenge of learning a new skill or {0} a difficult goal {1} their primary motivation.","ko":"여러 사람에 있어서, 새로운 기술을 배우거나 어려운 목표를 달성하는 도전 과제가 그들의 주된 동기이다.","c":[{"o":["to achieve","achieving"],"a":1,"why":"전치사 of 뒤의 동명사 learning과 병렬이라 achieving","tag":"병렬·도치·어순"},{"o":["is","are"],"a":0,"why":"주어의 핵심어는 challenge(단수)라 is","tag":"수일치"}],"notes":[{"t":"동격의 of & 동명사 & 병렬연결","p":"명사(구)+of+동명사구1+or+동명사구2","b":"명사구 the challenge와 동격을 이루는 동명사구 learning ~ goal을 연결하는 동격의 of가 쓰였다. 두 개의 동명사구 learning a new skill과 achieving a difficult goal이 등위접속사 or를 사이에 두고 병렬로 연결되었다."},{"t":"동사의 수일치","p":"주어부 핵심어(challenge)+~+단수동사(is)","b":"주어부에서 보통 마지막에 해석되는 핵심 단어 challenge가 단수이므로 단수동사 is가 쓰였다. (×)the challenge of ~ are"}]},{"en":"Other people enjoy hobbies for the communities they can become a part {0} or the friendships they can make there.","ko":"다른 사람들은 일원이 될 수 있는 공동체나 그곳에서 맺을 수 있는 우정을 위해 취미를 즐기기도 한다.","c":[{"o":["to","of"],"a":1,"why":"a part of ~ ‘~의 일부’","tag":"접속사·전치사"}],"notes":[{"t":"other ~","p":"Other+복수명사","b":"‘다른’의 뜻으로, 형용사 Other가 복수명사 people을 꾸며 '다른 사람들'을 뜻한다. (×)other person"},{"t":"목적격 관계대명사의 생략 & 병렬연결","p":"명사구1(the communities)+전치사 of의 목적어 없는 불완전한 절+or+명사구2(the friendships)+동사 make의 목적어 없는 불완전한 절","b":"전치사 of의 목적어가 없는 불완전한 절이 명사구1(the communities)을 뒤에서 꾸미며, 절 앞에 목적격 관계대명사 that이나 which가 생략된 것으로 설명할 수 있다. 목적어가 없는 전치사 of는 관계사절 앞으로 이동하여 of which로 전환될 수 있다. 마찬가지로 동사 make의 목적어가 없는 불완전한 절이 명사구2(the friendships)를 뒤에서 꾸미며, 절 앞에 목적격 관계대명사 that이나 which가 생략된 것으로 설명할 수 있다. 전치사 for의 목적어인 두 명사구가 등위접속사 or에 의해 병렬연결을 이룬다.","x":["전환 ~ the communities that/which they can become a part of [목적어×] or the friendships that/which they can make [목적어×] there. =~ the communities of which they can become a part or the friendships ~"]}]},{"en":"Still {0} enjoy hobbies because they can lose track of time and {1} in the moment, similar to being in a meditative state.","ko":"그 밖에도 다른 사람들은 시간 가는 줄 모르고 그 순간에 몰입할 수 있기 때문에 취미를 즐기기도 하는데, 이는 명상 상태에 있는 것과 비슷하다.","c":[{"o":["other","others"],"a":1,"why":"others는 ‘다른 사람들’을 뜻하는 대명사라 명사 없이 주어가 될 수 있어요.","tag":"형용사·부사"},{"o":["being","be"],"a":1,"why":"can lose ~ and (can) be ~ : 조동사 can 뒤 동사원형 병렬","tag":"병렬·도치·어순"}],"notes":[{"t":"부사 still","p":"부사(Still)+부정대명사(others)","b":"'한층 더'를 뜻하는 부사 still이 부정대명사 others를 꾸미면, '또 다른 사람들[것들]'을 뜻한다. 본문에선 앞의 many people, other people에 이어 세 번째로 쓰였다."},{"t":"접속사 because","p":"부사절 접속사(because)+완전한 절","b":"‘~하기 때문에’의 뜻으로 이유 부사절을 이끌며, 뒤에 완전한 절 they ~ state가 이어졌다."},{"t":"병렬연결","p":"조동사(can)+동사원형1(lose)~+and+동사원형2(be)~","b":"조동사 can에 이어지는 동사원형 lose와 be가 각각 이끄는 두 동사구가 등위접속사 and를 사이에 두고 병렬로 연결되었다."},{"t":"형용사구 부연 설명 & similar to ~ & 동명사","p":"완전한 절,+형용사(similar)+전치사(to)+동명사(being) ~","b":"앞의 접속사 because에 이어진 완전한 절 they ~ moment에 쉼표로 연결되어 앞 절을 부연 설명하는 형용사구가 쓰였고, ’~와 비슷한‘을 뜻하는 형용사구 similar to의 to는 전치사이므로 목적어로 동명사 being이 이어졌다. 형용사구 앞에 '계속적 용법의 주격 관계대명사+be동사'의 생략으로 설명할 수 있다. (전환) ~ because they ~ moment, which is similar to being in a meditative state."}]},{"en":"Some people even end up {0} contributions to society through their hobbies, oftentimes unexpectedly.","ko":"어떤 사람들은 심지어 자신의 취미를 통해 때로는 예상치 못한 방식으로 결국 사회에 공헌하기도 한다.","c":[{"o":["to make","making"],"a":1,"why":"end up+동명사 ‘결국 ~하게 되다’","tag":"to부정사·동명사"}],"notes":[{"t":"end up+동명사","p":"end up+동명사(making)","b":"‘결국 ~하게 되다’라는 뜻으로 의도하지 않거나 뜻하지 않은 결과로 끝났음을 나타낼 때 쓰이며 end up 동명사(-ing)가 이어지므로 making이 쓰였다."},{"t":"부사구 부연 설명","p":"완전한 절,+부사구","b":"완전한 절에 쉼표로 연결되어 부연 설명하는 부사구로, 부사 oftentimes와 unexpectedly가 이어져 '종종 예상치 못한 방식으로 말이다'를 뜻한다."}]},{"en":"It is the physical, mental, or emotional experience, or even a combination of them, that makes a hobby {0} and fun.","ko":"취미를 보람 있고 재미있게 만드는 것은 바로 신체적, 정신적, 또는 정서적 경험, 혹은 심지어 이들의 조합이다.","c":[{"o":["rewardingly","rewarding"],"a":1,"why":"5형식 make+O+O·C(형용사)","tag":"문형"}],"notes":[{"t":"it-that 강조 용법 & 병렬연결의 부연 설명 & 동사의 수일치","p":"It is+강조된 단수주어(the physical, mental, or emotional experience),+병렬연결의 부연 설명(or even a combination of them),)+that+주어 없는 불완전한 절(단수동사 makes ~)","b":"it-that 강조 구문으로, It is에 주어인 단수명사구 the physical, mental, or emotional experience, even a combination of them,이 위치해 강조되고, 이어진 that 뒤에 단수동사 makes 앞의 주어가 없는 불완전한 절이 쓰여 ‘~을 만드는 것은 바로 신체적, 정신적, 또는 정서적 경험, 또는 심지어 그것들의 조합이다.’를 뜻한다. 병렬연결 구조의 ‘or even a combination of them’은 앞의 명사구 ‘the physical, mental, or emotional experience'를 부연 설명하기 위해 두 쉼표로 삽입되었다. 주어부에서 보통 마지막에 해석되는 핵심 단어 experience가 단수이고, 삽입된 부연 설명은 수일치에 고려되지 않으므로, 단수동사 makes가 쓰였다.","x":["전환 [강조 이전 문장] The physical, mental, or emotional experience, or even a combination of them, makes a hobby rewarding and fun."]},{"t":"5형식 동사 make & 병렬연결 & 현재분사 형태의 형용사","p":"동사(makes)+목적어(a hobby)+목적격보어(형용사1(rewarding)+and+형용사2(fun))","b":"5형식 ‘make+O+O·C(형용사)’(~를 …하게 만들다)가 사용되었고, 목적격보어로 두 개의 형용사 rewarding과 fun이 등위접속사 and로 병렬연결을 이룬다. 의미상 주어인 목적어 a hobby가 '보람을 주는' 주체이므로, 타동사 reward(~에게 보상을 주다)에서 유래해 능동 관계를 나타내는 현재분사 형태의 형용사 rewarding이 목적격보어로 쓰였다."}]},{"en":"Perhaps it should be {0} “pleisure.”","ko":"어쩌면 그것은 ‘즐거움을 주는 여가(pleisure, pleasure+leisure)’라고 불려야 할지도 모른다.","c":[{"o":["calling","called"],"a":1,"why":"it이 ‘불리는’ 대상이라 수동태 should be called","tag":"시제·태"}],"notes":[{"t":"5형식 동사의 수동태","p":"수동태(be+called)+명사(“pleisure”)","b":"주어인 대명사 it이 지칭하는 a hobby가 ‘불리는’ 대상이므로, ‘call+O+O·C(이름)’(~을 …라고 부르다)의 수동태 ‘be called+보어(이름)’가 쓰여, 보어로 이름인 “pleisure\"가 연결되었다."}]}],"write":[{"ko":"사람들이 취미를 추구하는 데는 여러 가지 이유가 있다.","en":"There are many reasons why people pursue hobbies."},{"ko":"여러 사람에 있어서, 새로운 기술을 배우거나 어려운 목표를 달성하는 도전 과제가 그들의 주된 동기이다.","en":"For many people, the challenge of learning a new skill or achieving a difficult goal is their primary motivation."},{"ko":"다른 사람들은 일원이 될 수 있는 공동체나 그곳에서 맺을 수 있는 우정을 위해 취미를 즐기기도 한다.","en":"Other people enjoy hobbies for the communities they can become a part of or the friendships they can make there."},{"ko":"그 밖에도 다른 사람들은 시간 가는 줄 모르고 그 순간에 몰입할 수 있기 때문에 취미를 즐기기도 하는데, 이는 명상 상태에 있는 것과 비슷하다.","en":"Still others enjoy hobbies because they can lose track of time and be in the moment, similar to being in a meditative state."},{"ko":"어떤 사람들은 심지어 자신의 취미를 통해 때로는 예상치 못한 방식으로 결국 사회에 공헌하기도 한다.","en":"Some people even end up making contributions to society through their hobbies, oftentimes unexpectedly."},{"ko":"취미를 보람 있고 재미있게 만드는 것은 바로 신체적, 정신적, 또는 정서적 경험, 혹은 심지어 이들의 조합이다.","en":"It is the physical, mental, or emotional experience, or even a combination of them, that makes a hobby rewarding and fun."},{"ko":"어쩌면 그것은 ‘즐거움을 주는 여가(pleisure, pleasure+leisure)’라고 불려야 할지도 모른다.","en":"Perhaps it should be called “pleisure.”"}]},{"id":"L1-a","title":"1과 본문 외 ❶","lines":[{"en":"Long-distance hiking trails are becoming popular {0} more and more people.","ko":"장거리 하이킹 코스는 점점 더 많은 사람들에게 인기를 끌고 있다.","c":[{"o":["to","with"],"a":1,"why":"popular with ~ ‘~에게 인기 있는’","tag":"접속사·전치사"}],"notes":[{"t":"복합형용사","p":"복합형용사(형용사-명사)+명사구","b":"형용사 long과 명사 distance가 붙임표(hyphen)로 연결되어 ‘장거리의’를 뜻하는 복합형용사 long-distance가 명사구 hiking trails를 앞에서 꾸민다."},{"t":"현재진행","p":"be동사(are)+현재분사(becoming)","b":"be동사 are에 현재분사 becoming이 현재진행형을 이루어 ’~하게 되고 있다‘를 뜻한다."},{"t":"become+보어","p":"becoming+주격보어(형용사)","b":"‘~하게 되다’를 뜻하는 2형식의 동사 become의 현재분사 becoming에 형용사 popular가 이어져 ‘인기 있게 되는’을 뜻한다."},{"t":"popular with/among ~","p":"형용사(popular)+전치사(with)+명사구","b":"‘~에게 인기 있는’을 뜻하는 표현으로, 형용사 popular에 전치사 with로 인칭명사(구)를 연결하며 전치사 among이 쓰이기도 한다.","x":["전환 ~ popular among more and more people."]},{"t":"비교급 and 비교급","p":"비교급(more)+and+비교급(more)+명사","b":"‘점점 더 ~한/하게’를 뜻하는 표현으로, 형용사 many의 비교급이 more and more로 쓰여 ‘점점 더 많은’을 뜻해 복수명사 people을 꾸민다."}]},{"en":"Let’s {0} the appeal of long-distance hiking through a famous trail, the PCT.","ko":"유명한 등산로인 PCT를 통해 장거리 하이킹의 매력을 탐구해 보자.","c":[{"o":["exploring","explore"],"a":1,"why":"Let’s+동사원형 (청유문)","tag":"문형"}],"notes":[{"t":"청유문","p":"Let’s+동사원형","b":"‘~하자’를 뜻하는 표현으로, Let's에 이어 동사원형 explore가 이어져 ‘~을 탐구하자’를 뜻한다. 참고 5형식 동사의 명령문인 ‘Let us+동사원형’은 ‘1. 우리 ~하자 [청유] 2. 우리가 ~하게 하라 [허가]’를 뜻하므로, 청유문 'Let's+동사원형'은 1번을 뜻하는 표현의 줄임말에 해당한다."},{"t":"동격 명사(구)","p":"명사구,+동격 명사구","b":"명사구 a famous trail(유명한 등산로)의 구체적인 내용에 해당하는 동격의 명사구 the PCT가 콤마(,)로 바로 이어졌다. What Is the PCT? PCT란 무엇인가?"}]},{"en":"The PCT, or Pacific Crest Trail, is a {0} long hiking trail that {1} vertically across the U.S.","ko":"PCT 또는 태평양 종단길은 미국을 남북으로 가로지르는 길이 4,265km의 긴 하이킹 코스이다.","c":[{"o":["4,265-kilometers","4,265-kilometer"],"a":1,"why":"‘숫자-단위명사’ 복합형용사의 단위명사는 단수형이에요.","tag":"형용사·부사"},{"o":["stretches","stretch"],"a":0,"why":"관계대명사 that의 선행사 trail(단수)에 일치해요.","tag":"수일치"}],"notes":[{"t":"병렬연결 부연 설명","p":"명사구,+or+동격 명사구,+~","b":"명사구 The PCT의 뒤에 두 쉼표로 삽입된 부연 설명으로, 등위접속사 or로 동격의 명사구 Pacific Crest Trail이 병렬연결을 이루고 있다."},{"t":"숫자-단수단위명사","p":"복합형용사(숫자 4,265-단수단위명사 kilometer)+명사구(long hiking trail)","b":"붙임표(hyphen)로 연결된 복합형용사가 ‘숫자-단수단위명사’ 형태로 명사(구)를 앞에서 꾸미며, 단위명사는 단수형을 쓴다. 부정관사 a에 이어, 숫자 4,265와 단수단위명사 kilometer가 붙임표로 연결된 복합형용사 4,265-kilometer가 ‘4,265km의’를 뜻하여 명사구 long hiking trail을 꾸민다. (×)a 4,265-kilometers long e.g. a four-mile round trip ‘4마일 왕복 여행’ / a four-foot-high tree ‘4피트 높이의 나무’"},{"t":"주격 관계대명사 that & 동사의 수일치","p":"명사구(선행사)+that+주어 없는 불완전한 절","b":"주어가 없는 불완전한 절(stretches vertically across the U.S.)을 이끌어 명사구 a 4,265-kilometer long hiking trail을 선행사로 수식하는 관계사절을 이루며, which로 바꿔 쓸 수 있다. 선행사 a 4,265-kilometer long hiking trail이 단수명사구이므로 단수동사 stretches로 수일치 시켰다. The PCT: A Life-Changing Experience ❶PCT(Pacific Crest Trail, 태평양 종단길): 인생을 바꾸는 경험"}]},{"en":"{0} so long, it crosses three states and seven national parks.","ko":"길이가 길다 보니, 그것은 세 개의 주와 일곱 개의 국립 공원을 통과한다.","c":[{"o":["Been","Being"],"a":1,"why":"이유를 나타내는 분사구문이에요. 형용사 보어(so long)가 이어지므로 현재분사 Being","tag":"to부정사·동명사"}],"notes":[{"t":"분사구문","p":"현재분사(Being)~,+완전한 절","b":"주절의 내용(it crosses ~ parks)을 보충하여 이유를 나타내는 분사구문으로, 형용사구 보어(so long)가 이어지므로 현재분사 Being이 쓰였으며, 의미상 주어는 it이 가리키는 the PCT이다. 이유를 나타내는 접속사 As 또는 Because를 써서 부사절로 바꿔 쓸 수 있다.","x":["전환 As[Because, Since] it is so long, it crosses ~"]}]},{"en":"Hikers can experience a varied range of landscapes, from hot desert regions to great mountain ranges.","ko":"등산객은 뜨거운 사막 지대부터 웅장한 산맥까지 다양한 풍경을 경험할 수 있다.","notes":[{"t":"a ~ range of … & 과거분사 형태의 형용사","p":"a+형용사(varied)+명사(range)+전치사(of)+명사","b":"수식받는 명사 range가 ‘다양화된’ 대상이므로, 타동사 vary(~에 변화를 주다)에서 유래해 수동 관계를 나타내는 과거분사 형태의 형용사 varied가 명사 range를 앞에서 꾸민다. 'a ~ range of …'(~한 범위의 …)에 형용사 varied가 쓰이고, 명사 landscapes가 이어져 '다양화된 범위의 경치들'을 뜻한다."}]},{"en":"It takes about five months {0} the average person to walk through the trail, which {1} as thru-hiking.","ko":"보통 사람이 이 코스를 완주하는 데 약 5개월이 걸리며, 이는 ‘스루 하이킹(thru-hiking)’이라고 알려져 있다.","c":[{"o":["for","of"],"a":0,"why":"it takes+시간+for 의미상 주어+to부정사","tag":"to부정사·동명사"},{"o":["is known","knows"],"a":0,"why":"‘~로 알려져 있다’는 수동태 is known as ~","tag":"시제·태"}],"notes":[{"t":"it takes+O+for+의미상 주어+to부정사(구)","p":"가주어(It)+takes+목적어(시간)+진주어(for+의미상 주어(the average person)+to부정사(to walk) ~)","b":"‘~가 …하는 데 -이 필요하다’를 뜻하는 표현으로, 가주어 It과 현재동사 takes에 이어 목적어로 시간 명사구 about five months가 오고, 진주어로는 전치사 for와 함께 의미상 주어 the average person이 앞에 온 명사적 용법의 to부정사구인 for the average person to walk through the trail이 쓰여 '보통 사람이 이 코스를 완주하는 데 약 5개월이 걸린다'를 뜻한다. 같은 의미의 ‘it takes+사람+시간+to부정사’로 바꿔 쓸 수 있다.","x":["전환 It takes the average person about five months to walk through the trail, ~"]}]},{"en":"“Thru-hikers” usually start in early spring and head north, {0} at their destination in early winter.","ko":"‘스루 하이커’는 보통 초봄에 출발해 북쪽으로 향하고, 초겨울에 목적지에 도착한다.","c":[{"o":["arriving","arrive"],"a":0,"why":"동시·연속 동작을 나타내는 분사구문이에요. (=and they arrive)","tag":"분사"}],"notes":[{"t":"병렬연결","p":"복수주어(“Thru-hikers”)+부사+복수동사1(start)~+and+복수동사2(head)~,","b":"복수주어 “Thru-hikers”에 이어지는 복수동사 start와 head가 각각 이끄는 두 동사구가 등위접속사 and를 사이에 두고 병렬연결을 이루고 있다."},{"t":"분사구문","p":"완전한 절,+현재분사(arriving)~","b":"콤마(,) 다음의 arriving이 이끄는 연속동작의 분사구의 의미상 주어는 “Thru-hikers”이며, “Thru-hikers”가 ‘도착하는’ 주체이므로, 자동사 arrive(도착하다)에서 능동 관계를 나타내는 현재분사 arriving이 쓰였다. ‘접속사+주어+동사~‘ 형태의 부사절로 변형할 수 있다.","x":["전환 ~ north, and they arrive at their ~"]}]},{"en":"It’s a hard journey with a low completion rate; just 14% of all hikers attempting a thru-hiking {0} in {1} the PCT.","ko":"그것은 완주율이 낮은 매우 힘든 여정이며, 스루 하이킹에 도전하는 전체 등산객 중 단 14%만이 PCT 완주에 성공한다.","c":[{"o":["succeeds","succeed"],"a":1,"why":"주어 just 14% of all hikers에서 hikers가 복수라 복수동사","tag":"수일치"},{"o":["to finish","finishing"],"a":1,"why":"succeed in+동명사","tag":"to부정사·동명사"}],"notes":[{"t":"현재분사(구)","p":"명사구(all hikers)+현재분사구(attempting ~)","b":"수식 대상인 명사구 all hikers가 ‘~을 시도하는’ 주체이므로, 타동사 attempt(~을 시도하다)의 준동사로 능동 관계를 나타내는 현재분사 attempting이 분사구를 이끌어 ‘~을 시도하는 (전체 등산객들)'을 의미한다. 명사(구)를 뒤에서 꾸미는 현재분사는 ‘주격 관계대명사+동사(단순시제/진행시제)’로 바꿀 수 있다.","x":["전환 ~; just 14% of all hikers who/that attempt a thru-hiking succeed in finishing the PCT."]},{"t":"동사의 수일치","p":"주어의 핵(all hikers)+복수동사(succeed)","b":"주어의 핵 all hikers가 복수명사구이므로 복수동사 succeed로 수일치 시켰다."},{"t":"구동사 succeed in ~ & 동명사","p":"자동사(succeed)+전치사(in)+동명사(finishing) ~","b":"‘~에 성공하다’를 뜻하는 ‘자동사+전치사’ 구조의 구동사가 현재시제 succeed in으로 쓰이고, 뒤에 동명사 finishing이 이끄는 동명사구가 목적어로 이어져 ‘~을 끝내는 것에 성공한다’를 의미한다. What Challenges Are There?어떤 어려움이 있는가?"}]},{"en":"In addition to the physical difficulties and mental isolation, {0} in nature for months itself can be a tremendous challenge.","ko":"신체적 어려움과 정신적 고립에 더해, 자연에서 몇 달을 생존하는 것 자체가 큰 도전이 될 수 있다.","c":[{"o":["Survive","surviving"],"a":1,"why":"동명사구가 주어 자리에 와요.","tag":"분사"}],"notes":[{"t":"동명사구 주어","p":"동명사(surviving)+수식어(in ~ months)+재귀대명사+조동사(can) ~","b":"수식어 ‘In addition ~ isolation’와 콤마(,)로 이어지는 절에서 동명사 surviving이 이끄는 주어 뒤에 동사구 can be가 이어졌다."},{"t":"강조 용법의 재귀대명사 & 대명사의 수일치","p":"단수주어(surviving ~ months)+단수재귀대명사(itself)","b":"단수를 나타내는 재귀대명사 itself가 동명사구로 이루어진 단수의 주어(surviving in nature for months)를 강조하여 '몇 달 동안 자연에서 생존하는 것 그 자체'를 뜻한다. 강조 용법의 재귀대명사는 생략해도 글의 흐름에 영향을 주지 않는다."}]},{"en":"Hikers cook their own meals, and sometimes they have to endure days without {0}.","ko":"등산객들은 직접 식사를 해 먹으며, 때로는 식사 없이 며칠을 버텨야 한다.","c":[{"o":["eat","eating"],"a":1,"why":"전치사 without 뒤에는 동명사","tag":"to부정사·동명사"}],"notes":[{"t":"without+-ing","p":"전치사(without)+동명사","b":"‘~하는 것 없이’를 뜻하며, 전치사 without의 목적어로 동명사 eating이 쓰여 ‘먹는 것 없이’를 뜻한다. 보통 eating은 명사 앞 형용사로 '식사의, 식사용의'를 뜻한다."}]},{"en":"Securing water {0} another crucial requirement because {1} the water sources are safe to drink.","ko":"물 확보도 또 다른 필수적인 요건인데, 왜냐하면 모든 수원이 마시기에 안전하지는 않기 때문이다.","c":[{"o":["are","is"],"a":1,"why":"동명사구 주어는 단수 취급해요.","tag":"수일치"},{"o":["not all","all not"],"a":0,"why":"부분부정은 not all 어순이에요.","tag":"병렬·도치·어순"}],"notes":[{"t":"동명사구 주어 & 동사의 수일치","p":"동명사(Securing)+목적어(water)+단수동사(is)","b":"문장의 맨 앞에 동명사구 주어 Securing water가 쓰였으며, 동명사(구) 주어는 단수 취급하므로 단수동사 is로 수일치 시켰다."},{"t":"another ~","p":"another+가산단수명사구(crucial requirement)","b":"‘또 다른 한 ~’의 뜻으로 형용사 another는 가산단수명사(구)를 꾸미므로, 가산단수명사구 crucial requirement가 이어졌다."},{"t":"접속사 because","p":"부사절 접속사(because)+완전한 절","b":"‘~하기 때문에’의 뜻으로 이유 부사절을 이끌며, 뒤에 완전한 절 not ~ drink가 이어졌다."},{"t":"부분부정 not all ~ & all+정관사 ~","p":"not all+정관사(the)+명사구","b":"부정의 부사 not에 전체를 나타내는 형용사 all이 이어져 ‘모든 ~가 …인 것은 아닌’을 뜻하는 부분부정이 쓰였다. all에 정관사 the로 시작하는 명사구가 이어질 수 있으며, 사이에 전치사 of의 생략된 것으로 볼 수 있다. =not all of the water"},{"t":"부사적 용법의 to부정사","p":"형용사(safe)+to부정사(구)","b":"‘물 마시기에 안전한’의 뜻으로 형용사 safe를 부사적 용법 중 '형용사 수식'의 to부정사구 to drink가 뒤에서 꾸민다."}]},{"en":"Hikers {0} to carry the latest PCT Water Report, a list of all water sources.","ko":"등산객들은 모든 수원 목록인 최신 ‘PCT 물 보고서’를 들고 다니는 것이 권장된다.","c":[{"o":["are advised","advise"],"a":0,"why":"advise+O+to V의 수동태 be advised to V ‘~하도록 권고받다’","tag":"시제·태"}],"notes":[{"t":"5형식의 수동태","p":"be동사(are)+과거분사(advised)+to부정사","b":"주어 Hikers가 ‘권장받는’ 대상이므로, ‘advise+목적어+목적격보어(to부정사)’(~가 …하기를 권장하다)의 수동태 ‘be advised+to부정사’가 쓰였고, 현재시제의 are advised에 to부정사 to carry 이하가 이어져 '~을 들고 다니도록 권장받는다'를 뜻한다."},{"t":"동격 명사(구)","p":"명사구,+동격 명사구","b":"명사구 the latest PCT Water Report(PCT 물 보고서)의 구체적인 내용에 해당하는 동격의 명사구 a list of all water sources가 콤마(,)로 바로 이어졌다."},{"t":"최상급 latest","p":"the+최상급(latest)+명사구","b":"형용사 late의 최상급으로 ‘가장 최근의, 가장 늦은’을 뜻하여, 연속되는 것 중 가장 최근의 것, 가장 늦은 것을 말하며 계속 이어짐을 나타낸다. late의 다른 최상급인 last는 더 이상 이어지지 않음을 나타낸다. 본문은 '가장 최근의, 최신의'의 뜻으로 쓰였다.","x":["참고 latest a. 1. 최신의, 가장 최근의 2. 가장 늦은, 마지막의 pron. 가장 최근[최신]의 것, 최신 정보, 최종 기한, 가장 늦은 시간","참고 late는 형용사(늦은)와 부사(늦게)로 쓰이며, 시간적 의미로는 late-later-latest로, 순서의 의미로는 late-latter-last로 쓰인다. ‘전자-후자’의 의미로 the former - the latter가 쓰인다."]}]},{"en":"When it comes to {0}, most hikers sleep in tents, and in some areas, they can use shelters to stay {1} from the harsh weather.","ko":"수면 문제에 있어서는, 등산객 대부분은 주로 텐트에서 잠을 자며, 일부 지역에서는 혹독한 날씨로부터 몸을 지킬 수 있는 쉼터를 이용할 수 있다.","c":[{"o":["sleeping","sleep"],"a":0,"why":"when it comes to ~의 to는 전치사라 동명사가 와요.","tag":"to부정사·동명사"},{"o":["safe","safely"],"a":0,"why":"stay+형용사 보어 ‘~한 상태로 있다’","tag":"문형"}],"notes":[{"t":"when it comes to ~ & 동명사","p":"구전치사(When it comes to)+동명사(sleeping)","b":"‘~에 관한 한’을 뜻하는 구전치사 역할의 관용 표현이 쓰여, 목적어로 동명사 sleeping이 이어졌다.","x":["참고 = as for ~, in terms of ~, concerning ~, regarding ~, in[with] regard to ~, as regards ~","전환 As for[In terms of, Concerning, Regarding, In[With] regard to, As regards] sleeping, ~"]},{"t":"부사적 용법의 to부정사","p":"완전한 절+to부정사구","b":"완전한 절 뒤에 바로 연결된 to부정사구를, ’~한 상태로 있기 위해’라는 뜻으로 부사적 용법 중 ‘목적’의 to부정사 to stay가 이끈다."},{"t":"stay+형용사","p":"동사(stay)+주격보어(형용사)","b":"stay가 ‘~한 상태로 있다’를 뜻하는 2형식 동사로 쓰여, 동사원형 stay에 형용사 safe가 주격보어로 이어져 ‘안전한 상태로 있다’를 의미한다."},{"t":"형용사+전치사 safe from ~","p":"형용사(safe)+전치사(from)+명사구","b":"‘~으로부터 안전한’의 뜻으로, 형용사 safe에 전치사 from으로 명사구 the harsh weather를 연결한다."}]},{"en":"If you are lucky, you may find “trail angels,” {0} provide transportation to close towns, meals, or other forms of assistance.","ko":"운이 좋으면, ‘트레일 엔젤(등산로 천사)’을 만날 수도 있는데, 이들은 근처 마을로의 이동, 식사, 그리고 다른 형태의 도움을 준다.","c":[{"o":["which","who"],"a":1,"why":"선행사가 사람이라 계속적 용법 who. 동사는 복수 provide","tag":"관계사·명사절"}],"notes":[{"t":"계속적 용법의 주격 관계대명사 & 동사의 수일치","p":"선행사(\"trail angels\"),+who+주어가 없는 불완전한 절","b":"콤마(,) 뒤에 이어진 who 이하는 콤마(,) 앞의 선행사 \"trail angels\"를 부연 설명하는 관계사절이다. 계속적 용법의 주격 관계대명사 who가 주어가 없는 불완전한 절(provide ~ assistance)을 이끌고 있으며, 선행사가 복수명사구이므로 관계사절에 복수동사 provide를 써서 수일치 시켰다. '접속사+대명사'로 바꿔 설명할 수 있다. 전환 ~ \"trail angels,\" and they provide ~"},{"t":"명사+전치사 transportation to ~","p":"명사(transportation)+전치사(to)+명사구","b":"‘~으로의 이동’을 뜻하는 표현으로, 전치사 to에 명사구 close towns가 이어져 '가까운 마을들로의 이동'을 뜻한다.","x":["참고 transportation n. (물류의) 수송, 운반, 운송업, (과거에 식민지로 죄수를 보내던) 유형(流刑), [미국식] 수송 체계, 교통 체계, 교통수단, 차량(=[영국식] transport), [미국식] (교통수단을 통한) 이동"]},{"t":"병렬연결","p":"동사(provide)+목적어(명사구1,+명사구2,+or+명사구3)","b":"타동사 provide의 목적어로 세 명사구 transportation to close towns(근처 마을들로의 이동), meals(식사들), other forms of assistance(도움의 다른 형태들)가 ‘A, B, or C’의 구조로 병렬연결을 이룬다."},{"t":"other ~","p":"other+복수명사","b":"‘다른 ~들’의 뜻으로, 형용사 other가 복수명사 forms를 꾸며 '다른 형태들'을 뜻한다. (×)other form Why Do They Bother? Hear from Finishers."}]}],"write":[{"ko":"장거리 하이킹 코스는 점점 더 많은 사람들에게 인기를 끌고 있다.","en":"Long-distance hiking trails are becoming popular with more and more people."},{"ko":"유명한 등산로인 PCT를 통해 장거리 하이킹의 매력을 탐구해 보자.","en":"Let’s explore the appeal of long-distance hiking through a famous trail, the PCT."},{"ko":"PCT 또는 태평양 종단길은 미국을 남북으로 가로지르는 길이 4,265km의 긴 하이킹 코스이다.","en":"The PCT, or Pacific Crest Trail, is a 4,265-kilometer long hiking trail that stretches vertically across the U.S."},{"ko":"길이가 길다 보니, 그것은 세 개의 주와 일곱 개의 국립 공원을 통과한다.","en":"Being so long, it crosses three states and seven national parks."},{"ko":"등산객은 뜨거운 사막 지대부터 웅장한 산맥까지 다양한 풍경을 경험할 수 있다.","en":"Hikers can experience a varied range of landscapes, from hot desert regions to great mountain ranges."},{"ko":"보통 사람이 이 코스를 완주하는 데 약 5개월이 걸리며, 이는 ‘스루 하이킹(thru-hiking)’이라고 알려져 있다.","en":"It takes about five months for the average person to walk through the trail, which is known as thru-hiking."},{"ko":"‘스루 하이커’는 보통 초봄에 출발해 북쪽으로 향하고, 초겨울에 목적지에 도착한다.","en":"“Thru-hikers” usually start in early spring and head north, arriving at their destination in early winter."},{"ko":"그것은 완주율이 낮은 매우 힘든 여정이며, 스루 하이킹에 도전하는 전체 등산객 중 단 14%만이 PCT 완주에 성공한다.","en":"It’s a hard journey with a low completion rate; just 14% of all hikers attempting a thru-hiking succeed in finishing the PCT."},{"ko":"신체적 어려움과 정신적 고립에 더해, 자연에서 몇 달을 생존하는 것 자체가 큰 도전이 될 수 있다.","en":"In addition to the physical difficulties and mental isolation, surviving in nature for months itself can be a tremendous challenge."},{"ko":"등산객들은 직접 식사를 해 먹으며, 때로는 식사 없이 며칠을 버텨야 한다.","en":"Hikers cook their own meals, and sometimes they have to endure days without eating."},{"ko":"물 확보도 또 다른 필수적인 요건인데, 왜냐하면 모든 수원이 마시기에 안전하지는 않기 때문이다.","en":"Securing water is another crucial requirement because not all the water sources are safe to drink."},{"ko":"등산객들은 모든 수원 목록인 최신 ‘PCT 물 보고서’를 들고 다니는 것이 권장된다.","en":"Hikers are advised to carry the latest PCT Water Report, a list of all water sources."},{"ko":"수면 문제에 있어서는, 등산객 대부분은 주로 텐트에서 잠을 자며, 일부 지역에서는 혹독한 날씨로부터 몸을 지킬 수 있는 쉼터를 이용할 수 있다.","en":"When it comes to sleeping, most hikers sleep in tents, and in some areas, they can use shelters to stay safe from the harsh weather."},{"ko":"운이 좋으면, ‘트레일 엔젤(등산로 천사)’을 만날 수도 있는데, 이들은 근처 마을로의 이동, 식사, 그리고 다른 형태의 도움을 준다.","en":"If you are lucky, you may find “trail angels,” who provide transportation to close towns, meals, or other forms of assistance."}]},{"id":"L1-b","title":"1과 본문 외 ❷","lines":[{"en":"While the PCT was {0}, it was also a gift.","ko":" ‘~인 반면에’ '힘들게 하는'(능동) the PCT⤶ allow+O+O·C(to부정사) ‘~가 …할 수 있게 하다' 간접의문문I am truly capable of. (의문대명사+주어+동사~) ‘~할 수 있는’3 • Traveling the PCT can be about the people you meet along the way. 주어(동명사구) that/who(m) 생략4 The trail has led to lasting friendships. 현재완료 has+p.p. lead to ~ ‘~(으)로 이어지다’ lasting '오래가는'(능동)5 • The PCT is a journey of a lifetime. 6 It is a chance to see the magnificent 형용사적 용법 ‘장엄한’landscapes of the American West.왜 그렇게까지 하는가? 완주자들의 이야기를 들어 보라.1 • PCT는 힘들었지만, 동시에 선물이기도 했습니다. 2 제가 진정으로 할 수 있는 일이 무엇인지 알게 해 주었어요.3 • PCT 여행은 길을 따라가며 만나는 사람들에 관한 것일 수 있습니다. 4 이 코스는 평생 갈 우정을 만들어 줬어요.5 • PCT는 일생일대의 여정입니다. 6미국 서부의 장엄한 풍경을 볼 수 있는 기회이죠. Why Do They Bother? Hear from Finishers.왜 그렇게까지 하는가? 완주자들의 이야기를 들어 보라.1 • While the PCT was demanding, it was also a gift. • PCT는 힘들었지만, 동시에 선물이기도 했습니다.","c":[{"o":["demanded","demanding"],"a":1,"why":"PCT가 ‘요구가 많은(힘든)’ 주체라 현재분사형 형용사","tag":"분사"}],"notes":[{"t":"접속사 while","p":"부사절 접속사(While)+완전한 절","b":"‘1. ~ 동안에 2. ~한 반면에[한편] 3. ~하지만[함에도]’에서, 2번 뜻으로 대조 부사절을 이끌어 완전한 절 the PCT was demanding이 이어졌다."},{"t":"현재분사 형태의 형용사","p":"be동사(was)+주격보어(형용사 demanding)","b":"주어 the PCT가 ‘요구가 많은, 고된, 힘든’ 주체이므로, 타동사 demand(~을 요구하다)에서 유래해 능동 관계를 나타내는 현재분사 형태의 형용사 demanding이 be동사 was의 주격보어로 쓰였다."}]},{"en":"It allowed me to see {0}.","ko":"제가 진정으로 할 수 있는 일이 무엇인지 알게 해 주었어요.","c":[{"o":["what I am truly capable of","what am I truly capable of"],"a":0,"why":"간접의문문은 의문사+주어+동사 어순이에요.","tag":"병렬·도치·어순"}],"notes":[{"t":"5형식 동사 allow & 병렬","p":"allowed+목적어(me)+목적격보어(to see) ~","b":"동사 allowed가 ‘~가 …하는 것을 가능하게 하다’라는 뜻의 5형식 구문인 ‘allow+목적어+목적격보어(to부정사)’로 쓰여, 동사 allowed 뒤에 대명사 me가 목적어로, to see 이하의 to부정사구가 목적격보어로 쓰였다."},{"t":"간접의문문","p":"to부정사(to see)+의문대명사(what)+주어(I)+동사(am)","b":"to부정사 to see의 목적어로 '의문사(구)+평서문' 어순의 간접의문문이 사용되었다. 본문에서 뒤에 오는 전치사 of의 목적어 역할로 의문대명사 what 뒤에 주어 I, 동사 am의 순서로 전치사 of의 목적어가 없는 불완전한 절이 이어진다. (×)what am I truly capable of. (×)what I am truly capable. (×)how I am I truly capable of. The PCT: A Life-Changing Experience ❷PCT(Pacific Crest Trail, 태평양 종단길): 인생을 바꾸는 경험"}]},{"en":"Traveling the PCT can be about the people you meet along the way.","ko":"• PCT 여행은 길을 따라가며 만나는 사람들에 관한
