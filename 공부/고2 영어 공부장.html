  screen({back:()=>go({name:'drill'}),title:'시험 중',sub:subEl,right:[submitBtn,moreBtn([['시험 그만두기 (기록 안 함)',()=>{const m=modal('시험 그만두기',[h('p',null,'지금까지 쓴 답을 버리고 시험을 끝낼까요?'),h('div',{class:'acts'},h('button',{class:'btn warn',onclick:()=>{m.remove();prog.exam=null;save();go({name:'drill'})}},'그만두기'),h('button',{class:'btn',onclick:()=>m.remove()},'계속 풀기'))])},'warn']])],body:[P.body],foot:P.foot});
  tick();stopTimer();EXAM_TIMER=setInterval(()=>{if(!document.body.contains(subEl)){stopTimer();return}tick()},1000);
}
function submitExam(){const ex=prog.exam;if(!ex||ex.done)return;stopTimer();save();
  ex.items.forEach(it=>{const {u,q}=qOf(it);if(!q)return;const k=it.u+'|'+it.n,r=ex.ans[k]||(ex.ans[k]={v:[]});gradeQ(q,r,qkind(q));if(r.ok!==true)r.ok=false;
    const pr=I('s|'+it.u+'|'+it.n);if(r.ok){pr.ok=true;pr.v=r.v;pr.w=false}else{markWrong(pr);pr.v=r.v;pr.ok=false;pr.rev=true}});
  ex.done=true;ex.end=Date.now();examHist(ex);save();render()}
function examHist(ex){const ok=ex.items.filter(it=>(ex.ans[it.u+'|'+it.n]||{}).ok).length;prog.exams=(prog.exams||[]).filter(x=>x.id!==ex.id);prog.exams.push({id:ex.id,at:ex.end||Date.now(),ok,tot:ex.items.length});prog.exams=prog.exams.slice(-30)}
function renderExamResult(){PAGER=null;stopTimer();
  const ex=prog.exam,res=ex.items.map(it=>({it,...qOf(it),r:ex.ans[it.u+'|'+it.n]||{}}));
  const ok=res.filter(x=>x.r.ok).length,tot=res.length,pct=tot?Math.round(ok/tot*100):0,wrong=res.filter(x=>!x.r.ok);
  const byU={},byT={};res.forEach(x=>{(byU[x.it.u]=byU[x.it.u]||[0,0]);byU[x.it.u][1]++;if(x.r.ok)byU[x.it.u][0]++;const t=x.q?x.q.type:'?';(byT[t]=byT[t]||[0,0]);byT[t][1]++;if(x.r.ok)byT[t][0]++});
  const bars=o=>h('div',{class:'hist'},Object.entries(o).map(([k,[a,b]])=>h('div',{class:'hrow'},h('span',null,k),h('b',null,a+' / '+b),h('span',{class:'pbar'+(a/b<.6?' low':'')},h('div',{style:'width:'+(a/b*100)+'%'})),h('span',null,Math.round(a/b*100)+'%'))));
  screen({back:()=>go({name:'drill'}),title:'시험 결과',sub:'걸린 시간 '+fmtTime((ex.end||Date.now())-ex.start),body:[
    h('div',{class:'score'},h('div',{class:'big'},ok+' / '+tot),h('div',{class:'pct'+(pct>=80?' good':pct<60?' bad':'')},pct+'점'),h('div',{class:'sub'},pct>=90?'완벽에 가까워요!':pct>=70?'좋아요. 틀린 것만 다시 보면 돼요.':'헷갈린 문제를 해설로 다시 보고 한 번 더 시험 봐요.')),
    h('div',{class:'hero'},
      wrong.length?h('button',{class:'qtile pri',onclick:()=>go({name:'examreview',only:true})},h('b',null,'틀린 문제 해설'),h('span',null,wrong.length+'문항 · 내 답과 정답 비교')):null,
      wrong.length?h('button',{class:'qtile',onclick:()=>startExam(wrong.map(x=>x.it))},h('b',null,'틀린 것만 다시 시험'),h('span',null,wrong.length+'문항')):null,
      h('button',{class:'qtile',onclick:()=>go({name:'examreview',only:false})},h('b',null,'전체 해설'),h('span',null,tot+'문항')),
      h('button',{class:'qtile',onclick:()=>startExam(drillItems())},h('b',null,'새 시험'),h('span',null,'같은 범위로 다시')),
      h('button',{class:'qtile',onclick:()=>go({name:'drill'})},h('b',null,'직전보강 메뉴'),h('span',null,'범위 바꾸기·공부하기'))),
    h('div',{class:'secthd'},h('b',null,'지문별')),bars(Object.fromEntries(Object.entries(byU).map(([k,v])=>[k+'번',v]))),
    h('div',{class:'secthd'},h('b',null,'유형별')),bars(byT),
    h('p',{class:'sub'},'틀린 문항은 오답노트(실전)에도 들어갔어요. 서술형은 표현이 달라도 맞을 수 있으니 해설에서 "내 답도 맞음"을 눌러 고칠 수 있어요.')]});
}
function renderExamReview(){stopTimer();
  const ex=prog.exam;if(!ex||!ex.done){go({name:'drill'});return}
  const items=ex.items.filter(it=>!V.only||!(ex.ans[it.u+'|'+it.n]||{}).ok);
  if(!items.length){screen({back:()=>go({name:'exam'}),title:'해설',body:[h('div',{class:'empty big'},'틀린 문제가 없어요!')]});return}
  const cards=items.map(it=>{const {u,q}=qOf(it);const k=it.u+'|'+it.n;return cardSheet(u,q,()=>{examHist(ex);save();if(PAGER&&PAGER.refresh)PAGER.refresh()},{mode:'review',state:()=>ex.ans[k]||(ex.ans[k]={v:[]}),save:()=>{const pr=I('s|'+k);const a=ex.ans[k];if(a.ok){pr.ok=true;pr.w=false}save()}})});
  const P=pager(cards,'rev|'+ex.id+(V.only?'w':'a'),{end:{label:'결과로',fn:()=>go({name:'exam'})},state:i=>(ex.ans[items[i].u+'|'+items[i].n]||{}).ok?'dok':'dno',label:i=>items[i].u+'번 · '});
  screen({back:()=>go({name:'exam'}),title:V.only?'틀린 문제 해설':'전체 해설',sub:'내 답 · 정답 · 왜 그런지',body:[P.body],foot:P.foot});
}
function drillTileSub(){const ex=prog.exam;if(ex&&!ex.done)return'시험 이어서 보기';const h=(prog.exams||[]).slice(-1)[0];return h?'최근 '+h.ok+'/'+h.tot+' · 정답 외우기 → 시험':'정답 외우기 → 시험 보기'}
/* ========== boot ========== */
(async function boot(){
  try{
    await Promise.all([loadIndex(),loadVocab(),loadGrammar()]);
    if(!INDEX.length){screen({title:'자료',body:[viewPacks()]});return}
    const want=LS.get('sp:pack');
    await openPack(INDEX.some(x=>x.id===want)?want:INDEX[0].id);
    let v=null;try{v=JSON.parse(LS.get('sp:view')||'null')}catch(e){}
    V=v&&v.pack===pack.id&&v.name!=='packs'?{name:v.name,u:v.u,step:v.step,t:v.t,g:v.g,only:v.only}:{name:'home'};
    render();
  }catch(e){showErr(e)}
  Sync.init();AI.init();
})();
</script>
