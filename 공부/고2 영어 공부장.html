.p.)","p":"needs+to be+과거분사(disposed)+전치사(of)","b":"선행사 the significant amount of trash가 ‘dispose of ~(~을 처리하다)’의 대상이므로, needs 뒤에 수동형 to부정사구인 to be disposed of가 쓰여 '처리될 필요가 있다'를 뜻한다."},{"t":"목적격 관계대명사의 생략","p":"선행사(명사구)+목적어가 없는 불완전한 절","b":"타동사 caused(~을 초래했다)의 목적어가 없는 불완전한 절 ‘those people caused’가 선행사인 명사구 ‘the effects’를 수식하고 있으며, those people 앞에 목적격 관계대명사 which 또는 that이 생략되었다.","x":["전환 ~, the effects which[that] those people caused [목적어×] ~"]},{"t":"과거분사구","p":"명사구+과거분사구","b":"수식 대상인 명사구 the emissions(배기가스)가 ‘~을 발생시키다’를 뜻하는 동사 generate의 대상이므로 수동을 나타내는 과거분사 generated가 쓰여 분사구를 이끌고 있다. 과거분사 generated 앞에 ‘주격 관계대명사+be동사’가 생략된 것으로 설명할 수 있다.","x":["전환 ~ the emissions which[that] were generated from ~"]},{"t":"수일치 & continue+to부정사/동명사","p":"주어(복수명사구1+and+복수명사구2)+복수동사(continue)","b":"두 개의 복수명사구가 ‘A and B’의 형태로 연결된 주어 ‘the effects ~ and the emissions ~ travel’이 복수이므로 복수동사로 수일치한 continue가 쓰였다. 이어서 to have 이하의 to부정사구가 이어져 ‘continue+to부정사/동명사(계속 ~하다)’를 이루고 있으며, to have 대신 동명사 having도 가능하다."}]}],"write":[{"ko":"모든 스포츠 대회는 개최 전, 진행 중, 그리고 종료 후에도 환경에 영향을 미친다.","en":"Every sporting event affects the environment before, during, and even after it."},{"ko":"예를 들어, 롱트랙 스피드 스케이팅 경기는 400m 타원형 트랙의 얼음이 3~5cm 두께로 얼어 있어야만 진행될 수 있다.","en":"For example, a long-track speed skating competition can only take place, provided that the ice of a 400-meter oval track is frozen until it is 3 to 5 cm thick."},{"ko":"경기가 진행되는 한, 트랙이 특수 냉각 시스템에 의해 언 상태로 유지되어야 하며, 최적의 빙질을 위해 경기장 내부의 온도, 습도, 공기 질 또한 유지되어야 한다.","en":"As long as the competition is on, the track needs to be kept frozen by specialized refrigeration systems while the temperature, humidity, and air quality inside the stadium also have to be maintained for optimal ice conditions."},{"ko":"또한, 모든 경기장 직원들, 선수들, 그리고 관중들은 경기장과 경기장, 다른 도시, 심지어 해외 사이를 오가야 한다.","en":"Additionally, all of the stadium employees, athletes, and spectators need to travel to and from the stadium, often from other cities or even from abroad."},{"ko":"실제로 2018 평창 동계 올림픽에서 발생한 배기가스의 25% 이상이 팬들의 이동과 숙박으로 발생한 것으로 추정된다.","en":"In fact, more than 25% of the emissions generated by the 2018 PyeongChang Winter Olympics are estimated to be caused by fan travel and accommodations."},{"ko":"대회 기간 동안, 관중들과 선수들은 먹고 마시며, 무엇을 소비했든 간에 그 플라스틱병과 포장지 때문에 쓰레기통이 넘쳐난다.","en":"During the event, spectators and athletes eat and drink, and the plastic bottles and wrappers of whatever they consumed leave trash cans overflowing."},{"ko":"대회가 종료된 후에도, 처리되어야 할 막대한 양의 쓰레기와 더불어, 그 사람들이 초래한 영향과 이동 중에 나온 배기가스는 대기 질에 지속적으로 부정적 영향을 미친다.","en":"After the event has ended, in addition to the significant amount of trash that needs to be disposed of, the effects those people caused and the emissions generated from their travel continue to have a lasting negative impact on air quality."}]},{"id":"L2-4","title":"2과 본문 ❹","lines":[{"en":"Alarm bells sounded when research suggested the possibility {0} nearly one in every four English soccer {1} could be partially or completely {2} in the near future {3} climate change and extreme weather events.","ko":"기후 변화와 극한 기상 현상으로 인해, 영국 축구 경기장의 거의 4분의 1 정도가 가까운 미래에 부분적으로 또는 완전히 침수될 가능성이 있다는 연구 결과가 제시되면서 위기감이 고조되었다.","c":[{"o":["that","which"],"a":0,"why":"possibility와 동격인 완전한 절을 이끄는 동격의 접속사 that","tag":"접속사·전치사"},{"o":["stadium","stadiums"],"a":1,"why":"every+숫자+복수명사 ‘4개 중 하나꼴로’","tag":"형용사·부사"},{"o":["flooded","flooding"],"a":0,"why":"경기장이 ‘침수되는’ 대상이라 조동사+be+p.p.","tag":"시제·태"},{"o":["due to","because"],"a":0,"why":"뒤에 명사구만 있으므로 구전치사 due to","tag":"접속사·전치사"}],"notes":[{"t":"부사절 접속사 when","p":"when+완전한 절","b":"when이 ‘~할 때, ~하자 (곧)’라는 뜻의 부사절 접속사로 쓰여 완전한 절(research suggested ~ events)을 이끌고 있다."},{"t":"동격 접속사 that","p":"추상명사구+동격 접속사 that+완전한 절","b":"추상명사구 the possibility의 구체적 내용에 해당하는 완전한 절(nearly one ~ events)이 동격 접속사 that으로 연결되어 있다."},{"t":"every+숫자+복수명사(구)","p":"one in+every+숫자+복수명사구","b":"one in 뒤에 ‘every+숫자+복수명사구’ 형태의 every four English soccer stadiums가 이어져 ‘4개의 영국 축구 경기장마다 하나’를 뜻한다.","x":["참고 every+단수명사 ‘모든 ~, 매 ~’ / every+숫자+복수명사 ‘매 ~, ~ 마다’ (빈도)"]},{"t":"조동사+be+p.p. & 병렬연결","p":"조동사(could)+be+부사1+or+부사2+과거분사(p.p.)","b":"동격절의 주어 nearly one in every four English soccer stadiums가 ‘침수되는’ 대상이므로, 조동사 could와 함께 동사원형 be와 ‘~을 침수시키다’를 뜻하는 타동사 flood의 과거분사 flooded가 쓰여 ‘조동사+be+p.p.’ 형태의 수동태를 이루고 있으며, be와 과거분사 사이에 두 개의 부사 partially와 completely가 등위접속사 or에 의해 병렬로 연결되어 과거분사 flooded를 수식한다."},{"t":"due to & 병렬연결","p":"due to+명사1+and+명사구2","b":"‘~로 인해’라는 뜻의 구전치사 due to가 쓰였으며, 뒤에 목적어로 복합명사 climate change와 명사구 extreme weather events가 등위접속사 and에 의해 병렬로 연결되었다."}]},{"en":"Some research even predicted {0} by 2050 almost half of the cities {1} once hosted the Winter Olympics would not be able to do so again for lack of snow and ice.","ko":"일부 연구에서는 2050년까지 한때 동계 올림픽을 개최했던 도시 중 거의 절반이 눈과 얼음 부족으로 인해 더 이상 올림픽을 열 수 없을 것으로 예측하기도 했다.","c":[{"o":["that","what"],"a":0,"why":"뒤에 완전한 절이 오므로 명사절 접속사 that","tag":"접속사·전치사"},{"o":["that","what"],"a":0,"why":"선행사 the cities와 주어 없는 절 → 주격 관계대명사 that","tag":"관계사·명사절"}],"notes":[{"t":"명사절 접속사 that","p":"타동사+명사절 접속사 that+완전한 절","b":"명사절 접속사 that이 완전한 절(by ~ ice)을 이끌어, 동사 predicted의 목적어인 명사절을 이루고 있으며, 목적어절에 쓰인 경우 생략할 수 있다."},{"t":"주격 관계대명사 that","p":"선행사(명사구)+that+주어가 없는 불완전한 절","b":"선행사인 명사구 the cities를 수식하는 관계사절을 주격 관계대명사 that이 이끌며, 뒤에 주어가 없는 불완전한 절(once hosted the Winter Olympics)이 이어졌다. 이때 that은 which로 바꿔 쓸 수 있다."},{"t":"do so","p":"일반동사+목적어+~+be able to+do so~","b":"be able to 뒤의 동사원형 자리에 동사구 host the Winter Olympics를 대신해 do so가 쓰였다.","x":["참고 일반동사를 포함한 ‘동사+목적어’ 또는 ‘동사+보어’의 반복을 피할 때 do so를 쓸 수 있으며, do it이나 do that도 가능하다."]}]},{"en":"Also, the US Open Tennis Championships organizers implemented an “extreme heat policy,” {0} mandatory short breaks for players to cool down during matches, after a few {1} their matches due to extreme heat.","ko":"또한, US 오픈 테니스 대회 조직위원회는 몇몇 선수들이 폭염으로 인해 경기를 포기한 후에 ‘폭염 규정’을 시행하여 경기 중 선수들이 몸을 식힐 수 있도록 의무적으로 짧은 휴식 시간을 갖게 했다.","c":[{"o":["having","had"],"a":0,"why":"앞 절의 주어가 ‘갖게 한’ 능동 관계의 분사구문","tag":"분사"},{"o":["quits","quit"],"a":1,"why":"a few(몇몇)는 복수 취급해요.","tag":"수일치"}],"notes":[{"t":"분사구문","p":"주절,+분사구문(현재분사 ~)","b":"완전한 절(the US ~ policy“)에 콤마(,)로 분사구문인 ‘having ~ matches’가 연결되었으며, 주절 주어와 동일한 분사구문의 의미상 주어 the US Open Tennis Championships organizers가 ‘가지는’ 주체이므로 능동 관계를 나타내는 현재분사 having이 쓰였고, 목적어로 명사구 mandatory short breaks가 이어졌다. 흐름상 적절한 접속사를 사용해 ‘접속사+주어+동사~’ 형태의 부사절로 바꾸어 쓸 수 있다.","x":["전환 ~ an “extreme heat policy,” and they had mandatory short breaks ~"]},{"b":"의미상 주어와 함께 쓰인 to부정사(구) ❮의미상 주어(for+목적격(명사))+to부정사구>현재분사구 ’having mandatory short breaks’ 뒤에 ‘for+목적격(명사)’ 형태인 for players를 의미상 주어로 하는 부사적 용법(목적)의 to부정사구 to cool down이 쓰였으며, ‘선수들이 몸을 식히도록’으로 해석할 수 있다."},{"t":"부사절 접속사 after & 수일치","p":"after+완전한 절(복수주어+복수동사~)","b":"after가 ‘~한 이후에’라는 뜻의 시간 부사절 접속사로 쓰여 뒤에 완전한 절(a few ~ heat)을 이끌고 있다. 또한 부사절의 주어로 ‘몇몇 선수들(=a few players)’을 가리켜 a few가 쓰였으며, 복수 취급하므로 복수동사로 수일치한 quit가 이어져 있다."},{"t":"구전치사 due to ~","p":"due to+명사구","b":"‘~로 인해’라는 뜻의 구전치사 due to가 쓰였으며, 목적어로 명사구 extreme heat가 이어졌다."}]},{"en":"As more sports {0} by climate change, concerns are growing.","ko":"기후 변화로 인해 더 많은 스포츠가 영향을 받으면서, 우려가 커지고 있다.","c":[{"o":["affect","are affected"],"a":1,"why":"스포츠가 영향을 ‘받는’ 대상이라 수동태","tag":"시제·태"}],"notes":[{"t":"부사절 접속사 as","p":"As+완전한 절","b":"As가 ‘~하면서, ~함에 따라’라는 뜻의 부사절 접속사로 쓰여 완전한 절(more sports ~ change)을 이끌고 있다."},{"t":"수동태","p":"be동사(are)+과거분사(p.p.)","b":"부사절의 주어 more sports가 ‘영향을 받는’ 대상이므로 ‘~에게 영향을 주다’를 뜻하는 타동사 affect의 수동태 are affected가 쓰였다."}]}],"write":[{"ko":"기후 변화와 극한 기상 현상으로 인해, 영국 축구 경기장의 거의 4분의 1 정도가 가까운 미래에 부분적으로 또는 완전히 침수될 가능성이 있다는 연구 결과가 제시되면서 위기감이 고조되었다.","en":"Alarm bells sounded when research suggested the possibility that nearly one in every four English soccer stadiums could be partially or completely flooded in the near future due to climate change and extreme weather events."},{"ko":"일부 연구에서는 2050년까지 한때 동계 올림픽을 개최했던 도시 중 거의 절반이 눈과 얼음 부족으로 인해 더 이상 올림픽을 열 수 없을 것으로 예측하기도 했다.","en":"Some research even predicted that by 2050 almost half of the cities that once hosted the Winter Olympics would not be able to do so again for lack of snow and ice."},{"ko":"또한, US 오픈 테니스 대회 조직위원회는 몇몇 선수들이 폭염으로 인해 경기를 포기한 후에 ‘폭염 규정’을 시행하여 경기 중 선수들이 몸을 식힐 수 있도록 의무적으로 짧은 휴식 시간을 갖게 했다.","en":"Also, the US Open Tennis Championships organizers implemented an “extreme heat policy,” having mandatory short breaks for players to cool down during matches, after a few quit their matches due to extreme heat."},{"ko":"기후 변화로 인해 더 많은 스포츠가 영향을 받으면서, 우려가 커지고 있다.","en":"As more sports are affected by climate change, concerns are growing."}]},{"id":"L2-5","title":"2과 본문 ❺","lines":[{"en":"There {0} light at the end of the tunnel, however.","ko":"그래도 터널의 끝에는 빛이 있다.","c":[{"o":["is","are"],"a":0,"why":"light(불가산명사, 단수)에 일치해요.","tag":"수일치"}],"notes":[{"t":"유도부사 도치 & 수일치","p":"유도부사(There)+단수형 be동사(is)+단수주어(light)~","b":"문두에 쓰인 유도부사 There 뒤에 주어와 be동사가 도치되어 ‘There+be동사+주어~’의 어순으로 쓰였으며 주어인 불가산명사 light(빛)가 단수이므로 단수동사로 수일치한 is가 주어 앞에 쓰였다."}]},{"en":"The sports community is optimistic {0} it can reduce its environmental impact by {1} two main steps: transitioning to more sustainable operations before, during, and after events and {2} awareness among the public about their impact.","ko":"스포츠 공동체는 두 가지 주요한 단계를 통해 환경에 가는 영향을 줄일 수 있다는 점에서 낙관적인 입장이다. 바로 경기 전, 중, 후에 더욱 지속 가능한 운영으로 전환하는 것과, 대중 사이에서 경기의 영향에 대한 인식을 높이는 것이다.","c":[{"o":["what","that"],"a":1,"why":"형용사+that절 : 완전한 절 앞의 접속사 that","tag":"접속사·전치사"},{"o":["taking","take"],"a":0,"why":"전치사 by 뒤에는 동명사가 와요.","tag":"분사"},{"o":["raise","raising"],"a":1,"why":"transitioning ~ and raising ~ : 동명사 병렬","tag":"병렬·도치·어순"}],"notes":[{"t":"형용사+that절","p":"형용사+that+완전한 절","b":"형용사 optimistic 뒤에 의미를 보충하는 ‘that+완전한 절’이 이어져 있다. 참고 certain, convinced, aware, conscious, optimistic 등과 같은 인식 형용사나 glad, excited, worried 등과 같은 감정 형용사는 뒤에 의미를 보충하는 that절을 수반할 수 있다."},{"t":"by+동명사(구)","p":"by+동명사구","b":"‘~함으로써’라는 뜻으로, 전치사 by 뒤에 동명사구(taking ~ steps)가 쓰였다."},{"t":"병렬연결","p":"동명사구1(동명사~+전치사1,+전치사2,+and+전치사3+명사)+and+동명사구2","b":"콜론(:) 뒤에 two main steps의 구체적 내용에 해당하는 두 개의 동명사구(transitioning ~ events, raising ~ impact)가 등위접속사 and에 의해 병렬로 연결되어 있다. 또한 첫 번째 동명사구 내에서 전치사 before, during, after가 ‘A, B, and C’의 형태로 병렬연결을 이루어 목적어인 명사 events를 공유하고 있다."}]},{"en":"Efforts to adopt more responsible approaches {0} been made by various organizations, and the International Olympic Committee (IOC) is leading the way by {1} a good example.","ko":"보다 책임감 있는 접근 방식을 채택하려는 노력이 다양한 조직들에 의해 실행되고 있으며, 국제올림픽위원회(IOC)도 모범을 보이며 선도적인 역할을 하고 있다.","c":[{"o":["has","have"],"a":1,"why":"주어 Efforts(복수)에 일치해요.","tag":"수일치"},{"o":["setting","set"],"a":0,"why":"전치사 by 뒤에는 동명사가 와요.","tag":"분사"}],"notes":[{"t":"형용사적 용법의 to부정사","p":"명사+to부정사구","b":"명사 Efforts를 수식하는 형용사적 용법의 to부정사구 ‘to adopt ~ approaches’가 이어져 있으며, ‘~을 채택하려는 (노력)’을 뜻한다."},{"t":"현재완료 수동태(have[has]+been+p.p.) & 수일치","p":"주어(복수명사구)+have+been+과거분사(made)","b":"과거부터 현재까지 지속적으로 이루어져 온 일에 해당하며, 핵심주어 Efforts가 ‘make an effort(노력을 하다)’ 표현에 쓰인 타동사 make의 대상이므로, 현재완료(have[has]+p.p.)와 수동태(be+p.p.)가 결합한 현재완료수동태(have[has]+been+p.p.)가 쓰여 복수명사 Efforts에 수일치한 복수조동사 have와 been 뒤에 과거분사 made가 이어졌다."},{"t":"by+동명사(구)","p":"by+동명사구","b":"전치사 by 뒤에 동명사구 setting a good example이 이어져 ‘모범을 보임으로써’를 뜻한다."}]},{"en":"The IOC set up the Sport and Environment Commission decades ago and declared the environment as essential to the Olympic Movement, in addition to sports and culture.","ko":"IOC는 수십 년 전 ‘스포츠환경위원회’를 구성했고, 스포츠 및 문화와 더불어, 환경이 ‘올림픽 운동’에 필수적임을 선언했다.","notes":[{"t":"병렬연결","p":"주어+과거동사1~+and+과거동사2~","b":"주어 The IOC 뒤에 과거동사 set과 declared가 이끄는 두 개의 동사구가 등위접속사 and를 사이에 두고 병렬로 연결되었다."},{"t":"구동사 set ~ up","p":"동사(set)+부사(up)+목적어(명사구)","b":"‘타동사+부사’ 구조의 구동사 ‘set ~ up’이 ‘~을 세우다[설립하다]’라는 뜻으로 쓰였으며, 뒤에 목적어인 명사구(the Sport ~ Commission)가 이어졌다.","x":["참고 구동사 ‘set ~ up’의 목적어는 동사와 부사 사이 또는 부사 뒤에 올 수 있지만 목적어가 대명사인 경우에는 반드시 동사와 부사 사이에 위치하며, 목적어가 긴 명사구일 때는 주로 부사 뒤에 쓰인다."]},{"t":"declare ~ as …","p":"declare+목적어+as+형용사","b":"‘~을 …라고 선언[공표]하다’라는 뜻으로 ‘declare ~ as …’를 쓸 수 있으며, as 뒤에는 명사(구)나 형용사(구)가 올 수 있다. 여기서는 과거형 declared와 목적어인 명사구 the environment 뒤에 as와 형용사 essential이 쓰였다."}]},{"en":"It has since encouraged host nations {0} more environmental approaches to {1} on the Olympics.","ko":"그 이래로 IOC는 개최국들이 올림픽을 개최하는 데 있어서 보다 환경친화적인 접근 방식을 채택하도록 독려해 왔다.","c":[{"o":["to adopt","adopt"],"a":0,"why":"encourage+O+to부정사 (5형식)","tag":"문형"},{"o":["putting","put"],"a":0,"why":"approaches to ~의 to는 전치사라 동명사가 와요.","tag":"분사"}],"notes":[{"t":"현재완료(have[has]+p.p.)","p":"주어+has+부사(since)+과거분사(p.p.)","b":"앞 문장에 언급된 ’IOC가 환경이 ’올림픽 운동‘에 필수적임을 선언했던’ 과거 시점을 기준으로 그 이래로 지속되어 온 일을 나타내기 위해, 부사 since(그 후로, 그때부터)와 함께 현재완료 표현인 has since encouraged가 쓰였다."},{"t":"5형식","p":"encouraged+목적어+목적격보어(to부정사구)","b":"동사 encouraged 뒤에 목적어인 명사구 host nations와 목적격보어인 to부정사구(to adopt ~ Olympics)가 이어져 ‘~가 …하도록 장려[독려]하다’라는 뜻의 5형식 구문인 ‘encourage+목적어+목적격보어(to부정사(구))’를 이루고 있다."},{"t":"전치사+동명사(구)","p":"approaches+전치사 to+동명사(putting) ~","b":"‘approach to ~(~에 대한 접근 방식들)’ 표현을 이루는 전치사 to 뒤에 목적어로 동명사구 putting on the Olympics가 이어졌다."}]}],"write":[{"ko":"그래도 터널의 끝에는 빛이 있다.","en":"There is light at the end of the tunnel, however."},{"ko":"스포츠 공동체는 두 가지 주요한 단계를 통해 환경에 가는 영향을 줄일 수 있다는 점에서 낙관적인 입장이다. 바로 경기 전, 중, 후에 더욱 지속 가능한 운영으로 전환하는 것과, 대중 사이에서 경기의 영향에 대한 인식을 높이는 것이다.","en":"The sports community is optimistic that it can reduce its environmental impact by taking two main steps: transitioning to more sustainable operations before, during, and after events and raising awareness among the public about their impact."},{"ko":"보다 책임감 있는 접근 방식을 채택하려는 노력이 다양한 조직들에 의해 실행되고 있으며, 국제올림픽위원회(IOC)도 모범을 보이며 선도적인 역할을 하고 있다.","en":"Efforts to adopt more responsible approaches have been made by various organizations, and the International Olympic Committee (IOC) is leading the way by setting a good example."},{"ko":"IOC는 수십 년 전 ‘스포츠환경위원회’를 구성했고, 스포츠 및 문화와 더불어, 환경이 ‘올림픽 운동’에 필수적임을 선언했다.","en":"The IOC set up the Sport and Environment Commission decades ago and declared the environment as essential to the Olympic Movement, in addition to sports and culture."},{"ko":"그 이래로 IOC는 개최국들이 올림픽을 개최하는 데 있어서 보다 환경친화적인 접근 방식을 채택하도록 독려해 왔다.","en":"It has since encouraged host nations to adopt more environmental approaches to putting on the Olympics."}]},{"id":"L2-6","title":"2과 본문 ❻","lines":[{"en":"As a result, the Olympic Village {0} for the 2000 Sydney Summer Olympics became the world’s largest {1} suburb and the 2002 Salt Lake City Winter Olympics adopted a new energy recycling system {2} used the curling hall’s air conditioning unit to heat the showers and bathrooms in the venue.","ko":"그 결과, 2000년 시드니 하계 올림픽을 위해 건설된 ‘올림픽 빌리지’는 세계 최대의 태양광 발전 교외 지역이 되었고, 2002년 솔트레이크시티 동계 올림픽에서는 컬링 경기장의 공기 조화 장치를 그곳의 샤워실과 화장실을 데우는 데 사용하는 새로운 에너지 재활용 시스템을 도입하였다.","c":[{"o":["building","built"],"a":1,"why":"Village가 ‘지어진’ 대상이라 과거분사구","tag":"분사"},{"o":["solar-powering","solar-powered"],"a":1,"why":"교외 지역이 태양광으로 ‘구동되는’ 수동 관계라 과거분사","tag":"분사"},{"o":["which","what"],"a":0,"why":"선행사 system이 있어 주격 관계대명사 which","tag":"관계사·명사절"}],"notes":[{"t":"과거분사구","p":"명사구+과거분사구(built~)","b":"수식 대상인 명사구 the Olympic Village가 ‘지어진’ 대상이므로, ‘~을 짓다’를 뜻하는 동사 build의 과거분사 built가 이끄는 분사구(built ~ Olympics)가 뒤에서 수식하고 있으며, built 앞에 ‘주격 관계대명사+be동사’가 생략된 것으로 볼 수 있다.","x":["전환 ~ the Olympic Village which[that] was built for ~"]},{"t":"복합형용사","p":"형용사+접미사(-powered)","b":"형용사 solar(태양열의)에 ‘~로 작동되는, ~을 동력으로 하는’이라는 뜻의 접미사 -powered가 결합한 형태의 복합형용사 solar-powered가 ‘태양열로 작동되는’이라는 의미로 뒤의 명사 suburb를 수식하고 있다."},{"t":"주격 관계대명사 which","p":"선행사(명사구)+which+주어가 없는 불완전한 절","b":"선행사인 명사구 a new energy recycling system을 수식하는 관계사절을 주격 관계대명사 which가 이끌며, 뒤에 주어가 없는 불완전한 절이 이어졌다. which는 that으로 바꿔 쓸 수 있다."},{"t":"부사적 용법의 to부정사","p":"동사구+to부정사","b":"앞의 동사구(used ~ unit)에 이어진 to heat 이하는 ‘목적’을 나타내는 부사적 용법의 to부정사구로, to heat는 ‘데우기 위해’를 뜻한다."}]},{"en":"Also, for the 2010 Vancouver Winter Olympics, the Olympic speed-skating venue {0} with salvaged timber.","ko":"또한, 2010년 밴쿠버 동계 올림픽에서는 올림픽 스피드 스케이팅 경기장이 회수된 목재를 사용하여 건설되었다.","c":[{"o":["built","was built"],"a":1,"why":"경기장이 ‘지어진’ 대상이라 수동태","tag":"시제·태"}],"notes":[{"t":"과거시제 수동태(was/were+p.p.)","p":"was+과거분사","b":"단수명사구인 주어 the Olympic "시제·태"},{"o":["which","that"],"a":0,"why":"앞 절 내용을 받는 계속적 용법이라 which","tag":"관계사·명사절"}],"notes":[{"t":"과거시제 수동태(was/were+p.p.)","p":"be동사(was)+과거분사","b":"단수명사인 주어 electricity가 과거 ‘생산된’ 대상이므로 단수동사(was)로 수일치한 과거시제 수동태 was generated가 쓰였다."},{"t":"계속적 용법의 주격 관계대명사 which","p":"완전한 절,+which+주어가 없는 불완전한 절","b":"완전한 절(electricity ~ fuel)에 which 이하의 관계사절이 콤마(,)로 연결되어 앞 절에 언급된 ‘(수소로 생산된) 전기’를 부연 설명하고 있으며, 계속적 용법의 주격 관계대명사 which가 주어가 없는 불완전한 절을 이끌고 있다. 계속적 용법이므로 that은 쓸 수 없으며, 흐름상 적절한 접속사를 사용해 '접속사+대명사'로 바꿀 수 있다.","x":["전환 ~, electricity ~ fuel, and it[=the electricity (generated with hydrogen)] supplied ~"]}]}],"write":[{"ko":"그 결과, 2000년 시드니 하계 올림픽을 위해 건설된 ‘올림픽 빌리지’는 세계 최대의 태양광 발전 교외 지역이 되었고, 2002년 솔트레이크시티 동계 올림픽에서는 컬링 경기장의 공기 조화 장치를 그곳의 샤워실과 화장실을 데우는 데 사용하는 새로운 에너지 재활용 시스템을 도입하였다.","en":"As a result, the Olympic Village built for the 2000 Sydney Summer Olympics became the world’s largest solar-powered suburb and the 2002 Salt Lake City Winter Olympics adopted a new energy recycling system which used the curling hall’s air conditioning unit to heat the showers and bathrooms in the venue."},{"ko":"또한, 2010년 밴쿠버 동계 올림픽에서는 올림픽 스피드 스케이팅 경기장이 회수된 목재를 사용하여 건설되었다.","en":"Also, for the 2010 Vancouver Winter Olympics, the Olympic speed-skating venue was built with salvaged timber."},{"ko":"2012년 런던 하계 올림픽의 ‘올림픽 파크’는 한때 오염되었던 산업 대지 위에 지어졌으며, 유럽 최대의 도시공원으로 탈바꿈되었다.","en":"The Olympic Park for the 2012 London Summer Olympics, which was built on industrial land that was once contaminated, was converted to the biggest urban park in Europe."},{"ko":"그러고 나서 2020년 도교 하계 올림픽에서는 화석 연료 대신 수소로 전기가 생산되었으며, 이는 ‘올림픽 빌리지’와 ‘패럴림픽 빌리지’ 내 다수의 주거 건물에 전력을 공급하였다.","en":"Then at the 2020 Tokyo Summer Olympics, electricity was generated with hydrogen instead of fossil fuel, which supplied power for many residential buildings in the Olympic Village and Paralympic Village."}]},{"id":"L2-7","title":"2과 본문 ❼","lines":[{"en":"{0} its popularity, sports is a powerful tool for universally {1} awareness about environmental responsibility.","ko":"그 인기 덕분에, 스포츠는 환경적 책임에 대한 인식을 보편적으로 높이기 위한 강력한 도구이다.","c":[{"o":["Thanks to","Thanks"],"a":0,"why":"구전치사 thanks to+명사구 ‘~ 덕분에’","tag":"접속사·전치사"},{"o":["raising","raise"],"a":0,"why":"전치사 for 뒤에는 동명사가 와요.","tag":"분사"}],"notes":[{"t":"구전치사 thanks to ~","p":"Thanks to+명사구","b":"‘~ 덕분에’라는 뜻의 구전치사 Thanks to가 쓰였으며, 목적어로 명사구 its popularity가 이어졌다.","x":["참고 구전치사 because of/thanks to/owing to/due to+명사(구)/동명사(구)접속사 because/since/as+완전한 절"]},{"t":"a tool for+(동)명사(구)","p":"a powerful tool for+동명사구(부사+동명사~)","b":"명사구 a powerful tool 뒤에 ‘a tool for+명사(구)/동명사(구)’의 전치사 for와 universally raising 이하의 동명사구가 쓰였다.","x":["참고 a tool for+명사(구)/동명사(구) ‘~을/~을 하기 위한 도구 / a tool+to부정사 ’~하는 도구‘"]}]},{"en":"Simply put, the sports industry influences billions of individuals that {0} involved in sports either as spectators, athletes, or organizers.","ko":"간단히 말해, 스포츠 산업은 관중, 선수 혹은 주최 측으로서 스포츠에 관여하는 수십억 명의 사람들에게 영향을 준다.","c":[{"o":["are","is"],"a":0,"why":"선행사 individuals(복수)에 일치해요.","tag":"수일치"}],"notes":[{"t":"주격 관계대명사 that & 수일치","p":"선행사(복수명사구)+that+주어가 없는 불완전한 절","b":"복수명사구인 선행사 billions of individuals(수십억 명의 사람들)를 수식하는 관계사절을 주격 관계대명사 that이 이끌며, 뒤에 주어가 없는 불완전한 절이 이어졌다. 선행사가 사람이므로 that 대신 who도 가능하다."},{"t":"~ be involved in … & 수일치","p":"be동사(are)+과거분사(involved)+in+명사","b":"선행사 billions of individuals가 ‘involve ~ in …(~을 …에 관여시키다)’의 타동사 involve의 대상이므로, 수동 표현인 ‘~ be involved in …(~가 …에 관여되다)’이 쓰였으며, 선행사가 복수명사구이므로 복수형 be동사 are로 수일치시켰다."},{"t":"either A, B, or C","p":"either+전치사(as)+명사1,+명사2,+or+명사3","b":"전치사 as(~로서)의 목적어인 세 개의 명사 spectators, athletes, organizers가 ‘either A, B, or C(A이거나, B이거나, C)’의 구조로 병렬연결을 이루고 있으며, 명사 athletes와 organizers 앞에 각각 전치사 as가 생략된 것으로도 볼 수 있다."}]},{"en":"Through sports, strategies to increase awareness and {0} the public about the importance of sustaining the environment {1} shown good results.","ko":"스포츠를 통해, 환경 보존의 중요성에 대한 인식을 높이고 대중을 교육하는 전략들이 좋은 성과를 보여 왔다.","c":[{"o":["educate","educating"],"a":0,"why":"to increase and (to) educate — to부정사 병렬","tag":"병렬·도치·어순"},{"o":["have","has"],"a":0,"why":"주어 strategies(복수)에 일치해요.","tag":"수일치"}],"notes":[{"t":"형용사적 용법의 to부정사 & 병렬연결","p":"명사(strategies)+to부정사구(to+동사원형1~+and+동사원형2~)","b":"‘to increase ~ environment’는 명사 strategies를 수식하는 형용사적 용법의 to부정사구이며, to부정사의 to에 두 개의 동사원형 increase와 educate가 등위접속사 and에 의해 병렬로 연결되어 있다."},{"t":"전치사+동명사(구)","p":"the importance of+동명사구","b":"‘the importance of ~(~의 중요성)’의 전치사 of 뒤에 목적어로 동명사구 ‘sustaining the environment’가 이어져 있다."},{"t":"현재완료 & 수일치","p":"복수조동사(have)+과거분사(p.p.)","b":"현재까지 ‘보여 왔다’라는 의미로 현재완료(have[has]+p.p.)가 쓰여, 핵심주어인 복수명사 strategies에 수일치한 복수조동사 have에 과거분사 shown이 이어졌다."}]},{"en":"Research {0} found that fans are receptive to ecological or environmental initiatives {1} at sporting events, and many {2} willing to change their lifestyle habits accordingly.","ko":"연구에 따르면 팬들은 스포츠 경기에서 진행되는 생태학적 또는 환경적 계획에 수용적이며, 많은 팬들은 그에 맞춰서 생활 습관을 바꿀 의향이 있다.","c":[{"o":["has","have"],"a":0,"why":"research는 불가산명사라 단수 취급해요.","tag":"수일치"},{"o":["organized","organizing"],"a":0,"why":"initiatives가 ‘조직되는’ 대상이라 과거분사구","tag":"분사"},{"o":["are","is"],"a":0,"why":"many(많은 사람들)는 복수 취급해요.","tag":"수일치"}],"notes":[{"t":"명사절 접속사 that","p":"명사절 접속사(that)+완전한 절","b":"has found의 목적어 자리에 명사절 접속사 that이 쓰여 완전한 절(fans are ~ accordingly)을 이끌고 있으며, 생략할 수 있다."},{"t":"과거분사구","p":"명사구+과거분사구","b":"수식 대상인 명사구 ecological or environmental initiatives가 타동사 organize(~을 조직하다)의 대상이므로 수동을 나타내는 과거분사 organized가 분사구를 이끌고 있으며, organized 앞에 ‘주격 관계대명사+be동사’가 생략된 것으로 볼 수 있다.","x":["전환 ~ ecological or environmental initiatives that/which are organized ~"]}]},{"en":"The social status of athletes can have a strong effect, too.","ko":"선수들의 사회적 지위 또한 큰 영향을 미칠 수 있다.","notes":[{"t":"부사적 용법의 to부정사","p":"완전한 절+to부정사구","b":"완전한 절(high-profile ~ ambassadors)에 이어진 to foster 이하는 ’~을 고취[육성]하기 위해’라는 ‘목적’을 나타내는 부사적 용법의 to부정사구이다.다른 분석 ’~을 고취하는[육성하는] 스포츠 (홍보) 대사들‘이라는 의미로 to foster 이하를 앞의 명사구 sports ambassadors를 수식하는 형용사적 용법의 to부정사구로 볼 수도 있다."},{"t":"주격 관계대명사 who & 수일치","p":"선행사(복수명사구)+who+주어가 없는 불완전한 절(복수동사~)","b":"선행사인 복수명사구 young people을 수식하는 관계사절을 주격 관계대명사 who가 이끌고 있으며, 뒤에 주어가 없는 불완전한 절(look up to them)이 이어졌다. 또한 선행사 young people이 복수명사구이므로 관계사절에 복수동사로 수일치한 look이 쓰였다."}]},{"en":"For example, high-profile athletes and coaches can be sports ambassadors {0} environmental consciousness among fans, especially young people who {1} up to them.","ko":"예를 들어, 주목받는 선수들과 코치들은 팬들, 특히 그들을 우러러보는 청소년들 사이에서 환경 의식을 고취하기 위해 스포츠 (홍보) 대사 역할을 할 수 있다.","c":[{"o":["to foster","fostering"],"a":0,"why":"목적을 나타내는 부사적 용법의 to부정사","tag":"to부정사·동명사"},{"o":["looks","look"],"a":1,"why":"선행사 young people(복수)에 일치해요.","tag":"수일치"}]},{"en":"The broad appeal of sports {0} a vehicle {1} many people at once.","ko":"스포츠의 폭넓은 매력은 많은 사람들에게 한 번에 다가갈 수단이 된다.","c":[{"o":["becomes","become"],"a":0,"why":"핵심 주어 appeal(단수)에 일치해요.","tag":"수일치"},{"o":["reaching","to reach"],"a":1,"why":"명사 vehicle을 꾸미는 형용사적 용법의 to부정사","tag":"to부정사·동명사"}],"notes":[{"t":"수일치","p":"주어(단수명사구)+단수동사","b":"주어(The broad appeal of sports)의 핵심 단어가 단수명사 appeal이므로 단수동사로 수일치한 becomes가 쓰였다."},{"t":"형용사적 용법의 to부정사 & 타동사 reach","p":"명사구+to부정사구(to reach+명사구)","b":"‘다가갈 (수단)’이라는 뜻으로 형용사적 용법의 to부정사 to reach가 이끄는 to부정사구가 명사구 a vehicle을 수식하고 있다. 또한 reach는 ‘~에 닿다[미치다]’라는 뜻의 타동사로 쓰여 뒤에 목적어인 명사구 many people이 이어졌다."}]}],"write":[{"ko":"그 인기 덕분에, 스포츠는 환경적 책임에 대한 인식을 보편적으로 높이기 위한 강력한 도구이다.","en":"Thanks to its popularity, sports is a powerful tool for universally raising awareness about environmental responsibility."},{"ko":"간단히 말해, 스포츠 산업은 관중, 선수 혹은 주최 측으로서 스포츠에 관여하는 수십억 명의 사람들에게 영향을 준다.","en":"Simply put, the sports industry influences billions of individuals that are involved in sports either as spectators, athletes, or organizers."},{"ko":"스포츠를 통해, 환경 보존의 중요성에 대한 인식을 높이고 대중을 교육하는 전략들이 좋은 성과를 보여 왔다.","en":"Through sports, strategies to increase awareness and educate the public about the importance of sustaining the environment have shown good results."},{"ko":"연구에 따르면 팬들은 스포츠 경기에서 진행되는 생태학적 또는 환경적 계획에 수용적이며, 많은 팬들은 그에 맞춰서 생활 습관을 바꿀 의향이 있다.","en":"Research has found that fans are receptive to ecological or environmental initiatives organized at sporting events, and many are willing to change their lifestyle habits accordingly."},{"ko":"선수들의 사회적 지위 또한 큰 영향을 미칠 수 있다.","en":"The social status of athletes can have a strong effect, too."},{"ko":"예를 들어, 주목받는 선수들과 코치들은 팬들, 특히 그들을 우러러보는 청소년들 사이에서 환경 의식을 고취하기 위해 스포츠 (홍보) 대사 역할을 할 수 있다.","en":"For example, high-profile athletes and coaches can be sports ambassadors to foster environmental consciousness among fans, especially young people who look up to them."},{"ko":"스포츠의 폭넓은 매력은 많은 사람들에게 한 번에 다가갈 수단이 된다.","en":"The broad appeal of sports becomes a vehicle to reach many people at once."}]},{"id":"L2-8","title":"2과 본문 ❽","lines":[{"en":"While sports provide us {0} such immense {1}, we ─ along with sporting event organizers ─ need to be aware of the adverse environmental effects {2} sports have at times.","ko":"스포츠는 우리에게 매우 엄청난 이점을 제공하는 반면, 스포츠 경기 주최 측과 우리는 스포츠가 때때로 미치는 부정적인 환경적 영향에도 주의를 기울여야 한다.","c":[{"o":["with","for"],"a":0,"why":"provide A with B ‘A에게 B를 제공하다’","tag":"접속사·전치사"},{"o":["benefit","benefits"],"a":1,"why":"such+형용사+복수명사","tag":"형용사·부사"},{"o":["what","that"],"a":1,"why":"선행사 effects가 있고 have의 목적어가 빠진 절 → 목적격 관계대명사 that","tag":"관계사·명사절"}],"notes":[{"t":"접속사 while","p":"While+완전한 절","b":"While이 ‘~이긴 하지만, ~한 반면에’라는 뜻의 대조를 나타내는 부사절 접속사로 쓰여 완전한 절(sports ~ benefits)을 이끌고 있다."},{"t":"provide ~ with …","p":"provide+대명사+with+명사구","b":"‘~에게 …을 제공하다’라는 뜻의 ‘provide ~ with …’가 쓰여 provide의 목적어로 대명사 us, 전치사 with의 목적어로 명사구 such immense benefits가 이어져 있으며, ‘provide … to ~’의 형태로 바꾸어 쓸 수 있다.","x":["전환 ~ sports provide such immense benefits to us, ~"]},{"t":"such+형용사+복수명사(구)","p":"such+형용사(immense)+복수명사(benefits)","b":"‘정말 ~인, 아주 ~인’이라는 뜻으로 쓰인 such 뒤에 형용사 immense와 복수명사 benefits가 쓰여 ‘아주 엄청난 이점들’을 뜻한다.","x":["참고 형용사 such는 ‘such+a(n)+(형용사+)가산단수명사(구)’ 또는 ‘such+(형용사+)복수명사(구)’의 어순으로 명사(구)를 꾸미지만, 부사인 so는 형용사/분사와 부사를 꾸민다. 또한 ‘형용사+명사’를 꾸밀 때는 보통 such를 쓰지만, ‘수량형용사(many, much, few, little …)+명사’를 꾸밀 때는 so가 쓰인다."]},{"t":"need+to부정사 & 수일치","p":"주어(복수대명사)+삽입어구+need(복수형)+to부정사구","b":"주어 we와 두 개의 대시(―)로 삽입되어 주어를 보충 설명하는 전치사구(along ~ organizers) 뒤에 ‘need+to부정사(구)(~할 필요가 있다)’가 이어졌으며, 주어가 복수대명사이므로 복수동사 need로 수일치 되었다."},{"t":"목적격 관계대명사 that","p":"선행사(명사구)+that+목적어가 없는 불완전한 절","b":"목적격 관계대명사 that이 타동사 have(~을 가지다)의 목적어가 없는 불완전한 절 ‘sports have at times’를 이끌어, 선행사인 명사구 the adverse environmental effects를 수식하는 관계사절을 이루고 있으며, which로 바꿀 수 있고 목적격 관계대명사이므로 생략할 수도 있다.","x":["전환 ~ the adverse environmental effects (which) sports have [목적어×] at times."]}]},{"en":"As long as we {0} all aware of the effects, we can take steps toward {1} ways to minimize or even completely eliminate them.","ko":"이러한 영향에 대해 우리가 인식하는 한, 우리는 그 영향을 최소화하거나 심지어 완전히 제거할 방법을 찾기 위해 조치를 취할 수 있을 것이다.","c":[{"o":["will be","are"],"a":1,"why":"조건 부사절에서는 미래 대신 현재시제를 써요.","tag":"시제·태"},{"o":["finding","find"],"a":0,"why":"toward는 전치사라 동명사가 와요.","tag":"to부정사·동명사"}],"notes":[{"t":"as[so] long as","p":"As long as+완전한 절","b":"As long as(~하기만 하다면, ~하는 한) 뒤에 완전한 절(we are ~ the effects)이 이어져 조건의 부사절을 이루고 있으며, ‘So long as ~’로 바꿀 수 있다."},{"t":"전치사+동명사(구)","p":"take steps toward+동명사구","b":"전치사 toward 뒤에 목적어로 finding 이하의 동명사구가 쓰였다. 참고로, ‘take a step toward+명사(구)/동명사(구)’는 ‘~을 향한 걸음[조치])’이라는 뜻으로 쓰인다."},{"t":"형용사적 용법의 to부정사 & 병렬연결","p":"명사(ways)+to부정사구(to+동사원형1+or+even completely+동사원형2+공유목적어(대명사)","b":"to minimize 이하는 명사 ways를 수식하는 형용사적 용법의 to부정사구이며, to부정사의 to에 동사원형 minimize와 eliminate가 등위접속사 or에 의해 병렬로 연결되어 대명사 them을 목적어로 공유한다. ‘ways+to부정사(구)’는 ‘~할[~하는] 방법들’로 해석된다."}]},{"en":"While Green Sports Day, on October 6th, is a global event that {0} environmentally friendly sports, maybe it’s time we {1} every day a day to encourage greater sustainability in sports.","ko":"10월 6일인 ‘그린 스포츠 데이’는 환경친화적 스포츠를 촉진하는 전 세계적인 행사이지만, 이제는 우리가 매일을 스포츠의 더 큰 지속 가능성을 장려하는 날로 삼아야 할 때인지도 모른다.","c":[{"o":["promote","promotes"],"a":1,"why":"선행사 event(단수)에 일치해요.","tag":"수일치"},{"o":["declare","declares"],"a":0,"why":"it is time+주어+(should+)동사원형 구문이에요.","tag":"시제·태"}],"notes":[{"t":"접속사 while","p":"While+완전한 절","b":"While이 ‘~이긴 하지만’이라는 뜻의 부사절 접속사로 쓰여 완전한 절(Green ~ sports)을 이끌고 있다."},{"t":"주격 관계대명사 that & 수일치","p":"선행사(단수명사구)+that+주어가 없는 불완전한 절(단수동사~)","b":"선행사인 명사구 a global event를 수식하는 관계사절에 주격 관계대명사 that이 쓰여 주어가 없는 불완전한 절을 이끌고 있으며, that 대신 which도 가능하다. 또한 선행사가 단수명사구이므로 관계사절에 단수명사로 수일치한 promotes가 쓰였다."},{"t":"it is time (that)+주어+(should+)동사원형","p":"it’s time (that)+주어+(should+)동사원형~","b":"‘~해야 할 때이다’라는 뜻으로 강한 권유나 제안, 또는 당위를 나타내기 위해 ‘it is time (that)+완전한 절(주어+(should+)동사원형~)’을 쓸 수 있다. 여기서는 it’s time 뒤에 접속사 that이 생략되고 완전한 절이 이어졌으며, that절의 동사 declare 앞에 조동사 should가 생략된 것으로 볼 수 있다.","x":["전환 ~ it’s time that we should declare every day ~"]},{"t":"형용사적 용법의 to부정사","p":"명사구(a day)+to부정사(구)","b":"명사구 a day를 수식하는 형용사적 용법의 to부정사구(to encourage ~ sports)가 이어져 있으며, to encourage는 ‘장려하는 (날)’으로 해석된다."}]}],"write":[{"ko":"스포츠는 우리에게 매우 엄청난 이점을 제공하는 반면, 스포츠 경기 주최 측과 우리는 스포츠가 때때로 미치는 부정적인 환경적 영향에도 주의를 기울여야 한다.","en":"While sports provide us with such immense benefits, we ─ along with sporting event organizers ─ need to be aware of the adverse environmental effects that sports have at times."},{"ko":"이러한 영향에 대해 우리가 인식하는 한, 우리는 그 영향을 최소화하거나 심지어 완전히 제거할 방법을 찾기 위해 조치를 취할 수 있을 것이다.","en":"As long as we are all aware of the effects, we can take steps toward finding ways to minimize or even completely eliminate them."},{"ko":"10월 6일인 ‘그린 스포츠 데이’는 환경친화적 스포츠를 촉진하는 전 세계적인 행사이지만, 이제는 우리가 매일을 스포츠의 더 큰 지속 가능성을 장려하는 날로 삼아야 할 때인지도 모른다.","en":"While Green Sports Day, on October 6th, is a global event that promotes environmentally friendly sports, maybe it’s time we declare every day a day to encourage greater sustainability in sports."}]},{"id":"L2-a","title":"2과 본문 외 ❶","lines":[{"en":"On April 20, 2010, an enormous explosion shook the Deepwater Horizon drilling platform in the Gulf of Mexico, {0} a significant oil leak into the sea.","ko":"2010년 4월 20일, 거대한 폭발이 멕시코만에 있는 딥워터 호라이즌 시추선을 흔들었고, 이는 바다로 대규모 기름 유출을 초래했다.","c":[{"o":["caused","causing"],"a":1,"why":"폭발이 유출을 ‘초래한’ 능동 관계의 분사구문","tag":"분사"}],"notes":[{"t":"과거시제","p":"과거 시간 부사구,+주어+과거동사~","b":"과거의 종료된 시점을 나타내는 부사구(On April 20, 2010)와 함께 과거시제(shook)가 쓰였다."},{"t":"분사구문","p":"완전한 절,+분사구문(현재분사~)","b":"앞의 완전한 절(an ~ Mexico)에 콤마(,)로 causing 이하의 분사구문이 연결되어 앞 절의 결과를 나타내며, 분사구문의 의미상 주어인 앞 절의 내용이 ‘초래하는’ 주체이므로 능동을 나타내는 현재분사 causing이 쓰였다. 전환 ~, and it caused a ~ the sea. Bioremediation A Sustainable Solution to Ocean Pollution ❶생물적 환경 복원: 해양 오염을 해결하는 지속 가능한 방법"}]},{"en":"Over a three-month period, approximately 134 million gallons of oil, comparable to more than 200 Olympic swimming pools, flowed into the sea before it {0}.","ko":"3개월 동안, 올림픽 수영장 200개 이상에 비견되는 약 1억 3,400만 갤런의 기름이, 마침내 멈추기 전까지 바다로 흘러들었다.","c":[{"o":["eventually halted","was eventually halted"],"a":1,"why":"유출이 ‘멈춰지는’ 대상이라 수동태","tag":"시제·태"}],"notes":[{"t":"단수수량명사","p":"부사+숫자+단수수량명사+복수명사","b":"부사 approximately와 숫자 134 뒤에 단수형 수량명사 million과 복수명사 gallons가 이어져 ‘약 1억 3,400만 갤런’을 뜻한다.","x":["참고 숫자 뒤에 오는 dozen, hundred, thousand, million, billion 등에는 -s를 붙이지 않고 전치사 of도 쓰지 않는다. 대략의 수를 나타낼 때는 dozen, hundred, thousand, million, billion에 -s를 붙이고 전치사 of로 가산복수명사(구)를 연결한다. e.g. a few million years 몇 백만 년 / millions of years 수백만 년"]},{"t":"삽입된 형용사구 & comparable to ~","p":"주어,+형용사구(comparable to ~),+동사","b":"주어 ‘approximately ~ oil’과 동사 flowed 사이에 ‘comparable to ~(~에 맞먹는)‘가 이끄는 형용사구가 두 개의 콤마(,)로 삽입되어 주어를 부연 설명한다."},{"t":"부사절 접속사 before & 과거시제 수동태(was/were+p.p.)","p":"before+완전한 절","b":"before가 ‘~하기 전에’라는 뜻의 시간 부사절 접속사로 쓰여 뒤에 완전한 절(it was ~ halted)을 이끌고 있다. 또한 부사절의 주어 it(=the oil leak)이 과거 ‘막아진’ 대상이므로, 타동사 의미로 쓰인 halt(~을 막다)의 과거시제 수동태 was halted가 쓰였다."}]},{"en":"{0} continuing restoration efforts, the sea has not yet fully {1}.","ko":"계속되는 복구 노력에도 불구하고, 바다는 아직 완전히 회복되지 않았다.","c":[{"o":["Although","Despite"],"a":1,"why":"뒤에 명사구가 오므로 전치사 Despite","tag":"접속사·전치사"},{"o":["recovered","recover"],"a":0,"why":"have[has] not yet+p.p. 현재완료 부정","tag":"시제·태"}],"notes":[{"t":"전치사+명사(구)","p":"전치사+명사구","b":"‘~에도 불구하고 ulting","resulted"],"a":0,"why":"능동의 분사구문 ‘결국 ~로 이어지며’","tag":"분사"}],"notes":[{"t":"주격 관계대명사 that & 수일치","p":"선행사(복수명사)+that+주어가 없는 불완전한 절(복수동사~)","b":"주격 관계대명사 that이 주어가 없는 불완전한 절(break ~ molecules)을 이끌어, 선행사 enzymes를 수식하는 관계사절을 이루고 있으며, which로 바꾸어 쓸 수 있다. 또한 선행사가 복수명사이므로 관계사절에 복수동사로 수일치한 break가 쓰였다."},{"t":"분사구문","p":"완전한 절,+부사(ultimately)+현재분사(leading)~","b":"완전한 절(the bacteria ~ molecules) 뒤에 콤마(,)로 앞 절의 결과를 나타내는 분사구문이 연결되었으며, ’result in ~(~을 초래하다)‘의 자동사 result가 현재분사 resulting으로 쓰이고 부사 ultimately가 앞에서 수식하고 있다. '접속사+주어+동사(단순시제)'로 바꿔 설명할 수 있다. 전환 ~ into smaller molecules, and it[this/that] ultimately results in ~"}]}],"write":[{"ko":"2010년 4월 20일, 거대한 폭발이 멕시코만에 있는 딥워터 호라이즌 시추선을 흔들었고, 이는 바다로 대규모 기름 유출을 초래했다.","en":"On April 20, 2010, an enormous explosion shook the Deepwater Horizon drilling platform in the Gulf of Mexico, causing a significant oil leak into the sea."},{"ko":"3개월 동안, 올림픽 수영장 200개 이상에 비견되는 약 1억 3,400만 갤런의 기름이, 마침내 멈추기 전까지 바다로 흘러들었다.","en":"Over a three-month period, approximately 134 million gallons of oil, comparable to more than 200 Olympic swimming pools, flowed into the sea before it was eventually halted."},{"ko":"계속되는 복구 노력에도 불구하고, 바다는 아직 완전히 회복되지 않았다.","en":"Despite continuing restoration efforts, the sea has not yet fully recovered."},{"ko":"기름 오염 문제를 해결하기 위한 방법 중 하나가 바로 생물적 환경 복원이며, 이는 박테리아를 활용한 복원 방식이다.","en":"One approach to addressing the issue of oil contamination is bioremediation, a restoration method that utilizes bacteria."},{"ko":"일부 유형의 박테리아는 해양 환경에 자연적으로 존재하며 기름의 여러 성분을 분해하는 능력을 지닌다.","en":"Some types of bacteria naturally exist in marine environments and possess the capability to break down various components of oil."},{"ko":"기름 유출이 발생하면, 이 박테리아는 기름에 끌려와 증식하기 시작한다.","en":"When an oil spill occurs, these bacteria are attracted to the oil and begin to multiply."},{"ko":"성장하면서, 박테리아는 기름을 이산화탄소와 물로 분해하는 효소를 방출한다.","en":"As they grow, they release enzymes that break down oil into carbon dioxide and water."},{"ko":"이 과정은 몇 주 또는 몇 달이 걸릴 수 있지만, 유해한 화학 물질을 수반하는 기존의 방식과 비교하여 기름 유출을 정화할 수 있는 더 지속 가능한 방법을 보여준다.","en":"Although this process may take several weeks or months, it represents a more sustainable method of cleaning up oil spills compared to conventional approaches involving harmful chemicals."},{"ko":"박테리아는 플라스틱 분해 과정에서도 역할을 할 수 있다.","en":"Bacteria can also play a role in the process of plastic decomposition."},{"ko":"플라스틱이 바다에 들어오면, 일부 박테리아는 그것에 끌리고 이는 그들의 생장과 번식으로 이어진다.","en":"When plastic enters the ocean, some bacteria are attracted to it, leading to their growth and reproduction."},{"ko":"기름 분해 과정과 유사하게, 이 박테리아는 플라스틱을 더 작은 분자들로 분해하는 효소를 방출하며, 이는 결국 이산화탄소와 물이 된다.","en":"Similar to the process of breaking down oil, the bacteria release enzymes that break down plastic into smaller molecules, ultimately resulting in carbon dioxide and water."}]},{"id":"L2-b","title":"2과 본문 외 ❷","lines":[{"en":"It’s {0} good news, however.","ko":"하지만, 좋은 소식만 있는 것은 아니다.","c":[{"o":["all not","not all"],"a":1,"why":"부분부정은 not all 어순이에요.","tag":"병렬·도치·어순"}],"notes":[{"t":"부분 부정","p":"not all+명사구(good news)","b":"부분 부정 ‘not all ~‘은 ’모두 ~한 것은 아니다‘라는 뜻으로, 뒤에 이어지는 명사구 good news와 함께 쓰여 ’좋은 소식만 있는 것은 아니다‘를 뜻한다."}]},{"en":"There {0} challenges associated with bioremediation.","ko":"생물적 환경 복원과 연관된 문제들이 있다.","c":[{"o":["are","is"],"a":0,"why":"there 구문은 뒤의 주어 challenges(복수)에 일치해요.","tag":"수일치"}],"notes":[{"t":"도치 & 수일치","p":"유도부사(There)+복수형 be동사(are)+주어(복수명사~)","b":"유도부사 There가 문두에 쓰여 ‘There+be동사+주어’의 어순으로 도치되었으며, 핵심주어가 복수명사 challenges이므로 복수동사로 수일치한 are가 주어 앞에 쓰였다."},{"t":"과거분사구","p":"명사구+과거분사구","b":"수식 대상인 명사 challenges가 ‘연관된’ 대상이므로, ‘associate ~ with …(~을 …와 관련시키다)’의 수동 표현인 ‘~ be associated with …(~가 …와 관련되다)’의 과거분사 associated와 전치사 with가 쓰여 과거분사구를 이끌고 있다. associated 앞에 ‘주격 관계대명사+be동사’가 생략된 것으로 설명할 수도 있다.","x":["전환 There are challenges which[that] are associated with bioremediation Bioremediation A Sustainable Solution to Ocean Pollution ❷생물적 환경 복원: 해양 오염을 해결하는 지속 가능한 방법"]}]},{"en":"The breakdown of oil or plastic by bacteria, as {0} earlier, can be a time-consuming process {1} weeks or months.","ko":"앞서 언급한 것처럼, 박테리아가 기름이나 플라스틱을 분해하는 것은 몇 주 또는 몇 달을 필요로 하는, 시간이 많이 소요되는 과정이 될 수 있다.","c":[{"o":["mentioning","mentioned"],"a":1,"why":"접속사 as 뒤 ‘it was’가 생략된 과거분사 (언급된)","tag":"분사"},{"o":["required","requiring"],"a":1,"why":"process가 weeks를 ‘필요로 하는’ 능동 관계라 현재분사구","tag":"분사"}],"notes":[{"t":"접속사+과거분사","p":"접속사(as)+과거분사(mentioned)~","b":"as(~한 것처럼) 뒤에 과거분사 mentioned와 부사 earlier가 이어져 ‘앞서 언급된 것처럼’을 뜻하며, 접속사와 과거분사 사이에 ‘주어+be동사’인 it was가 생략된 구조로 볼 수 있다."},{"t":"현재분사구","p":"명사구+현재분사구","b":"수식 대상인 명사구 a time-consuming process가 ‘필요로 하는’ 주체이므로 능동의 의미를 갖는 현재분사 requiring이 쓰여 분사구를 이끌고 있으며, ‘주격 관계대명사+동사~’로 바꾸어 쓸 수 있다.","x":["전환 ~ a time-consuming process which[that] requires weeks or months."]}]},{"en":"These bacteria can also be sensitive to specific environmental conditions such as temperature and sea water constituents.","ko":"이러한 박테리아는 또한 온도나 해수의 구성 요소와 같은 특정한 환경 조건에 민감할 수 있다.","notes":[{"t":"such as ~ & 병렬연결","p":"명사구+such as+명사1+and+명사구2","b":"such as(~와 같은) 뒤에 specific environmental conditions의 구체적 예시에 해당하는 명사(구) temperature와 sea water constituents가 등위접속사 and로 병렬연결을 이루고 있다."}]},{"en":"Despite these challenges, there is no doubt {0} bioremediation holds promise as a technology for oil spill or plastic cleanup in the ocean.","ko":"이러한 어려움에도 불구하고, 생물적 환경 복원이 해양에서 기름 유출이나 플라스틱 오염 정화 기술로서 가능성이 크다는 것은 의심할 여지가 없다.","c":[{"o":["that","what"],"a":0,"why":"there is no doubt (that)+완전한 절","tag":"접속사·전치사"}],"notes":[{"t":"there is no doubt (that) ~","p":"유도부사(there)+단수형 be동사(is)+no+단수주어(doubt)+that+완전한 절","b":"유도부사 there가 문두에 쓰여 ‘there+be동사+주어’의 어순으로 도치된 형태로, 단수형인 주어 doubt에 수일치한 단수형 be동사 is 뒤에 부정어 no와 주어 doubt가 쓰인 뒤, 접속사 that 뒤에 완전한 절(bioremediation ~ ocean)이 이어져 있다. ‘there is no doubt that+완전한 절’은 ‘~라는 것에 대한 의심의 여지가 없다’를 뜻하며, that은 생략할 수 있다."}]},{"en":"{0} the bacteria used in this process occur naturally, they do not need to {1} to the {2} site.","ko":"이 과정에서 사용되는 박테리아는 자연적으로 발생하기 때문에, 그것은 오염된 지역으로 별도로 운반될 필요가 없다.","c":[{"o":["Because","Because of"],"a":0,"why":"뒤에 절이 오므로 접속사 Because","tag":"접속사·전치사"},{"o":["transport","be transported"],"a":1,"why":"박테리아가 ‘운반되는’ 대상이라 need+수동형 to be p.p.","tag":"시제·태"},{"o":["polluting","polluted"],"a":1,"why":"지역이 ‘오염된’ 수동 관계라 과거분사형 형용사","tag":"분사"}],"notes":[{"t":"과거분사구","p":"명사구+과거분사(used)+전치사구","b":"수식 대상인 명사구 the bacteria가 ‘사용되는’ 대상이므로, 타동사 use(~을 사용하다)의 과거분사 used가 쓰여 과거분사구를 이끌며, 앞에 ‘주격 관계대명사+be동사’가 생략된 것으로 볼 수 있다.","x":["전환 ~ the bacteria which[that] are used in this process ~"]},{"t":"do not need+수동형 to부정사(to+be+p.p.)","p":"do not need+to be+과거분사(p.p.)","b":"’~할 필요가 있다’를 뜻하는 ‘need+to부정사’의 부정형 ‘do not need+to부정사(~할 필요가 없다)’에서 주어 they(=the bacteria)가 ‘운반되는’ 대상이므로 수동형 to부정사인 to be transported가 쓰여 '운반될 필요가 없다'를 뜻한다."},{"t":"과거분사 형태의 형용사","p":"정관사(the)+과거분사 형태의 형용사+명사","b":"수식받는 명사 site가 ‘오염되는’ 대상이므로, 타동사 pollute(~을 오염시키다)에서 유래해 수동 관계를 나타내는 과거분사 형태의 형용사 polluted가 정관사 the와 명사 site 사이에 쓰여 뒤의 명사를 꾸민다."}]},{"en":"Bioremediation may be a more effective way {0} contamination problems and reduce environmental harm.","ko":"생물적 환경 복원은 오염 문제를 직면하고 환경 피해를 줄이는 더 효과적인 방법이 될 수도 있다.","c":[{"o":["confronting","to confront"],"a":1,"why":"명사 way를 꾸미는 형용사적 용법의 to부정사","tag":"to부정사·동명사"}],"notes":[{"t":"형용사적 용법의 to부정사 & 병렬연결","p":"명사구+to부정사(구)","b":"to confront 이하는 명사구 a more effective way를 수식하는 형용사적 용법의 to부정사구이며, to부정사의 to에 두 개의 동사원형 confront와 reduce가 등위접속사 and에 의해 병렬로 연결되어 있다. Think Together A. What is the purpose of the text? a. to explain how bioremediation works b. to illustrate the danger of oil spills in the ocean c. to introduce a new method to recycle plastic materials a B. In what other areas do you think bioremediation can be applied to?[sample] I think it could be used to get rid of polluted materials from soil and air, too. Work with an AI Assistant◎ Ask an AI assistant about bioremediation.[Prompt] examples of bioremediation currently being applied in the Pacific Ocean◎ Compare the AI answer with regular search results.◎ Discuss the similarities or differences with your partner. You may check primary sources for further information. Self-Check• I understand how bioremediation works. ☆☆☆• I learned about recent developments in bioremediation through an AI assistant. ☆☆☆"}]}],"write":[{"ko":"하지만, 좋은 소식만 있는 것은 아니다.","en":"It’s not all good news, however."},{"ko":"생물적 환경 복원과 연관된 문제들이 있다.","en":"There are challenges associated with bioremediation."},{"ko":"앞서 언급한 것처럼, 박테리아가 기름이나 플라스틱을 분해하는 것은 몇 주 또는 몇 달을 필요로 하는, 시간이 많이 소요되는 과정이 될 수 있다.","en":"The breakdown of oil or plastic by bacteria, as mentioned earlier, can be a time-consuming process requiring weeks or months."},{"ko":"이러한 박테리아는 또한 온도나 해수의 구성 요소와 같은 특정한 환경 조건에 민감할 수 있다.","en":"These bacteria can also be sensitive to specific environmental conditions such as temperature and sea water constituents."},{"ko":"이러한 어려움에도 불구하고, 생물적 환경 복원이 해양에서 기름 유출이나 플라스틱 오염 정화 기술로서 가능성이 크다는 것은 의심할 여지가 없다.","en":"Despite these challenges, there is no doubt that bioremediation holds promise as a technology for oil spill or plastic cleanup in the ocean."},{"ko":"이 과정에서 사용되는 박테리아는 자연적으로 발생하기 때문에, 그것은 오염된 지역으로 별도로 운반될 필요가 없다.","en":"Because the bacteria used in this process occur naturally, they do not need to be transported to the polluted site."},{"ko":"생물적 환경 복원은 오염 문제를 직면하고 환경 피해를 줄이는 더 효과적인 방법이 될 수도 있다.","en":"Bioremediation may be a more effective way to confront contamination problems and reduce environmental harm."}]}]}]}</script>

<script type="application/json" id="embedded-grammar">{"schema":"study-grammar@1","lessons":[{"id":"base","title":"문장의 뼈대","sub":"주어·동사·목적어·보어 — 모든 어법 문제의 출발점","blocks":[{"h":"왜 뼈대부터?","t":"어법 문제는 대부분 \"이 자리에 무엇이 와야 하나?\"를 묻습니다. 그러려면 문장에서 진짜 주어와 진짜 동사를 먼저 찾을 수 있어야 해요. 수식어(전치사구, 관계사절, 분사구)는 괄호로 묶어 지우고 보면 뼈대가 보여요.","ex":[{"en":"The excitement (that arises in this process) **creates** satisfaction.","ko":"이 과정에서 생기는 흥분은 만족감을 만들어 낸다.","n":"괄호 부분을 지우면 The excitement creates satisfaction. 주어 excitement, 동사 creates"},{"en":"The rest (of the band) **were** sitting with long faces.","ko":"밴드의 나머지 부원들은 시무룩한 얼굴로 앉아 있었다.","n":"(of the band)를 지우면 The rest were sitting."}]},{"h":"문장의 4가지 재료","t":"주어(S): ~은/는 · 동사(V): ~하다/이다 · 목적어(O): ~을/를 · 보어(C): 주어나 목적어를 설명하는 말(형용사·명사).\n한 문장(절)에는 동사가 딱 하나! 동사를 하나 더 쓰고 싶으면 접속사·관계사로 연결하거나, -ing / p.p. / to부정사로 모양을 바꿔야 해요.","ex":[{"en":"My chest **felt** heavy.","ko":"내 가슴이 무겁게 느껴졌다.","n":"felt(동사) + heavy(보어: 형용사)"},{"en":"I ran into the music room, **breathing** heavily.","ko":"나는 숨을 가쁘게 쉬며 음악실로 뛰어 들어갔다.","n":"동사는 ran 하나. 두 번째 동작은 breathing(분사)으로 바뀜"}]}],"steps":["문장에서 동사(시제가 있는 것)를 찾는다.","그 동사의 주어를 찾는다. 사이에 낀 수식어는 괄호로 지운다.","남는 자리(목적어/보어/수식어)에 무엇이 들어가야 하는지 판단한다."],"quiz":[{"s":"The excitement that **arises** in this process creates satisfaction and pleasure.","q":"이 문장의 진짜 동사(주절의 동사)는?","o":["arises","creates","process"],"a":1,"why":"arises는 관계사절(that arises in this process) 안의 동사예요. 문장 전체의 동사는 creates.","ko":""},{"s":"The rest of the band **were** sitting with long faces.","q":"were의 진짜 주어는?","o":["band","The rest","faces"],"a":1,"why":"of the band는 꾸밈말. 진짜 주어는 The rest (여기서는 나머지 부원들 = 복수).","ko":""},{"s":"I ran into the music room, **breathing** heavily.","q":"breathing 대신 breathed를 쓰면 안 되는 이유는?","o":["이미 동사 ran이 있어서 접속사 없이 동사를 또 쓸 수 없다","breathe는 자동사라서","heavily가 부사라서"],"a":0,"why":"한 문장에 동사는 하나. 접속사 없이 두 번째 동작은 분사(breathing)로.","ko":""}]},{"id":"rel","title":"관계대명사 기초","sub":"주격·목적격·소유격 — 뒤에 무엇이 빠졌나?","blocks":[{"h":"관계대명사란?","t":"앞의 명사(선행사)를 뒤에서 문장으로 꾸며 주는 연결어예요. \"접속사 + 대명사\" 역할을 한 번에 해요.\n사람 → who / whom · 사물·동물 → which · 둘 다 → that","ex":[{"en":"People **who** experience eco-guilt seek pro-environmental actions.","ko":"환경 죄책감을 경험하는 사람들은 친환경적인 행동을 추구한다.","n":"선행사 People(사람) → who"}]},{"h":"주격 관계대명사 (who / which / that)","t":"관계사 바로 뒤에 동사가 와요. 뒤 문장에 주어가 빠져 있고, 관계사가 그 주어 역할을 해요.\n동사의 수는 선행사에 맞춰요!","ex":[{"en":"the labor movement **that** followed it","ko":"그것을 뒤따른 노동 운동","n":"that 뒤에 바로 동사 followed → 주격"},{"en":"Friction is the force **that** arises when two surfaces are sliding.","ko":"마찰은 두 표면이 미끄러질 때 생기는 힘이다.","n":"arises의 주어가 빠짐 → 주격 that, 선행사 the force(단수) → arises"}]},{"h":"목적격 관계대명사 (whom / which / that) — 생략 가능","t":"관계사 뒤에 \"주어 + 동사\"가 오고, 그 동사의 목적어가 빠져 있어요. 목적격은 생략할 수 있어서 시험에 자주 숨어 나와요.","ex":[{"en":"activities **that** they found meaningful","ko":"그들이 의미 있다고 여긴 활동들","n":"found의 목적어가 빠짐 → 목적격 that"},{"en":"a hobby (that) they like to do in their free time","ko":"그들이 여가 시간에 하고 싶은 취미","n":"목적격 that이 생략됨. do 뒤에 it을 또 쓰면 틀림!"}]},{"h":"소유격 관계대명사 (whose)","t":"whose 뒤에는 바로 명사가 와요. \"그 사람(것)의 ~\"라는 뜻. 뒤 문장은 빠진 게 없어요.","ex":[{"en":"a band **whose** songs everyone loves","ko":"모두가 그 노래를 좋아하는 밴드","n":"whose + 명사(songs)"}]}],"steps":["관계사 앞에 꾸밈받는 명사(선행사)가 있는지 확인. 없으면 관계대명사가 아니라 what 같은 다른 것일 수 있다.","관계사 바로 뒤를 본다: 동사가 오면 주격, \"주어+동사\"가 오고 목적어가 빠졌으면 목적격, 명사가 오면 whose.","선행사가 사람이면 who(m), 사물이면 which, that은 둘 다(단, 콤마·전치사 뒤 ×)."],"quiz":[{"s":"People **who** experience eco-guilt seek pro-environmental actions.","q":"who는 무슨 격?","o":["주격","목적격","소유격"],"a":0,"why":"who 바로 뒤에 동사 experience → 주어가 빠진 자리 → 주격.","ko":""},{"s":"For the first time, people had free time to enjoy activities **that** they found meaningful.","q":"that은 무슨 격?","o":["주격","목적격","소유격"],"a":1,"why":"that 뒤에 they found (주어+동사), found의 목적어가 빠짐 → 목적격.","ko":""},{"s":"Friction is the force **that** [arise / arises] when two surfaces are sliding.","q":"괄호에서 맞는 것은?","o":["arise","arises"],"a":1,"why":"주격 관계대명사 뒤 동사는 선행사(the force, 단수)에 수일치 → arises.","ko":""},{"s":"Nowadays, everybody has a hobby they like to do [ / it ] in their free time.","q":"do 뒤에 it을 쓸까?","o":["쓰지 않는다","it을 쓴다"],"a":0,"why":"목적격 that이 생략된 관계사절이라 목적어(it)가 빠져 있어야 해요.","ko":""},{"s":"the cooks in the family, most of **whom** tended to be women","q":"whom 대신 them을 쓰면?","o":["틀린다 — 문장을 이어 주는 연결어가 없어진다","맞다 — 뜻이 같다"],"a":0,"why":"콤마 뒤 두 문장을 연결하려면 관계대명사(whom)가 필요. them은 연결 기능이 없어요.","ko":""},{"s":"In fact, they must wait with people **who** will be their neighbors.","q":"who 대신 쓸 수 있는 것은?","o":["that","which","whose"],"a":0,"why":"사람 선행사의 주격 → who 또는 that.","ko":""}]},{"id":"that","title":"that 완전 정복","sub":"관계대명사 · 접속사 · 동격 · 강조구문 · 가주어 · 지시사","blocks":[{"h":"that이 어려운 이유","t":"that은 생긴 건 하나인데 역할이 여러 개예요. 구별 열쇠는 딱 두 가지: ① 앞에 명사가 있나? ② 뒤 문장이 완전한가(빠진 성분 없음)?","ex":[]},{"h":"① 관계대명사 that","t":"앞에 명사(선행사) + 뒤 문장이 불완전(주어나 목적어가 빠짐). \"~하는 (명사)\"로 해석.","ex":[{"en":"urgent phone calls **that** take them in and out of the meeting","ko":"그들을 회의에 들락날락하게 만드는 긴급한 전화","n":"앞에 calls, 뒤에 주어 빠짐 → 관계대명사"}]},{"h":"② 접속사 that (명사절: ~라는 것)","t":"동사의 목적어·주어·보어 자리에서 \"~라는 것\"으로 해석. 뒤 문장이 완전해요. 목적어 자리의 that은 생략되기도 해요.","ex":[{"en":"Critics of empathy argue **that** empathy will not save us.","ko":"공감 비판론자들은 공감이 우리를 구하지 못할 것이라고 주장한다.","n":"argue의 목적어, 뒤 문장 완전 → 접속사"},{"en":"A great strength of the market mechanism is **that** there are incentives …","ko":"시장 메커니즘의 큰 장점은 ~라는 것이다.","n":"is의 보어 자리 → 접속사"}]},{"h":"③ 동격 that (명사 = that절)","t":"앞에 fact, idea, expectation, likelihood 같은 명사 + 뒤 문장이 완전. 앞 명사의 내용을 설명해요. \"~라는 (명사)\".","ex":[{"en":"the fact **that** the roots of individualism are in England","ko":"개인주의의 뿌리가 영국에 있다는 사실","n":"앞에 명사 fact가 있지만 뒤 문장이 완전 → 동격"},{"en":"there’s no expectation **that** the meeting will progress in a linear manner","ko":"회의가 선형적으로 진행될 것이라는 예상","n":"expectation = 그 내용"}]},{"h":"④ 강조구문 It is ~ that","t":"It is/was와 that 사이에 강조하고 싶은 말을 넣어요. It is와 that을 지워도 문장이 성립하면 강조구문!","ex":[{"en":"Paradoxically, it’s **uncertainty** that makes us feel most alive.","ko":"역설적으로, 우리를 가장 살아 있다고 느끼게 하는 것은 바로 불확실성이다.","n":"it’s, that을 지우면 Uncertainty makes us feel most alive. → 강조구문"},{"en":"It’s on those occasions that time seems to slow down.","ko":"시간이 느려지는 것 같은 때는 바로 그런 순간들이다.","n":"부사구(on those occasions)도 강조할 수 있어요"}]},{"h":"⑤ 가주어 it ~ 진주어 that","t":"It is + 형용사(possible, clear, natural …) + that절. 진짜 주어는 that절이고 it은 자리만 채워요.","ex":[{"en":"It is possible **that** precautions are not taken.","ko":"예방 조치가 취해지지 않을 가능성이 있다.","n":"possible 뒤의 that절이 진짜 주어"}]},{"h":"⑥ 지시대명사 that (그것, 저것)","t":"혼자서 \"그것\"이란 뜻. 뒤에 동사가 바로 오거나, 앞 내용을 가리켜요.","ex":[{"en":"That did not make it inevitable …","ko":"그것이 ~을 불가피하게 만들지는 않았다.","n":"That = 앞 문장 내용"}]}],"steps":["It is/was ~ that 모양인가? → It is·that을 지워도 문장이 되면 강조구문, It is + 형용사 + that이면 가주어·진주어.","that 앞에 명사가 있나? 없으면 접속사(~라는 것) 또는 지시사.","앞에 명사가 있으면 뒤 문장 확인: 불완전 → 관계대명사, 완전 → 동격(fact, idea, expectation 등)."],"quiz":[{"s":"Other branches may sprout as some members have urgent phone calls **that** take them in and out of the meeting.","q":"that의 역할은?","o":["관계대명사","접속사(~라는 것)","동격","강조구문"],"a":0,"why":"앞에 calls(명사), 뒤에 주어가 빠짐(take의 주어) → 관계대명사.","ko":""},{"s":"Critics of empathy argue **that** empathy will not save us from conflict.","q":"that의 역할은?","o":["관계대명사","접속사(~라는 것)","동격","강조구문"],"a":1,"why":"argue의 목적어 자리, 뒤 문장이 완전 → 명사절 접속사.","ko":""},{"s":"This phenomenon may reflect the fact **that** the roots of individualism are in England.","q":"that의 역할은?","o":["관계대명사","접속사(목적어)","동격","강조구문"],"a":2,"why":"앞에 명사 fact가 있지만 뒤 문장이 완전 → 동격 that (fact의 내용).","ko":""},{"s":"Once a nail is hammered in, it is friction **that** holds it in place.","q":"that의 역할은?","o":["관계대명사","가주어-진주어","동격","강조구문"],"a":3,"why":"It is와 that을 지우면 Friction holds it in place. → 강조구문.","ko":""},{"s":"Therefore, it is possible **that** precautions regarding organizational exclusion are not taken.","q":"that의 역할은?","o":["강조구문","가주어-진주어","관계대명사","동격"],"a":1,"why":"It is + 형용사(possible) + that절 → 가주어 it, 진주어 that절.","ko":""},{"s":"There needs to be a process **that** creates tension and drives the movement.","q":"that의 역할은?","o":["관계대명사","접속사","동격","강조구문"],"a":0,"why":"앞 명사 process, 뒤에 주어 빠짐(creates의 주어) → 관계대명사.","ko":""},{"s":"But there’s no expectation **that** the meeting will progress in a linear manner.","q":"that의 역할은?","o":["관계대명사","동격","강조구문","지시사"],"a":1,"why":"expectation(명사) 뒤에 완전한 문장 → 동격(그 기대의 내용).","ko":""},{"s":"A great strength of the market mechanism is **that** there are incentives for individuals to reveal their knowledge.","q":"that의 역할은?","o":["관계대명사","접속사(보어)","동격","강조구문"],"a":1,"why":"be동사 is의 보어 자리, 뒤 문장 완전 → 명사절 접속사.","ko":""},{"s":"So it is its ability to hold a crease while remaining stiff **that** makes paper uniquely suited to this purpose.","q":"that의 역할은?","o":["강조구문","가주어-진주어","관계대명사","동격"],"a":0,"why":"It is ~ that 사이에 주어(its ability …)를 강조. 지우면 Its ability … makes paper … → 강조구문.","ko":""},{"s":"Most important, people prefer to develop meanings **that** are shared with other people.","q":"that의 역할은?","o":["관계대명사","접속사","동격","지시사"],"a":0,"why":"앞 명사 meanings, 뒤에 주어 빠짐(are shared의 주어) → 관계대명사.","ko":""},{"s":"The likelihood **that** individuals who try to adapt will experience exclusion decreases.","q":"that의 역할은?","o":["관계대명사","동격","강조구문","가주어-진주어"],"a":1,"why":"likelihood(가능성) 뒤에 완전한 문장(individuals … will experience exclusion) → 동격.","ko":""},{"s":"Exclusion is a state **that** is ignored by the organization psychologists.","q":"that의 역할은?","o":["관계대명사","동격","접속사","강조구문"],"a":0,"why":"앞 명사 state, 뒤에 주어 빠짐 → 관계대명사.","ko":""}]},{"id":"what","title":"what vs that","sub":"what = 선행사를 품은 관계대명사 (~하는 것)","blocks":[{"h":"what의 정체","t":"what = the thing(s) which. 그래서 앞에 명사(선행사)가 없어요. 뒤 문장은 불완전(주어나 목적어가 빠짐).\n해석: \"~하는 것\"","ex":[{"en":"When we grieve for **what** is lost, …","ko":"우리가 잃어버린 것을 슬퍼할 때 …","n":"앞에 명사 없음, is의 주어 빠짐 → what"},{"en":"It allowed me to see **what** I am truly capable of.","ko":"그것은 내가 진정으로 무엇을 할 수 있는지 알게 해 주었다.","n":"of의 목적어 빠짐"}]},{"h":"what vs that 한눈에","t":"앞에 명사 O + 뒤 불완전 → 관계대명사 that/which\n앞에 명사 X + 뒤 불완전 → what\n앞에 명사 X + 뒤 완전 → 접속사 that\n앞에 명사 O + 뒤 완전 → 동격 that (fact, idea 등)","ex":[]}],"steps":["앞에 명사가 있으면 what은 절대 불가.","앞에 명사가 없을 때: 뒤가 불완전 → what, 완전 → that."],"quiz":[{"s":"Serious leisure may sound like a contradiction, but that’s [what / that] it takes for an activity to qualify as a hobby.","q":"맞는 것은?","o":["what","that"],"a":0,"why":"앞에 명사 없음 + takes의 목적어가 빠짐 → what(~하는 것).","ko":""},{"s":"Think of events [what / that] shake you out of your everyday routine.","q":"맞는 것은?","o":["what","that"],"a":1,"why":"앞에 명사 events가 있음 → what 불가. 주어 빠짐 → 관계대명사 that.","ko":""},{"s":"Many studies have shown [what / that] animals have a remarkable ability.","q":"맞는 것은?","o":["what","that"],"a":1,"why":"shown의 목적어 자리, 뒤 문장이 완전(animals have a remarkable ability) → 접속사 that.","ko":""},{"s":"Our choice depends on [what / that] we can observe.","q":"맞는 것은?","o":["what","that"],"a":0,"why":"전치사 on 뒤, 앞에 명사 없음, observe의 목적어 빠짐 → what.","ko":""},{"s":"The viewer is asked to understand [what / that] it means to them.","q":"맞는 것은?","o":["what","that"],"a":0,"why":"means의 목적어가 빠짐 + 앞에 명사 없음 → what.","ko":""},{"s":"A perfectly competitive market [what / that] clears on the spot leaves no room.","q":"맞는 것은?","o":["what","that"],"a":1,"why":"앞에 명사 market → 관계대명사 that.","ko":""}]},{"id":"relad","title":"관계부사와 전치사+관계대명사","sub":"where · when · why · how / in which · of which — 뒤 문장이 완전하다!","blocks":[{"h":"관계부사","t":"관계부사 = 전치사 + which. 뒤 문장에 빠진 성분이 없어요(완전).\n장소 → where (= in/at which) · 시간 → when · 이유 → why · 방법 → how (the way와 함께 쓰지 않음)","ex":[{"en":"Einstein went to a place **where** he could be completely relaxed.","ko":"아인슈타인은 완전히 편안해질 수 있는 곳으로 갔다.","n":"he could be completely relaxed — 빠진 것 없음 → where"},{"en":"pre-modern Europe, **where** higher latitudes make the seasons easily observable","ko":"더 높은 위도로 계절을 쉽게 관찰할 수 있었던 전근대 유럽","n":"완전한 문장 → where"}]},{"h":"전치사 + 관계대명사","t":"in which, of which, for whom처럼 전치사가 앞으로 오면 뒤 문장은 완전해요. 전치사 뒤에는 that을 못 써요.","ex":[{"en":"a system **in which** islands of cash exchange exist","ko":"현금 교환의 섬들이 존재하는 체계","n":"exist까지 완전 → in which"},{"en":"It’s the friction **with which** we need to concern ourselves.","ko":"우리가 신경 써야 하는 것은 바로 그 마찰이다.","n":"concern ourselves with the friction에서 with가 앞으로"},{"en":"The cellulose fibers **of which** it is made …","ko":"그것을 만드는 셀룰로오스 섬유는 …","n":"it is made of the fibers"}]},{"h":"which vs where 판별","t":"which 뒤 → 불완전(주어·목적어 빠짐) / where 뒤 → 완전.\nthe place which I visited (visited의 목적어 빠짐) vs the place where I live (완전)","ex":[]}],"steps":["선행사 뒤 문장을 끝까지 읽고 빠진 성분이 있는지 본다.","빠진 게 없으면 관계부사(where/when) 또는 전치사+which.","빠진 게 있으면 관계대명사(which/that/who)."],"quiz":[{"s":"Einstein used sailing to go to a place [which / where] he could be completely relaxed.","q":"맞는 것은?","o":["which","where"],"a":1,"why":"he could be completely relaxed는 빠진 성분이 없는 완전한 문장 → where.","ko":""},{"s":"Frontiers offer places [which / where] the new cheap things can be seized.","q":"맞는 것은?","o":["which","where"],"a":1,"why":"the new cheap things can be seized — 완전 → where.","ko":""},{"s":"Capitalism is one [which / in which] islands of cash exchange exist.","q":"맞는 것은?","o":["which","in which"],"a":1,"why":"islands … exist — 완전 → 전치사+관계대명사 in which.","ko":""},{"s":"This creates new types of tensions, [which / where] the rhythm is unambiguous and predictable.","q":"맞는 것은?","o":["which","where"],"a":1,"why":"the rhythm is unambiguous — 완전 → where.","ko":""},{"s":"Plastic sheeting doesn’t hold a crease unless it is very soft, in [which / that] case it lacks rigidity.","q":"맞는 것은?","o":["which","that"],"a":0,"why":"전치사 뒤에는 that 불가 → in which case.","ko":""},{"s":"the largely nomadic peoples of Arabia, [whom / for whom] seasonal changes were less significant","q":"맞는 것은?","o":["whom","for whom"],"a":1,"why":"seasonal changes were less significant — 완전 → 전치사+관계대명사 for whom (그들에게는).","ko":""}]},{"id":"nonres","title":"계속적 용법 (, which / , who)","sub":"콤마 뒤 관계사 — that 금지, 앞 문장 전체도 받는다","blocks":[{"h":"콤마 + 관계사","t":"콤마 뒤 관계사는 앞 내용을 \"그리고 그것은 ~\" 처럼 덧붙여 설명해요.\n· 콤마 뒤에는 that을 쓸 수 없어요 → which / who(m)\n· , which는 앞 문장 전체를 받을 수도 있어요 (이때 동사는 단수)","ex":[{"en":"On a boat, he forgot everything else in the world, **which** may explain why he enjoyed sailing so much.","ko":"배 위에서 그는 세상의 다른 모든 것을 잊었고, 그것이 그가 항해를 그렇게 좋아한 이유를 설명할지도 모른다.","n":"which = 앞 문장 전체"},{"en":"Loyalists burned his effigy, **which** they nicknamed the “guy.”","ko":"충성파들은 그의 인형을 태웠는데, 그들은 그것을 \"guy\"라는 별명으로 불렀다.","n":"which = his effigy (목적격)"}]},{"h":"수량 표현 + of whom / of which","t":"most of whom, some of which, all of which … 처럼 써요. them/it으로 바꾸면 접속사가 없어져서 틀려요.","ex":[{"en":"the cooks in the family, most of **whom** tended to be women","ko":"가족의 요리사들, 그리고 그들 중 대부분은 여성이었다","n":"most of them ×"}]}],"steps":["콤마 바로 뒤 관계사 자리 → that 금지.","앞 문장 전체를 받으면 which + 단수 동사.","\"수량 + of\" 뒤에서는 whom/which."],"quiz":[{"s":"Precautions need to be taken regarding organizational exclusion, [that / which] is very important for business.","q":"맞는 것은?","o":["that","which"],"a":1,"why":"콤마 뒤(계속적 용법)에는 that을 쓸 수 없어요.","ko":""},{"s":"Many animals pursue a mixed strategy, which [lead / leads] one to ask a question.","q":"맞는 것은?","o":["lead","leads"],"a":1,"why":"which가 앞 내용(전략, 단수)을 받음 → leads.","ko":""},{"s":"this was liberating for the cooks in the family, most of [them / whom] tended to be women","q":"맞는 것은?","o":["them","whom"],"a":1,"why":"두 절을 잇는 연결어가 필요 → whom.","ko":""},{"s":"Numerous amateur astronomers have discovered comets, which [help / helps] us to better understand the universe.","q":"맞는 것은?","o":["help","helps"],"a":1,"why":"which = 앞 문장 전체(발견한 일) → 단수 helps.","ko":""}]},{"id":"part","title":"분사 (-ing / p.p.)","sub":"능동이면 -ing, 수동이면 p.p.","blocks":[{"h":"명사를 꾸미는 분사","t":"명사가 그 동작을 \"하면\" 현재분사(-ing), \"당하면\" 과거분사(p.p.).","ex":[{"en":"a band **called** A Happy Accident","ko":"A Happy Accident라고 불리는 밴드","n":"밴드가 불림 → called"},{"en":"subjects **linked** in some way to the main meeting","ko":"주요 회의와 어떤 식으로든 연결된 주제들","n":"주제가 연결됨 → linked"}]},{"h":"분사구문","t":"접속사와 주어를 빼고 동사를 -ing / p.p.로 바꾼 것. 문장의 주어가 그 동작을 하면 -ing, 당하면 p.p.","ex":[{"en":"I ran into the music room, **breathing** heavily.","ko":"나는 숨을 가쁘게 쉬며 음악실로 뛰어 들어갔다.","n":"내가 숨을 쉼 → breathing"},{"en":"**Curious** about the man’s question, Ridge pulled out his phone.","ko":"그 남자의 질문에 호기심을 느끼고, Ridge는 휴대폰을 꺼냈다.","n":"Being 생략"}]},{"h":"감정동사","t":"excite, surprise, satisfy, astonish …: 감정을 일으키면 -ing(사물), 감정을 느끼면 p.p.(사람).","ex":[{"en":"unexpected plot twists and **astonishing** endings","ko":"예기치 못한 반전과 놀라운 결말","n":"결말이 놀라게 함 → astonishing"}]}],"steps":["꾸밈받는 명사(또는 문장 주어)를 찾는다.","그것이 동작을 하나(-ing), 당하나(p.p.)?","감정동사면 사람/사물 확인."],"quiz":[{"s":"A meeting in a flexible-time culture like those [finding / found] in South America …","q":"맞는 것은?","o":["finding","found"],"a":1,"why":"those(회의들)가 발견되는 것 → 수동 found.","ko":""},{"s":"“A band [calling / called] A Happy Accident,” she said.","q":"맞는 것은?","o":["calling","called"],"a":1,"why":"밴드가 불림 → called.","ko":""},{"s":"Thanks to a feel-good chemical in the brain [calling / called] dopamine …","q":"맞는 것은?","o":["calling","called"],"a":1,"why":"화학 물질이 도파민이라고 불림 → called.","ko":""},{"s":"the most popular movies are the ones with unexpected plot twists and [astonishing / astonished] endings","q":"맞는 것은?","o":["astonishing","astonished"],"a":0,"why":"결말이 (사람을) 놀라게 함 → astonishing.","ko":""},{"s":"The atoms move apart from one another, [vibrating / vibrated] more rapidly.","q":"맞는 것은?","o":["vibrating","vibrated"],"a":0,"why":"원자들이 직접 진동함 → vibrating.","ko":""}]},{"id":"toger","title":"to부정사 vs 동명사","sub":"동사에 따라, 전치사 뒤인지에 따라","blocks":[{"h":"to부정사를 쓰는 경우","t":"want, hope, decide, plan, expect, wish, tend, be likely, encourage + O + to …\n명사 뒤에서 \"~할\", 목적 \"~하기 위해\"","ex":[{"en":"The most valuable feedback is likely **to come** from other sources.","ko":"가장 가치 있는 피드백은 다른 곳에서 나올 가능성이 있다.","n":"be likely to"},{"en":"You may well want **to show** it to your nearest and dearest.","ko":"당신은 그것을 가장 가까운 사람들에게 보여 주고 싶을 것이다.","n":"want to"}]},{"h":"동명사를 쓰는 경우","t":"enjoy, avoid, consider, finish, mind, keep, include, involve, end up + -ing\n전치사 뒤 → 무조건 -ing (look forward to -ing 같은 to도 전치사!)\n문장의 주어 자리 → -ing","ex":[{"en":"we are considering **working** with a new printing company","ko":"새로운 인쇄 업체와 일하는 것을 고려하고 있다","n":"consider -ing"},{"en":"Before **proceeding**, we would like to ask …","ko":"진행하기 전에 문의하고 싶습니다","n":"전치사 Before 뒤"}]}],"steps":["앞의 동사를 확인 (want류 → to / enjoy류 → -ing).","앞이 전치사면 -ing.","명사 뒤 \"~할\" → to부정사."],"quiz":[{"s":"We are considering [working / to work] with a new printing company.","q":"맞는 것은?","o":["working","to work"],"a":0,"why":"consider + 동명사.","ko":""},{"s":"Before [proceed / proceeding], we would like to ask you how much it would cost.","q":"맞는 것은?","o":["proceed","proceeding"],"a":1,"why":"전치사 Before 뒤 → 동명사.","ko":""},{"s":"They wanted [getting / to get] help.","q":"맞는 것은?","o":["getting","to get"],"a":1,"why":"want + to부정사.","ko":""},{"s":"the cost of [maintain / maintaining] fat","q":"맞는 것은?","o":["maintain","maintaining"],"a":1,"why":"전치사 of 뒤 → 동명사.","ko":""},{"s":"Many students end up [living / to live] in the lounge.","q":"맞는 것은?","o":["living","to live"],"a":0,"why":"end up + -ing.","ko":""}]},{"id":"agree","title":"수일치","sub":"진짜 주어를 찾아 동사의 수를 맞춘다","blocks":[{"h":"기본","t":"주어가 단수 → is/was/has/동사-s, 복수 → are/were/have/동사원형. 주어와 동사 사이 수식어에 속지 마세요.","ex":[{"en":"A meeting in a flexible-time culture … **is** more like an evergreen tree.","ko":"유연한 시간 문화의 회의는 상록수와 더 비슷하다.","n":"주어 A meeting(단수)"}]},{"h":"헷갈리는 주어","t":"every/each/everybody → 단수 · 동명사·명사절 주어 → 단수 · the number of → 단수, a number of → 복수 · There is/are → 뒤 명사에 맞춤 · 주격 관계대명사 뒤 동사 → 선행사에 맞춤","ex":[{"en":"Everybody **has** a hobby.","ko":"누구나 취미가 있다.","n":"everybody 단수"},{"en":"There **are** challenges associated with bioremediation.","ko":"생물학적 정화와 관련된 어려움들이 있다.","n":"challenges 복수"}]}],"steps":["동사를 찾는다.","주어까지 거슬러 올라가며 수식어를 괄호로 지운다.","주어의 수에 맞춘다."],"quiz":[{"s":"A meeting in a flexible-time culture like those found in South America [is / are] more like an evergreen tree.","q":"맞는 것은?","o":["is","are"],"a":0,"why":"주어는 A meeting(단수). like … America는 꾸밈말.","ko":""},{"s":"Everybody [has / have] a hobby they like to do.","q":"맞는 것은?","o":["has","have"],"a":0,"why":"everybody는 단수.","ko":""},{"s":"There [is / are] challenges associated with bioremediation.","q":"맞는 것은?","o":["is","are"],"a":1,"why":"There + be 뒤의 challenges(복수)에 맞춤.","ko":""},{"s":"The excitement that arises in this process [create / creates] satisfaction.","q":"맞는 것은?","o":["create","creates"],"a":1,"why":"주어 The excitement(단수). that절은 꾸밈말.","ko":""},{"s":"Good news, financial rewards, and gifts [is / are] more enjoyable if they are surprises.","q":"맞는 것은?","o":["is","are"],"a":1,"why":"A, B, and C → 복수.","ko":""}]},{"id":"voice","title":"능동 vs 수동","sub":"주어가 하나, 당하나","blocks":[{"h":"수동태 = be + p.p.","t":"주어가 동작을 당하면 수동태. 뒤에 목적어가 없는 경우가 많아요.\n자동사(happen, arise, occur, appear, remain, exist)는 수동태가 없어요!","ex":[{"en":"An agenda will probably **be circulated** before the meeting.","ko":"의제는 아마 회의 전에 배부될 것이다.","n":"의제가 배부됨"},{"en":"This **is seen** in the measureless prelude as well.","ko":"이것은 마디가 없는 전주곡에서도 보인다.","n":"This가 보여짐"}]}],"steps":["주어와 동사의 관계: 하면 능동, 당하면 수동.","뒤에 목적어가 있으면 보통 능동.","자동사는 수동 불가."],"quiz":[{"s":"An agenda will probably [circulate / be circulated] before the meeting.","q":"맞는 것은?","o":["circulate","be circulated"],"a":1,"why":"의제가 배부됨 → 수동.","ko":""},{"s":"The excitement that [arouses / arises] in this process …","q":"맞는 것은?","o":["arouses","arises"],"a":1,"why":"\"생기다\"는 자동사 arise. arouse는 \"불러일으키다\"(목적어 필요).","ko":""},{"s":"Someone believes something is going to [happen / be happened].","q":"맞는 것은?","o":["happen","be happened"],"a":0,"why":"happen은 자동사라 수동태가 없어요.","ko":""},{"s":"When people [remind / are reminded] of deeds they have done …","q":"맞는 것은?","o":["remind","are reminded"],"a":1,"why":"사람들이 상기됨(당함) → 수동.","ko":""}]},{"id":"conj","title":"접속사 vs 전치사 · 병렬 · 도치","sub":"뒤에 절이냐 명사냐 / and 앞뒤 형태 / Only·Not only 도치","blocks":[{"h":"접속사 vs 전치사","t":"뒤에 주어+동사 → 접속사(because, while, although) / 뒤에 명사 → 전치사(because of, during, despite).","ex":[{"en":"**While** reviewing several options, we felt …","ko":"여러 선택지를 검토하던 중 …","n":"while + -ing 가능 (during 불가)"}]},{"h":"병렬","t":"and/or/but 앞뒤는 같은 모양으로.","ex":[{"en":"There needs to be a process that creates tension and **drives** the movement.","ko":"긴장감을 만들고 악장을 몰아가는 과정이 필요하다.","n":"creates and drives"}]},{"h":"도치","t":"Only + 부사(구/절), Not only, Never, Little이 문장 앞에 오면 조동사 + 주어 순서.","ex":[{"en":"Only when you’re happy … **should you** show it to someone else.","ko":"만족할 때만 그것을 다른 사람에게 보여 줘야 한다.","n":"should you"}]}],"steps":["뒤에 동사가 있으면 접속사.","and 앞의 짝을 찾아 같은 모양.","부정어가 맨 앞이면 도치."],"quiz":[{"s":"[During / While] reviewing several options, we felt that your design suited our needs.","q":"맞는 것은?","o":["During","While"],"a":1,"why":"뒤에 -ing가 오면 while(주어+be 생략). during 뒤에는 명사.","ko":""},{"s":"Only when you’re happy that you’ve done your best [you should / should you] show it.","q":"맞는 것은?","o":["you should","should you"],"a":1,"why":"Only when … 이 앞에 → 도치.","ko":""},{"s":"a process that creates tension and [drive / drives] the movement","q":"맞는 것은?","o":["drive","drives"],"a":1,"why":"creates와 병렬 → drives.","ko":""},{"s":"stored food is more economical than body fat [because / because of] fat contributes to body mass","q":"맞는 것은?","o":["because","because of"],"a":0,"why":"뒤에 주어+동사(fat contributes) → 접속사 because.","ko":""}]}]}</script>
<title>고2 영어 공부장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: one narrow study column like a workbook page; sticky top bar, steps as a tab strip, paper cards only around what is being solved. */
:root{
  --paper:#f3f8ff; --sheet:#ffffff; --ink:#1b2433; --ink2:#4f5d75; --rule:#d6e2f3;
  --blue:#2f6bff; --bluebg:#e4eeff; --red:#f0443a; --redbg:#ffe8e6; --green:#0f9d58; --greenbg:#dcf7e9; --hl:#fff27a; --violet:#8b5cf6; --violetbg:#f1ebff;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --text:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#f3f8ff; --sheet:#ffffff; --ink:#1b2433; --ink2:#4f5d75; --rule:#d6e2f3;
  --blue:#2f6bff; --bluebg:#e4eeff; --red:#f0443a; --redbg:#ffe8e6; --green:#0f9d58; --greenbg:#dcf7e9; --hl:#fff27a; --violet:#8b5cf6; --violetbg:#f1ebff; color-scheme:light}}
:root[data-theme="dark"]{
  --paper:#f3f8ff; --sheet:#ffffff; --ink:#1b2433; --ink2:#4f5d75; --rule:#d6e2f3;
  --blue:#2f6bff; --bluebg:#e4eeff; --red:#f0443a; --redbg:#ffe8e6; --green:#0f9d58; --greenbg:#dcf7e9; --hl:#fff27a; --violet:#8b5cf6; --violetbg:#f1ebff; color-scheme:light}
*{box-sizing:border-box}
:root{color-scheme:light}
.top{background:rgba(255,255,255,.92)!important;backdrop-filter:blur(6px)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.wfab{background:var(--blue);color:#fff}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.6 var(--ui)}
button{font:inherit;color:inherit}
#app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);padding-block:10px 8px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:6px;min-width:0}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.grow{flex:1;min-width:0}
.ghost{border:0;background:none;color:var(--ink2);padding:6px 8px;border-radius:8px;cursor:pointer;white-space:nowrap}
.ghost:hover{background:var(--sheet);color:var(--ink)}
.packsel{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.packsel::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.chip.add{color:var(--blue);border-style:dashed}
h1{font-size:22px;line-height:1.3;margin:18px 0 2px;text-wrap:balance}
h2{font-size:17px;margin:22px 0 8px}
.sub{color:var(--ink2);font-size:13px}
.stats{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--ink2)}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:7px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--sheet);font-weight:700}
.btn.warn{color:var(--red);border-color:var(--red)}
.btn.good{color:var(--green);border-color:var(--green)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cont{display:flex;align-items:center;gap:12px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;margin:6px 0 4px;cursor:pointer;width:100%;text-align:left}
.cont .grow b{display:block}
.units{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.unit{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 4px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;cursor:pointer;width:100%}
.unit:hover{background:var(--sheet)}

<script>
'use strict';
/* ========== utilities ========== */
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);else if(k==='value')e.value=v;else if(k==='checked'||k==='selected'||k==='disabled')e[k]=!!v;else e.setAttribute(k,v===true?'':v)}for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c instanceof Node?c:document.createTextNode(String(c)))}return e}
function fill(el,...k){el.replaceChildren(...k.flat(9).filter(x=>x!=null&&x!==false));return el}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm=s=>String(s||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/[“”]/g,'"').replace(/[^a-z0-9가-힣' ]+/g,' ').replace(/\s+/g,' ').trim();
const nk=s=>norm(s).replace(/\s/g,'');
const CIRC='❶❷❸❹❺❻❼❽❾❿⓫⓬⓭⓮⓯⓰⓱⓲⓳⓴';
const num=i=>CIRC[i]||('('+(i+1)+')');
function hash(s){let x=2166136261;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)}return x>>>0}
function rng(seed){return()=>{seed=(seed+0x6D2B79F5)>>>0;let t=seed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

/* ========== packs & progress ========== */
const STEPS=[
  {id:'lesson',name:'수업',desc:'한 문장씩 설명 듣고 바로 확인 문제 풀기',has:u=>!!(u.lines&&u.lines.length)},
  {id:'read',name:'읽기',desc:'본문 전체 훑어보기 · 해석 가리고 복습',has:u=>!!(u.lines&&u.lines.length)},
  {id:'choice',name:'고르기',desc:'둘 중 맞는 어법·어휘 고르기',has:u=>!!(u.lines&&u.lines.some(l=>l.c&&l.c.length))},
  {id:'recall',name:'쓰기',desc:'고르던 자리에 정답 직접 쓰기',has:u=>!!(u.lines&&u.lines.some(l=>l.c&&l.c.length))},
  {id:'order',name:'배열',desc:'우리말 보고 어구 순서 맞추기',has:u=>!!(u.lines&&u.lines.some(l=>segsOf(resolved(l))))},
  {id:'sheet',name:'실전',desc:'서술형 워크시트 풀기',has:u=>!!(u.sheet&&u.sheet.q&&u.sheet.q.length)},
  {id:'write',name:'영작',desc:'핵심 문장 통째로 쓰기',has:u=>!!(u.write&&u.write.length)},
];
let INDEX=[];const LOADED={};let pack=null,prog=null,V=null;
const UI={one:true,pg:{},wordTap:true,hideWordM:false,hideKo:false,points:true,openWhy:false,wmode:'cond',wrongStep:'all',guide:true};
try{Object.assign(UI,JSON.parse(LS.get('sp:ui')||'{}'))}catch(e){}
function saveUI(){LS.set('sp:ui',JSON.stringify(UI))}
function validPack(p){return!!(p&&typeof p==='object'&&/^study-pack@1/.test(p.schema||'')&&typeof p.id==='string'&&/^[A-Za-z0-9_.\-]{1,80}$/.test(p.id)&&Array.isArray(p.units))}
async function loadIndex(){
  let list=[];
  const emb=document.getElementById('embedded-packs'); // offline single-file build: packs are inlined, no fetch needed
  if(emb){try{for(const p of JSON.parse(emb.textContent).packs){if(validPack(p)){LOADED[p.id]=p;list.push({id:p.id,title:p.title,short:p.short||p.title,scope:p.scope||'',imported:false})}}}catch(e){}}
  if(!list.length)try{const r=await fetch('packs/index.json',{cache:'no-cache'});if(r.ok){const j=await r.json();list=(j.packs||[]).map(p=>({...p,imported:false}))}}catch(e){}
  let imp=[];try{imp=JSON.parse(LS.get('sp:imp')||'[]')}catch(e){}
  for(const id of imp){let p=null;try{p=JSON.parse(LS.get('sp:imp:'+id)||'null')}catch(e){}if(validPack(p)){LOADED[p.id]=p;if(!list.some(x=>x.id===p.id))list.push({id:p.id,title:p.title,short:p.short||p.title,scope:p.scope||'',imported:true})}}
  INDEX=list;
}
async function openPack(id){
  const meta=INDEX.find(x=>x.id===id)||INDEX[0];if(!meta)return;
  if(!LOADED[meta.id]){const r=await fetch(meta.file,{cache:'no-cache'});if(!r.ok)throw new Error('자료 파일을 불러오지 못했어요 ('+r.status+')');const p=await r.json();if(!validPack(p))throw new Error('자료 형식이 올바르지 않아요');LOADED[meta.id]=p}
  pack=LOADED[meta.id];prog=loadProg(pack.id);migrate();LS.set('sp:pack',pack.id);Sync.pull();
}
function loadProg(id){let p=null;try{p=JSON.parse(LS.get('sp:p:'+id)||'null')}catch(e){}return p&&p.v===1?p:{v:1,t:0,it:{},read:{},last:null}}
let saveT=null;
function save(){clearTimeout(saveT);saveT=null;prog.t=Date.now();LS.set('sp:p:'+pack.id,JSON.stringify(prog));Sync.push()}
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,600)}
window.addEventListener('pagehide',()=>{if(saveT)save()});
function I(k){return prog.it[k]||(prog.it[k]={})}
function unitById(id){return pack.units.find(u=>u.id===id)}
function migrate(){ // answers typed in the earlier worksheet-only version of this page
  const m=pack.id.match(/^mock-20(\d\d)-09-g2$/);if(!m||prog.mig)return;
  let old=null;try{old=JSON.parse(LS.get('ws_state')||'null')}catch(e){}
  if(old&&old.prog){for(const k in old.prog){const p=k.split('|');if(p.length===3&&p[0]===m[1]&&unitById(p[1])){const k2='s|'+p[1]+'|'+p[2];if(!prog.it[k2])prog.it[k2]=old.prog[k]}}}
  prog.mig=1;save();
}
const Sync={db:null,uid:null,state:'local',timer:null,
  async init(){try{if(!window.claude||!window.claude.use)return;const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;const uid=await user.id();if(!uid)return;this.db=db;this.uid=uid;this.state='on';await this.pull();paintSync()}catch(e){}},
  ref(){return this.db.doc('data/users/'+this.uid+'/'+pack.id)},
  async pull(){if(!this.db||!pack)return;try{const s=await this.ref().get();
    if(s.exists){const d=s.data()||{};let r=null;try{r=JSON.parse(d.p||'null')}catch(e){}
      if(r&&r.v===1&&(r.t||0)>(prog.t||0)){prog=r;LS.set('sp:p:'+pack.id,JSON.stringify(prog));if(!document.activeElement||!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()}
      else if((prog.t||0)>(d.t||0))this.push(true)}
    else if(prog.t)this.push(true);this.state='on'}catch(e){this.state='err'}paintSync()},

};
function syncText(){return Sync.state==='on'?'기록이 계정에 저장되어 다른 기기에서도 이어서 할 수 있어요':Sync.state==='err'?'계정 저장이 잠시 안 돼요 · 이 기기에는 저장됨':'기록은 이 기기 브라우저에 저장돼요'}

/* ========== line helpers ========== */
function parts(l){const out=[];const re=/\{(\d+)\}/g;let last=0,m;while((m=re.exec(l.en))){if(m.index>last)out.push({t:l.en.slice(last,m.index)});out.push({i:+m[1]});last=re.lastIndex}if(last<l.en.length)out.push({t:l.en.slice(last)});return out}
function ansOf(c){return c.o[c.a]}
function resolved(l){return l.en.replace(/\{(\d+)\}/g,(_,i)=>l.c&&l.c[i]?ansOf(l.c[i]):'')}
const SEGC=new Map();
function segsOf(text){if(SEGC.has(text))return SEGC.get(text);const w=text.split(/\s+/).filter(Boolean);const n=w.length;let s=null;
  if(n>=4){const target=Math.min(8,Math.max(3,Math.ceil(n/3)));const size=Math.ceil(n/target);s=[];let cur=[];for(const x of w){cur.push(x);if(cur.length>=size||(/[,;:]$/.test(x)&&cur.length>=2)){s.push(cur.join(' '));cur=[]}}if(cur.length)s.push(cur.join(' '));if(s.length<3)s=null}
  SEGC.set(text,s);return s}
function shuffled(n,seed){const r=rng(seed);const idx=[...Array(n).keys()];for(let t=0;t<6;t++){for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}if(idx.some((v,i)=>v!==i))break}return idx}

const TOPICS={
 '수일치':{s:'동사는 진짜 주어의 수(하나인지 여럿인지)에 맞춰요.',how:['동사 앞에서 진짜 주어를 찾아요.','주어 뒤에 붙은 꾸밈말(전치사구, 관계사절, 분사구)은 지우고 봐요.','주어가 하나면 is·was·has·동사-s, 여럿이면 are·were·have·동사원형.'],trap:'each·every·everybody, 동명사 주어는 단수 / the number of는 단수, a number of는 복수 / There is·are는 뒤에 오는 명사에 맞춰요.',ex:'The rest of the band [was / were] sitting. → 진짜 주어 the rest(밴드 나머지 = 여럿) → were'},

function chunkEl(l,cls){ // slash reading: break before clause starters and longer prepositional phrases

    if(cur.length>=2&&(BRK.has(lw)||(PRP.has(lw)&&cur.length>=3)))groups.push(cur),cur=[];
    cur.push(w);if(/[,;:—]$/.test(txt(w))&&cur.length>=2)groups.push(cur),cur=[]});

  const wordEl=w=>{const out=[];const re=/\{(\d+)\}/g;let last=0,m;while((m=re.exec(w))){if(m.index>last)out.push(w.slice(last,m.index));const c=l.c[+m[1]];out.push(h('span',{class:'pt'},ansOf(c),h('sup',{class:'tgs'},topicOf(c))));last=re.lastIndex}if(last<w.length)out.push(w.slice(last));return out};
  return h('p',{class:'en chunks'+(cls?' '+cls:'')},groups.map((g,k)=>[k?h('span',{class:'sl2'},' / '):null,h('span',{class:'ck'},g.map((w,j)=>[j?' ':null,wordEl(w)]))]));
}

/* ========== progress ========== */
function stepStat(u,step){
  let tot=0,done=0,ok=0;
  if(step==='read')return{tot:1,done:prog.read[u.id]?1:0,ok:prog.read[u.id]?1:0};
  if(step==='lesson'){const st=prog.it['les|'+u.id]||{};const n=u.lines.length;return{tot:n,done:st.done?n:Math.min(st.i||0,n),ok:st.done?n:Math.min(st.i||0,n)}}
  if(step==='choice')u.lines.forEach((l,li)=>{if(!l.c)return;const st=prog.it['c|'+u.id+'|'+li]||{};l.c.forEach((c,j)=>{tot++;if(st.s&&st.s[j]!=null){done++;if(st.s[j]===c.a)ok++}})});
  if(step==='recall')u.lines.forEach((l,li)=>{if(!l.c)return;const st=prog.it['r|'+u.id+'|'+li]||{};l.c.forEach((c,j)=>{tot++;if(st.s&&st.s[j]){done++;if(st.s[j]===1)ok++}})});
  if(step==='order')u.lines.forEach((l,li)=>{if(!segsOf(resolved(l)))return;tot++;const st=prog.it['o|'+u.id+'|'+li]||{};if(st.s){done++;if(st.s===1)ok++}});
  if(step==='sheet')u.sheet.q.forEach(q=>{tot++;const r=prog.it['s|'+u.id+'|'+q.n]||{};if(r.ok===true||r.ok===false){done++;if(r.ok)ok++}});
  if(step==='write')u.write.forEach((x,i)=>{tot++;const r=prog.it['w|'+u.id+'|'+i]||{};if(r.ok===true||r.ok===false){done++;if(r.ok)ok++}});
  return{tot,done,ok};
}

  if(it.t==='q')return u.lines[x]?cardChoice(u,x,null,'q'):null;
